name: Русский язык PR

on:
  issue_comment:
    types:
      - created
      - edited
  pull_request_review_comment:
    types:
      - created
      - edited
  pull_request_review:
    types:
      - submitted
      - edited

permissions:
  contents: read

jobs:
  pr-language:
    name: PR comments на русском
    runs-on: ubuntu-latest
    if: >-
      github.event.sender.type != 'Bot' &&
      (
        github.event_name == 'pull_request_review_comment' ||
        github.event_name == 'pull_request_review' ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request)
      )

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Проверить русский язык PR
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          event_name = os.environ["GITHUB_EVENT_NAME"]
          event_path = os.environ["GITHUB_EVENT_PATH"]
          with open(event_path, encoding="utf-8") as handle:
              event = json.load(handle)

          if event_name == "issue_comment":
              title = ""
              body = event["comment"].get("body") or ""
              kind = "PR comment"
          elif event_name == "pull_request_review_comment":
              title = ""
              body = event["comment"].get("body") or ""
              kind = "PR review comment"
          elif event_name == "pull_request_review":
              title = ""
              body = event["review"].get("body") or ""
              kind = "PR review"
              if not body.strip():
                  raise SystemExit(0)
          else:
              raise SystemExit(f"Unsupported event: {event_name}")

          subprocess.run(
              [
                  sys.executable,
                  "scripts/check_pr_language.py",
                  "--kind",
                  kind,
                  "--title",
                  title,
                  "--body",
                  body,
              ],
              check=True,
          )
          PY
