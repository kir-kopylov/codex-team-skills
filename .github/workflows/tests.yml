name: Проверки

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pytest:
    name: pytest и language policy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package and test dependencies
        run: python -m pip install ".[test]"

      - name: Run tests and language policy checks
        run: python -m pytest
