name: Проверки

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pr-governance:
    name: PR title/body governance
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check PR title/body policy
        run: python3 scripts/check_pr_governance.py metadata

  plugin-version-gate:
    name: Codex plugin semver gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a higher plugin version for plugin changes
        run: python3 scripts/check_plugin_version_bump.py --base-ref "origin/${{ github.base_ref }}"

  pytest:
    name: pytest, language policy и privacy gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package and test dependencies
        run: python -m pip install ".[test]"

      - name: Run tests and policy checks
        run: python -m pytest

  native-codex-marketplace-smoke:
    name: Native Codex marketplace smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: pytest
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the minimum supported Codex version
        run: npm install --global @openai/codex@0.144.4

      - name: Test the checked-out marketplace
        run: python scripts/smoke_native_codex_marketplace.py --source "${{ github.workspace }}"

      - name: Test the Git marketplace source
        run: >-
          python scripts/smoke_native_codex_marketplace.py
          --source kir-kopylov/codex-team-skills
          --ref "${{ github.head_ref || github.ref_name }}"

  claude-sync-smoke:
    name: Claude skills folder sync smoke
    runs-on: ubuntu-latest
    needs: pytest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync team skills into a temp Claude skills folder
        run: |
          set -euo pipefail
          dest="$(mktemp -d -t 'claude skills test.XXXXXX')"
          mkdir -p "$dest/local-only"
          printf '%s\n' '---' 'name: local-only' 'description: local only' '---' '# Local Only' > "$dest/local-only/SKILL.md"
          CLAUDE_SKILLS_DIR="$dest" ./scripts/pull-skills.sh
          test -f "$dest/add-team-skill/SKILL.md"
          test -f "$dest/local-only/SKILL.md"
