name: Проверки

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pr-governance:
    name: PR title/body governance
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check PR title/body policy
        run: python3 scripts/check_pr_governance.py metadata

  installer-release-gate:
    name: Installer/release protected paths gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check protected installer/release paths
        run: python3 scripts/check_pr_governance.py protected-paths

  release-scope:
    name: Release/installer scope
    runs-on: ubuntu-latest
    outputs:
      run_release_checks: ${{ steps.detect.outputs.run_release_checks }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect release/installer scope
        id: detect
        run: python3 scripts/check_pr_governance.py release-scope | tee -a "$GITHUB_OUTPUT"

  pytest:
    name: pytest, language policy и privacy gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package and test dependencies
        run: python -m pip install ".[test]"

      - name: Run tests and language policy checks
        run: python -m pytest

  build-release-bundle:
    name: Build installable team-skills bundle
    runs-on: ubuntu-latest
    if: needs.release-scope.outputs.run_release_checks == 'true'
    needs:
      - pr-governance
      - installer-release-gate
      - release-scope
      - pytest
      - claude-sync-smoke

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Build installable team-skills bundle
        run: python scripts/build_release_bundle.py

      - name: Upload installable bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-skills-installable-bundle
          path: dist/*

  windows-powershell-smoke:
    name: Windows PowerShell 5.1 release asset smoke
    runs-on: windows-latest
    if: needs.build-release-bundle.result == 'success'
    needs: build-release-bundle

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download installable bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: team-skills-installable-bundle
          path: dist

      - name: Parse and validate Windows PowerShell assets
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $PWD "dist"
          $assets = @(
            "install-team-skills.ps1",
            "bootstrap-team-skills.ps1",
            "update-team-skills.ps1",
            "uninstall-team-skills.ps1",
            "team-skills-status.ps1"
          )

          foreach ($name in $assets) {
            $path = Join-Path $dist $name
            if (-not (Test-Path $path)) {
              throw "Missing release asset: $name"
            }

            $bytes = [System.IO.File]::ReadAllBytes($path)
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
              throw "Missing UTF-8 BOM: $name"
            }
            if ($bytes.Length -ge 6 -and $bytes[3] -eq 0xEF -and $bytes[4] -eq 0xBB -and $bytes[5] -eq 0xBF) {
              throw "Double UTF-8 BOM: $name"
            }

            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $errors | Format-List * | Out-String | Write-Host
              throw "PowerShell parse errors in $name"
            }

            powershell.exe -NoProfile -ExecutionPolicy Bypass -File $path -ValidateOnly
          }

      - name: Verify production signature in Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $updater = Join-Path $PWD "dist\update-team-skills.ps1"
          $publicKey = Join-Path $PWD "dist\team-skills-public-key.pem"
          $fixtureDir = Join-Path $PWD "tests\fixtures\windows-signature"
          $payload = Join-Path $fixtureDir "latest.json"
          $signature = Join-Path $fixtureDir "latest.json.sig"
          $work = Join-Path $env:RUNNER_TEMP "team-skills-signature-smoke"
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          Remove-Item Env:\CODEX_TEAM_SKILLS_ALLOW_UNSIGNED -ErrorAction SilentlyContinue
          $env:CODEX_TEAM_SKILLS_PUBLIC_KEY = $publicKey

          function Invoke-SignatureCheck($PayloadPath) {
            $previousPreference = $ErrorActionPreference
            try {
              $ErrorActionPreference = "Continue"
              $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $updater `
                -VerifySignatureOnly -PayloadPath $PayloadPath -SignaturePath $signature 2>&1
              $exitCode = $LASTEXITCODE
              return [pscustomobject]@{ ExitCode = $exitCode; Output = $output }
            } finally {
              $ErrorActionPreference = $previousPreference
            }
          }

          $validResult = Invoke-SignatureCheck $payload
          if ($validResult.ExitCode -ne 0) {
            throw "Valid production signature was rejected: $($validResult.Output -join [Environment]::NewLine)"
          }

          $tamperedPayload = Join-Path $work "latest-tampered.json"
          $payloadBytes = [System.IO.File]::ReadAllBytes($payload)
          $payloadBytes[0] = $payloadBytes[0] -bxor 1
          [System.IO.File]::WriteAllBytes($tamperedPayload, $payloadBytes)
          $tamperedResult = Invoke-SignatureCheck $tamperedPayload
          if ($tamperedResult.ExitCode -eq 0) {
            throw "Tampered production payload was accepted: $($tamperedResult.Output -join [Environment]::NewLine)"
          }

          $tamperedKey = Join-Path $work "team-skills-public-key-tampered.pem"
          $keyBytes = [System.IO.File]::ReadAllBytes($publicKey)
          $keyBytes[0] = $keyBytes[0] -bxor 1
          [System.IO.File]::WriteAllBytes($tamperedKey, $keyBytes)
          $env:CODEX_TEAM_SKILLS_PUBLIC_KEY = $tamperedKey
          $pinResult = Invoke-SignatureCheck $payload
          if ($pinResult.ExitCode -eq 0) {
            throw "Tampered public key pin was accepted: $($pinResult.Output -join [Environment]::NewLine)"
          }
          Write-Host "Production signature smoke passed: valid accepted, tampered payload and key rejected."
          exit 0

      - name: Set up Python for local HTTP repair fixture
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Windows update and repair integration
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $testPath = Join-Path $PWD "tests\windows\windows-update-repair-integration.ps1"
          $testSource = Get-Content $testPath -Raw -Encoding UTF8
          & ([scriptblock]::Create($testSource))

  claude-sync-smoke:
    name: Claude skills folder sync smoke
    runs-on: ubuntu-latest
    needs: pytest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync team skills into a temp Claude skills folder
        run: |
          set -euo pipefail
          dest="$(mktemp -d -t 'claude skills test.XXXXXX')"
          mkdir -p "$dest/local-only"
          printf '%s\n' '---' 'name: local-only' 'description: local only' '---' '# Local Only' > "$dest/local-only/SKILL.md"
          CLAUDE_SKILLS_DIR="$dest" ./scripts/pull-skills.sh
          test -f "$dest/add-team-skill/SKILL.md"
          test -f "$dest/local-only/SKILL.md"

  publish:
    name: Publish immutable validated bundle
    runs-on: ubuntu-latest
    needs:
      - windows-powershell-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Download installable bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: team-skills-installable-bundle
          path: dist

      - name: Sign release metadata
        env:
          TEAM_SKILLS_SIGNING_KEY_PEM: ${{ secrets.TEAM_SKILLS_SIGNING_KEY_PEM }}
        run: |
          test -n "$TEAM_SKILLS_SIGNING_KEY_PEM"
          printf '%s\n' "$TEAM_SKILLS_SIGNING_KEY_PEM" > dist/signing-key.pem
          openssl dgst -sha256 -sign dist/signing-key.pem -out dist/latest.json.sig dist/latest.json
          openssl dgst -sha256 -sign dist/signing-key.pem -out dist/manifest.json.sig dist/manifest.json
          rm -f dist/signing-key.pem

      - name: Publish immutable validated bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RELEASE_TAG="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("dist/latest.json").read_text(encoding="utf-8"))["release_tag"])
          PY
          )"
          gh release create "$RELEASE_TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Team Skills $RELEASE_TAG" \
            --notes "Проверенная CI версия plugin team-skills. latest.json и manifest.json подписаны." \
            --latest
