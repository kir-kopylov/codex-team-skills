name: Проверки

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pr-governance:
    name: PR title/body governance
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check PR title/body policy
        run: python3 scripts/check_pr_governance.py metadata

  installer-release-gate:
    name: Installer/release protected paths gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check protected installer/release paths
        run: python3 scripts/check_pr_governance.py protected-paths

  release-scope:
    name: Release/installer scope
    runs-on: ubuntu-latest
    outputs:
      run_release_checks: ${{ steps.detect.outputs.run_release_checks }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect release/installer scope
        id: detect
        run: python3 scripts/check_pr_governance.py release-scope | tee -a "$GITHUB_OUTPUT"

  pytest:
    name: pytest, language policy и privacy gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package and test dependencies
        run: python -m pip install ".[test]"

      - name: Run tests and language policy checks
        run: python -m pytest

  build-release-bundle:
    name: Build installable team-skills bundle
    runs-on: ubuntu-latest
    if: needs.release-scope.outputs.run_release_checks == 'true'
    needs:
      - pr-governance
      - installer-release-gate
      - release-scope
      - pytest
      - claude-sync-smoke

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Build installable team-skills bundle
        run: python scripts/build_release_bundle.py

      - name: Upload installable bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-skills-installable-bundle
          path: dist/*

  windows-powershell-smoke:
    name: Windows PowerShell 5.1 release asset smoke
    runs-on: windows-latest
    if: needs.build-release-bundle.result == 'success'
    needs: build-release-bundle

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: python -m pip install ".[test]"

      - name: Download installable bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: team-skills-installable-bundle
          path: dist

      - name: Test Windows legacy cleanup
        run: python -m pytest tests/test_remove_autoupdate_windows.py
        env:
          TEAM_SKILLS_WINDOWS_CLEANUP_SCRIPT: ${{ github.workspace }}/dist/remove-team-skills-autoupdate.ps1

      - name: Parse and validate Windows PowerShell assets
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $PWD "dist"
          $assets = @(
            "install-team-skills.ps1",
            "uninstall-team-skills.ps1",
            "remove-team-skills-autoupdate.ps1"
          )

          foreach ($name in $assets) {
            $path = Join-Path $dist $name
            if (-not (Test-Path $path)) {
              throw "Missing release asset: $name"
            }

            $bytes = [System.IO.File]::ReadAllBytes($path)
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
              throw "Missing UTF-8 BOM: $name"
            }
            if ($bytes.Length -ge 6 -and $bytes[3] -eq 0xEF -and $bytes[4] -eq 0xBB -and $bytes[5] -eq 0xBF) {
              throw "Double UTF-8 BOM: $name"
            }

            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $errors | Format-List * | Out-String | Write-Host
              throw "PowerShell parse errors in $name"
            }

            if ($name -eq "remove-team-skills-autoupdate.ps1") {
              powershell.exe -NoProfile -ExecutionPolicy Bypass -File $path -DryRun
            } else {
              powershell.exe -NoProfile -ExecutionPolicy Bypass -File $path -ValidateOnly
            }
          }

      - name: Install and reinstall on Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dist = Join-Path $PWD "dist"
          $manifest = Get-Content (Join-Path $dist "manifest.json") -Raw | ConvertFrom-Json
          $manifestUrl = "https://github.com/kir-kopylov/codex-team-skills/releases/download/$($manifest.release_tag)/manifest.json"
          $testRoot = Join-Path $env:RUNNER_TEMP "team-skills-one-shot"
          Remove-Item $testRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null

          $env:CODEX_TEAM_SKILLS_PLUGIN_DIR = Join-Path $testRoot "plugins\team-skills"
          $env:CODEX_TEAM_SKILLS_MARKETPLACE_ROOT = $testRoot
          $env:CODEX_TEAM_SKILLS_MARKETPLACE = Join-Path $testRoot ".agents\plugins\marketplace.json"
          $env:CODEX_TEAM_SKILLS_CODEX_CONFIG = Join-Path $testRoot ".codex\config.toml"
          $env:CODEX_TEAM_SKILLS_CODEX_PLUGIN_CACHE_DIR = Join-Path $testRoot ".codex\plugins\cache\codex-team-skills"
          $env:TEAM_SKILLS_FIXTURE_DIR = $dist

          $wrapper = Join-Path $env:RUNNER_TEMP "invoke-team-skills-installer.ps1"
          @'
          param(
              [string]$Installer,
              [string]$ManifestUrl
          )
          $ErrorActionPreference = "Stop"
          function Invoke-WebRequest {
              param(
                  [switch]$UseBasicParsing,
                  [string]$Uri,
                  [string]$OutFile,
                  [int]$TimeoutSec
              )
              $name = [System.IO.Path]::GetFileName(([System.Uri]$Uri).AbsolutePath)
              if ($name -ne "manifest.json" -and $name -ne "team-skills-bundle.zip") {
                  throw "Unexpected fixture request: $name"
              }
              Copy-Item (Join-Path $env:TEAM_SKILLS_FIXTURE_DIR $name) $OutFile -Force
          }
          . $Installer -ManifestUrl $ManifestUrl
          '@ | Set-Content -Path $wrapper -Encoding UTF8

          $installer = Join-Path $dist "install-team-skills.ps1"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $wrapper -Installer $installer -ManifestUrl $manifestUrl
          if ($LASTEXITCODE -ne 0) { throw "Fresh one-shot installation failed." }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $wrapper -Installer $installer -ManifestUrl $manifestUrl
          if ($LASTEXITCODE -ne 0) { throw "Repeated one-shot installation failed." }

          $pluginManifest = Join-Path $env:CODEX_TEAM_SKILLS_PLUGIN_DIR ".codex-plugin\plugin.json"
          if (-not (Test-Path $pluginManifest)) { throw "Installed plugin manifest is missing." }
          if (Test-Path (Join-Path $env:LOCALAPPDATA "CodexTeamSkills")) { throw "Installer left a legacy updater root." }
          if (Get-ScheduledTask -TaskPath "\" -TaskName "Codex Team Skills Auto Update" -ErrorAction SilentlyContinue) {
              throw "Installer registered a legacy Scheduled Task."
          }

  macos-one-shot-smoke:
    name: macOS one-shot installer and cleanup smoke
    runs-on: macos-latest
    if: needs.build-release-bundle.result == 'success'
    needs: build-release-bundle

    steps:
      - name: Download installable bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: team-skills-installable-bundle
          path: dist

      - name: Parse and validate macOS assets
        run: |
          set -euo pipefail
          for asset in install-team-skills.command uninstall-team-skills.command remove-team-skills-autoupdate.command; do
            test -f "dist/$asset"
            zsh -n "dist/$asset"
          done
          zsh "dist/install-team-skills.command" --validate-only
          zsh "dist/remove-team-skills-autoupdate.command" --dry-run

      - name: Install, reinstall and prove rollback on macOS
        run: |
          set -euo pipefail
          test_home="$(mktemp -d -t team-skills-home.XXXXXX)"
          fake_bin="$(mktemp -d -t team-skills-bin.XXXXXX)"
          fixture_dir="$PWD/dist"

          cat > "$fake_bin/curl" <<'SH'
          #!/bin/sh
          output=""
          url=""
          while [ "$#" -gt 0 ]; do
            case "$1" in
              --output) output="$2"; shift 2 ;;
              *) url="$1"; shift ;;
            esac
          done
          name="${url##*/}"
          case "$name" in
            manifest.json|team-skills-bundle.zip)
              cp "$TEAM_SKILLS_FIXTURE_DIR/$name" "$output"
              ;;
            *) exit 64 ;;
          esac
          SH
          chmod +x "$fake_bin/curl"

          cat > "$fake_bin/mv" <<'SH'
          #!/bin/sh
          if [ "${TEAM_SKILLS_FAIL_MARKETPLACE_WRITE:-0}" = "1" ]; then
            for argument in "$@"; do
              case "$argument" in
                *marketplace.json.tmp.*) exit 77 ;;
              esac
            done
          fi
          exec /bin/mv "$@"
          SH
          chmod +x "$fake_bin/mv"

          export HOME="$test_home"
          export PATH="$fake_bin:$PATH"
          export TEAM_SKILLS_FIXTURE_DIR="$fixture_dir"

          zsh "dist/install-team-skills.command"
          zsh "dist/install-team-skills.command"
          test -f "$HOME/plugins/team-skills/.codex-plugin/plugin.json"
          test ! -e "$HOME/Library/Application Support/CodexTeamSkills"
          test ! -e "$HOME/Library/LaunchAgents/com.codex-team-skills.autoupdate.plist"

          plugin_before="$(shasum -a 256 "$HOME/plugins/team-skills/.codex-plugin/plugin.json" | awk '{print $1}')"
          if TEAM_SKILLS_FAIL_MARKETPLACE_WRITE=1 zsh "dist/install-team-skills.command"; then
            echo "Installer unexpectedly accepted a simulated registry write failure" >&2
            exit 1
          fi
          plugin_after="$(shasum -a 256 "$HOME/plugins/team-skills/.codex-plugin/plugin.json" | awk '{print $1}')"
          test "$plugin_before" = "$plugin_after"

  claude-sync-smoke:
    name: Claude skills folder sync smoke
    runs-on: ubuntu-latest
    needs: pytest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync team skills into a temp Claude skills folder
        run: |
          set -euo pipefail
          dest="$(mktemp -d -t 'claude skills test.XXXXXX')"
          mkdir -p "$dest/local-only"
          printf '%s\n' '---' 'name: local-only' 'description: local only' '---' '# Local Only' > "$dest/local-only/SKILL.md"
          CLAUDE_SKILLS_DIR="$dest" ./scripts/pull-skills.sh
          test -f "$dest/add-team-skill/SKILL.md"
          test -f "$dest/local-only/SKILL.md"

  publish:
    name: Publish immutable validated bundle
    runs-on: ubuntu-latest
    needs:
      - windows-powershell-smoke
      - macos-one-shot-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Download installable bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: team-skills-installable-bundle
          path: dist

      - name: Publish immutable validated bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RELEASE_TAG="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("dist/manifest.json").read_text(encoding="utf-8"))["release_tag"])
          PY
          )"
          gh release create "$RELEASE_TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Team Skills $RELEASE_TAG" \
            --notes "Проверенная CI версия plugin team-skills. Установка выполняется вручную одноразовым installer." \
            --latest
