owner: "@kir-kopylov"
status: "team-ready"
summary: "Проводит жесткий forensic-аудит текста и сначала проверяет, нужен ли сам механизм, прежде чем предлагать production-hardening."
use_cases:
  - "Разобрать ответ, pitch или план на fantasy architecture, startup-bullshit и подмену механизмов словами."
  - "Проверить growth-воронку, интернет-эксперимент или AI-автоматизацию на measurement, attribution, data quality, observability и economics gaps."
  - "Показать, как тезисы развалятся в production и как такие задачи решают сильные команды."
  - "Проверить, оправдан ли сам механизм, прежде чем превращать missing layers в roadmap по hardening."
do_not_use_for:
  - "Личную травлю автора вместо аудита текста, claims и архитектурных допущений."
  - "Аудит без исходного текста, плана или тезисов, где Codex пришлось бы выдумывать объект проверки."
  - "Утверждения о live-state фактах вроде цены, наличия, телефона, API-статуса или опубликованного release без проверки в моменте."
natural_triggers:
  - "разнеси этот ответ в пыль"
  - "сделай жесткий forensic-аудит"
  - "проверь на startup-bullshit"
  - "где здесь fantasy architecture вместо production"
  - "разбей по методологии, воронке, AI-агентам и экономике"
  - "сначала проверь, нужен ли сам механизм"
  - "не превращай production-дыры в roadmap"
example_files:
  - "examples/good-01-ai-automation-pitch.md"
  - "examples/good-02-growth-funnel-plan.md"
  - "examples/good-03-experiment-design.md"
  - "examples/anti-01-no-target-text.md"
  - "examples/anti-02-personal-attack.md"
  - "examples/anti-03-audit-becomes-roadmap.md"
last_reviewed: "2026-07-18"
