exceptions:
  - symptom: "Модель поднята в рейтинге из-за металлических чашек, хотя нагруженные шарниры и вилки остались непроверенными."
    root_cause: "Материал видимой детали был принят за прочность всей несущей конструкции."
    do_next_time: "Проследить путь нагрузки от оголовья до чашки и оценивать металл только в том узле, который реально принимает усилие."
    source_example: "examples/good-02.md"
  - symptom: "Сообщения о поломках соседнего поколения приписаны сравниваемой модели с похожим названием."
    root_cause: "Поиск и итоговый пакет не зафиксировали точное поколение и конструктивную ревизию."
    do_next_time: "Перед учётом каждого сигнала сверить полное название, поколение и фотографии узла; несовпадающую версию вынести из доказательств."
    source_example: "examples/good-03.md"
  - symptom: "Большое число жалоб выдано за высокую частоту отказов без данных об объёме продаж, а копии одного случая посчитаны отдельно."
    root_cause: "Количество найденных страниц было ошибочно принято за независимость случаев и статистический знаменатель."
    do_next_time: "Свести копии к происхождению, назвать только повторяющийся паттерн и не вычислять частоту отказов без сопоставимого объёма продаж."
    source_example: "examples/good-03.md"
