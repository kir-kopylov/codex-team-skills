owner: "@kir-kopylov"
status: "team-ready"
summary: "Ранжирует локальных подрядчиков через evidence ranking, отзывы и live-state caveats вместо впечатления от сайта."
use_cases:
  - "Найти и ранжировать локальных подрядчиков для сложной услуги, где важнее evidence ranking и операционная компетентность, чем цена или SEO-видимость."
  - "Проверить уже собранный список отзывами с независимых платформ и переранжировать без смешения одноимённых компаний."
  - "Объяснить, почему компания попала или не попала в корпус, кого отсеяли и какие критерии реально применялись."
do_not_use_for:
  - "Гарантированный выбор подрядчика, подтверждение актуальной цены, телефона, графика, наличия или выезда сегодня по поисковому кэшу."
  - "Ранжирование только по рейтингу, красоте сайта, рекламе или отзывам по нерелевантным массовым услугам."
  - "Коммит приватных адресов, телефонов, личных данных, raw переписок, screenshots/private media или клиентского контекста."
natural_triggers:
  - "найди топ компаний"
  - "локальные подрядчики evidence ranking отзывы live-state"
  - "проверь список отзывами"
  - "переранжируй с учетом реальных отзывов"
  - "почему эта компания не попала"
  - "собери полный список"
  - "ранжируй по признакам"
example_files:
  - "examples/good-01-strict-service-corpus.md"
  - "examples/good-02-review-adjusted-ranking.md"
  - "examples/good-03-excluded-company-challenge.md"
  - "examples/anti-01-live-state-overclaim.md"
  - "examples/anti-02-seo-only-top.md"
last_reviewed: "2026-06-04"
