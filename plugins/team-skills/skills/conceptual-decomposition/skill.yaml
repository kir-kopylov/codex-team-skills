status: "team-ready"
summary: "Разбирает идею на внутреннюю логику, скрытые допущения, системный контекст и усиленную формулировку."
use_cases:
  - "Глубоко разобрать плотную или сырую идею перед текстом, продуктовым решением, исследованием или стратегией."
  - "Найти скрытые допущения, неоднозначности, напряжения и зависимости внутри тезиса."
  - "Собрать более ясную и сильную версию идеи после концептуального анализа."
do_not_use_for:
  - "Простая редактура, перевод, пересказ или улучшение стиля без концептуального анализа."
  - "Проверка живых фактов, цен, наличия, законодательства, API или текущего состояния рынка."
  - "Анализ нескольких несвязанных идей без выбора главной идеи или явной группировки."
natural_triggers:
  - "разбери идею"
  - "разложи мысль"
  - "сделай conceptual decomposition"
  - "найди скрытые допущения"
  - "покажи системный контекст"
  - "усиль концепцию"
example_files:
  - "examples/good-01-raw-idea.md"
  - "examples/good-02-domain-goal.md"
  - "examples/good-03-strategic-concept.md"
  - "examples/anti-01-simple-rewrite.md"
  - "examples/anti-02-live-fact-check.md"
last_reviewed: "2026-08-04"
source_asset: "Методика концептуального разбора идеи через её логику, допущения, системные рамки, следствия и усиленную формулировку; пользовательские идеи в пакет не переносятся."
