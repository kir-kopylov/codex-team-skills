owner: "@kir-kopylov"
author_github: "@kir-kopylov"
authors:
  - "Кирилл Копылов"
source_asset: "Исходная методика проверки актуальности, добавленная автором в commit 1c4b66e и доработанная по обезличенной обратной связи."
status: "team-ready"
summary: "Перед рекомендацией подтверждает прямо сейчас наличие, цену и способ связи и не выдаёт неподтверждённое за актуальное."
use_cases:
  - "Поиск товаров, услуг или исполнителей, где нужны живые наличие, цена и контакт, а не данные из кэша."
  - "Подбор кандидатов или слотов с подтверждением готовности и доступности в моменте."
  - "Любая задача с гарантией или конкретным числом, где выдуманный список дороже честного отказа."
do_not_use_for:
  - "Чисто справочные вопросы без действия по конкретному объекту."
  - "Задачи, которые перехватывает более узкий скилл, например скрининг откликов конкретной вакансии."
  - "Творческие или гипотетические запросы, где живая актуальность не важна."
natural_triggers:
  - "проверь прямо сейчас"
  - "проверь перед покупкой"
  - "подтверди наличие и цену"
  - "проверь по моменту"
  - "верификация"
  - "подтверди в моменте"
  - "найди в наличии"
  - "найди подходящих с проверкой"
example_files:
