exceptions:
  - symptom: "Перед автозапуском русскоязычный пользователь видит внутреннее имя verify и служебные слова team skill и live-state, но не понимает происхождение навыка, автора, пользовательский контракт и разницу между ответом с навыком и без него."
    root_cause: "Вопрос описывал внутренний механизм маршрутизации вместо происхождения навыка и наблюдаемой для пользователя разницы между двумя режимами работы."
    do_next_time: "Начинать с полной фразы, которая связывает текущий запрос с навыком. Брать из запроса действие, конкретный объект, количество и проверяемые сведения; повторять их в блоках «С навыком / Без навыка». Не использовать таблицу и абстрактные слова без названного предмета. Показывать подтверждённый GitHub-аккаунт автора, а не имя и фамилию."
    source_example: "Обезличенная обратная связь автора навыка от 2026-08-03."
  - symptom: "Успешное открытие страницы или HTTP 200 увеличивает счётчик подтверждённых объектов, хотя на странице не доказаны наличие, доставка или другое обязательное поле."
    root_cause: "Успех инструмента был принят за предметное доказательство, а единый бинарный статус скрыл различие между поисковой находкой, заявлением страницы и путём заказа."
    do_next_time: "Присваивать уровень каждому полю отдельно: поиск даёт DISCOVERED, открытая первичная страница — PUBLIC_SOURCE только для видимого текста, безопасный checkout — TRANSACTION_PATH; сам tool-call K не увеличивает."
    source_example: "examples/good-01.md"
  - symptom: "В обязательный критерий включено подтверждение продавца через чат, WhatsApp или email, но не определено, кто пишет, из какого аккаунта, с каким разрешением и где агент получит ответ."
    root_cause: "Название канала было принято за исполнимую проверку, а недоступная переписка незаметно переложена на пользователя."
    do_next_time: "До прямого контакта заполнить всю цепочку исполнителя, аккаунта, доступа, разрешения, действия, ответа, срока ожидания и возврата результата. При пробеле поставить CONTACT_UNAVAILABLE, не писать и сохранить публично найденный объект кандидатом с unknown."
    source_example: "examples/anti-03-unowned-seller-contact.md"
