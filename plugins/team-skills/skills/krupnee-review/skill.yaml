owner: "@kir-kopylov"
author_github: "@kir-kopylov"
authors:
  - "Кирилл Копылов"
status: "team-ready"
summary: "Аудирует применение krupnee Lift как offline/manual evaluator на явно переданном диалоге, trace, feedback inbox row, GitHub Issue body или eval fixture."
use_cases:
  - "Проверить переданный фрагмент диалога или sanitized trace и понять, правильно ли агент распознал серию связанных микрошагов."
  - "Разобрать trace применения krupnee_lift и понять, был ли false positive, missed lift или risk override."
  - "Превратить жалобу или feedback packet в verdict, eval case или patch proposal без утяжеления короткого runtime skill."
  - "Разобрать строки из Team Codex Skill Feedback Inbox или GitHub Issues, сгруппировать похожие жалобы и предложить maintainer-у итерацию улучшения skill."
do_not_use_for:
  - "Живое выполнение маленькой просьбы пользователя; review не должен становиться runtime gatekeeper."
  - "Автоматическое наблюдение чужих диалогов, командной telemetry или истории срабатываний без явно переданного материала."
  - "Подтверждение live-state фактов вроде наличия, цены, телефона или текущего статуса внешнего сервиса."
natural_triggers:
  - "проверь, правильно ли сработал krupnee_lift"
  - "разбери trace krupnee Lift"
  - "вот фрагмент диалога, сделай krupnee-review"
  - "разбери feedback rows по krupnee-runtime"
  - "у тебя новые feedback rows по krupnee-runtime"
  - "разбери GitHub Issues с krupnee_review_packet"
  - "добавь eval cases для krupnee"
  - "почему runtime предложил lift слишком рано"
  - "проверь telemetry schema для krupnee"
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/good-04-sheet-feedback-row.md"
  - "examples/good-05-github-issue-feedback.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
  - "examples/anti-03.md"
last_reviewed: "2026-08-04"
source_asset: "Спецификация krupnee Lift 0.2.0, переданная пользователем; review-пакет сохраняет аналитический слой отдельно от короткого runtime."
