exceptions:
  - symptom: "По названию длинной task начали разбирать соседнюю session, где то же название встречалось внутри raw chat; размер и thread ID сверили только после первых выводов."
    root_cause: "Task identity разрешали эвристикой в ходе анализа, а не immutable target lock до inventory."
    do_next_time: "Сначала выполнить `resolve-session` по native thread ID либо по точному title плюс наблюдаемому size; при `ambiguous_target` остановиться, создать target lock и передавать в inventory только его. При смене target аннулировать весь предыдущий recovery run."
    source_example: "examples/good-04.md"
  - symptom: "Старая branch содержит полезный пакет вместе с локальными `.codex` и `.goal-runtime` файлами или предыдущей историей."
    root_cause: "Весь checkpoint commit приняли за publish scope вместо явного artifact allowlist."
    do_next_time: "Создать clean branch от доказанного target tip, перенести commit через `cherry-pick --no-commit`, исключить служебные paths и проверить полный allowlist через exact scope до commit."
    source_example: "examples/good-01.md"
  - symptom: "Работа опубликована в `origin/main`, но позже выясняется, что MR был направлен в другой project или fork."
    root_cause: "Имя remote и branch приняли за настоящий target без проверки base/target project metadata."
    do_next_time: "До создания branch доказать target project/branch через provider API или PR/MR metadata; после merge fetch target и проверить reachability или нулевой path diff."
    source_example: "examples/anti-02.md"
  - symptom: "Approved SHA256 совпадает в Git index, но не совпадает в Windows working copy."
    root_cause: "`core.autocrlf` или отсутствующая `.gitattributes` изменила checkout bytes, а working tree приняли за единственный источник истины."
    do_next_time: "Сравнить working, index, commit и fresh checkout отдельно; не переписывать evidence, при необходимости добавить узкую EOL policy и повторить проверки."
    source_example: "examples/good-03.md"
  - symptom: "После push MR уже merged или source branch исчезла, хотя Codex не выполнял merge/delete."
    root_cause: "Автоматическое действие provider приписали исполнителю или приняли повторный delete за обязательный cleanup."
    do_next_time: "Зафиксировать auto-merge/auto-delete как наблюдаемый внешний факт, проверить target SHA и считать missing remote branch допустимым только после target proof."
    source_example: "examples/good-01.md"
  - symptom: "Пользователь просит сохранить работу, а в repo предлагают добавить большой session JSONL."
    root_cause: "Raw chat перепутали с долговечным результатом задачи."
    do_next_time: "Сначала найти уже созданные files/worktrees/commits; session использовать только как указатель, а в repo публиковать санитизированные artifacts и provenance."
    source_example: "examples/anti-01.md"
  - symptom: "Session metadata указывает на workspace-контейнер и inventory сообщает `not_git`, хотя позже task создала отдельный worktree."
    root_cause: "Проверка остановилась на первом `cwd` и ожидала JSON `arguments`, а текущие tool calls хранили пути внутри JavaScript-like поля `input`."
    do_next_time: "Потоково просмотреть records, извлечь только `cwd`, `workdir` и existing absolute path hints из `arguments/input`, исключить `<CODEX_HOME>` и построить Git candidates; при `records_truncated=true` увеличить `--max-records`, а при `path_hints_truncated=true` сузить ручную проверку по уже найденным repo/worktree evidence."
    source_example: "examples/good-02.md"
  - symptom: "Read-only карта утверждает «работы нет в main», хотя удалось проверить только локальный `origin/main`, а provider target недоступен."
    root_cause: "Локальный remote/branch был выдан за настоящий base/target без provider metadata."
    do_next_time: "Формулировать только «не найдено в проверенном <remote>/<branch>; target unconfirmed» и запрещать publish/cleanup до доказательства base project/branch."
    source_example: "examples/anti-02.md"
