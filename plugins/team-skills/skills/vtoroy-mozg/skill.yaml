owner: "@kir-kopylov"
status: "team-ready"
summary: "Захватывает личные обязательства в живой список: задачи в таблицу, встречи и дедлайны в календарь, с утренним и вечерним разбором и подсветкой назревающих проёбов."
use_cases:
  - "Разобрать устный или текстовый вывал дел: развести встречи и задачи, дозаполнить поля без выдумывания и завести записи."
  - "Провести утренний или вечерний разбор: ранжировать дела, подсветить что горит и где назревает проёб, обновить статусы и лог."
  - "Завести обязательство с дедлайном так, чтобы напоминание сработало вовремя и с учётом выходных."
do_not_use_for:
  - "Разовую справку без задачи и без обязательства."
  - "Подтверждение живых фактов перед действием — наличие, цену, телефон, график; это к skill `verify`."
  - "Выполнение внешних действий за пользователя: звонки, отправку писем, оплату без явного подтверждения."
natural_triggers:
  - "запиши задачу"
  - "вот что у меня висит"
  - "разбери мои дела"
  - "сделай утренний разбор"
  - "что у меня горит"
example_files:
  - "examples/good-01-zahvat-vyvala.md"
  - "examples/good-02-utrenniy-razbor.md"
  - "examples/good-03-byurokratiya-do-dveri.md"
  - "examples/anti-01-sdelay-za-menya.md"
  - "examples/anti-02-zhivoy-status.md"
last_reviewed: "2026-06-23"
