exceptions:
  - symptom: "После нормализации выбранное имя уже занято другим skill, и новый `SKILL.md` готовится к записи в тот же path."
    root_cause: "Проверка искала только совпадающее поведение, но не проверяла коллизию целевого path и поля `name` до изменяющего действия."
    do_next_time: "До любой записи проверить target path и все обнаруживаемые skills с тем же `name`: совпадающее поведение переиспользовать только при правильных scope и доступности, а при другой коллизии вернуться к name-gate, показать новое имя и, для CLI/IDE, новый `$вызов`, пересчитать path и повторить проверку."
    source_example: "examples/good-03-legacy-prompt-migration.md"
  - symptom: "Найден skill с тем же поведением, но он repo-scoped, disabled или не обнаруживается на целевой поверхности, а workflow всё равно считает reuse завершённым."
    root_cause: "Совпадение содержания было смешано с пригодностью scope, enabled-state и discovery для заявленной цели."
    do_next_time: "До reuse зафиксировать path, `name`, scope, enabled-state и discovery; неверный scope переносить только как отдельный skill правильного scope через name/collision gates, disabled правильного scope завершать read-only статусом и отдельным handoff на задачу включения без правки config в этом skill, а enabled с discovery `false/unknown` — без записи провести через один restart и read-only discovery recovery."
    source_example: "examples/good-01-existing-skill.md"
  - symptom: "Skill фактически запускается на выбранной поверхности, но результат больше не сохраняет существенное поведение исходного prompt."
    root_cause: "Факт запуска был ошибочно принят за эквивалентность, хотя инварианты исходного workflow и репрезентативная проба не сравнивались."
    do_next_time: "До изменения зафиксировать 1–3 наблюдаемых инварианта и безопасную пробу; после запуска сравнить поведение, невозможную безопасную проверку вернуть как `не подтверждено`, а доказанное несовпадение — как `нет`, не объявляя завершение."
    source_example: "examples/good-01-existing-skill.md"
  - symptom: "На Windows `quick_validate.py` падает с `UnicodeDecodeError` на корректном кириллическом UTF-8 либо сообщает `No YAML frontmatter`, хотя первая видимая строка — `---`."
    root_cause: "Python validator был запущен в системной `cp1251` вместо UTF-8 либо перед frontmatter оказался UTF-8 BOM, который не виден при обычном текстовом чтении."
    do_next_time: "Писать UTF-8 без BOM, запускать validator через `python -X utf8` и не менять содержимое из-за одного decode error; при ложном `No YAML frontmatter` сначала проверить первые байты на BOM."
    source_example: "examples/good-03-legacy-prompt-migration.md"
  - symptom: "Skill обнаружен и вызывается в CLI/IDE, но workflow считается незавершённым из-за отсутствующей проверки ChatGPT desktop app."
    root_cause: "Критерий завершения одной поверхности был ошибочно применён ко всем runtime; раздел Skills настольного приложения не является условием готовности CLI/IDE."
    do_next_time: "Сначала взять явно названную или наблюдаемую целевую поверхность; если её нельзя определить, задать один вопрос Codex в ChatGPT desktop app/CLI/IDE до записи. Для CLI/IDE проверить `/skills` и `$имя`, а статусы настольного приложения вернуть как `не применимо`; для Codex в ChatGPT desktop app отдельно проверить раздел Skills и безопасную пробу через наблюдаемый UI."
    source_example: "examples/good-01-existing-skill.md"
  - symptom: "Папка и `name` совпадают, но содержат кириллицу, пробелы, `_`, uppercase, крайний/двойной дефис или больше 64 символов, и skill не обнаруживается."
    root_cause: "Совпадение папки и frontmatter было ошибочно принято за полную валидность имени; Codex skill требует короткое имя в lowercase hyphen-case."
    do_next_time: "До записи нормализовать имя по `^[a-z0-9]+(?:-[a-z0-9]+)*$`, проверить предел 64 символа, показать итоговое имя пользователю, а вызов `$имя` — только для CLI/IDE, и только затем создать совпадающие папку и поле `name`."
    source_example: "examples/good-03-legacy-prompt-migration.md"
  - symptom: "Пользовательский skill создан в `.codex/skills`, но не обнаруживается на ожидаемой поверхности."
    root_cause: "Для нового личного skill был выбран недокументированный discovery path; актуальная документация перечисляет `$HOME/.agents/skills`."
    do_next_time: "Сначала использовать `%USERPROFILE%\\.agents\\skills\\<имя>\\SKILL.md` на Windows или `$HOME/.agents/skills/<имя>/SKILL.md` на macOS/Linux, затем для CLI/IDE проверить `/skills` и `$имя`, а для Codex в ChatGPT desktop app — раздел `Skills` и безопасную пробу через наблюдаемый UI; выполнить не более одного restart."
    source_example: "examples/good-03-legacy-prompt-migration.md"
  - symptom: "Пользователь просит показать команду первой после `/`, а workflow обещает slash-видимость без наблюдения."
    root_cause: "Раздел Skills в боковой панели был ошибочно приравнен к списку после `/`; текущая документация не обещает для настольного приложения ни `$имя`, ни отдельную `/имя`-команду, ни позицию."
    do_next_time: "Сначала проверить skill в разделе Skills и выполнить безопасную пробу. Видимость после `/` и первое место проверять только по свежему UI-state при явном запросе; неподтверждённое помечать честно и не добавлять `00-`."
    source_example: "examples/good-02-menu-priority.md"
  - symptom: "После первой неудачной UI-проверки создаются plugin, отдельный marketplace и `commands/<имя>.md`, но быстрый вызов всё равно не появляется."
    root_cause: "Неподтверждённая модель одной поверхности была заменена другой неподтверждённой моделью; текущая структура plugin не документирует `commands/` как компонент."
    do_next_time: "Остановить смену механизмов, проверить path/frontmatter/кодировку и целевую поверхность; не создавать plugin для одного prompt без запроса на распространение и текущего документального подтверждения."
    source_example: "examples/anti-03-plugin-detour.md"
  - symptom: "Plugin отмечен как `installed, enabled`, а нужный файл есть в cache, но пользователь не видит и не может вызвать ожидаемое действие."
    root_cause: "Backend-состояние установки и cache было ошибочно принято за пользовательский результат на другой поверхности."
    do_next_time: "Вернуть статусы `установлено: да`, `видно: нет`, `фактический вызов: нет`, `цель достигнута: нет` и остановиться без manifest/cachebuster-итераций до нового прямого доказательства."
    source_example: "examples/anti-03-plugin-detour.md"
  - symptom: "После ручной правки `config.toml` путь с кириллицей превращается в mojibake, а команды plugin начинают падать."
    root_cause: "Конфигурация была переписана через небезопасный encoding flow ради обхода, который не требовался для пользовательского skill."
    do_next_time: "Не трогать config для личного skill; для marketplace использовать штатную CLI-команду. Если отдельная правка явно разрешена и неизбежна, сначала сделать backup и проверить UTF-8 round-trip до замены файла."
    source_example: "examples/anti-03-plugin-detour.md"
