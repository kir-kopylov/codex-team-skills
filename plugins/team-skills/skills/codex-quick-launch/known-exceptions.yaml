exceptions:
  - symptom: "Локальный файл существует, но пользователь не видит его в slash-меню."
    root_cause: "Наличие файла не доказывает, что текущая версия Codex загрузила этот тип расширения или что интерфейс уже был перезапущен."
    do_next_time: "Разделить статусы файла, загрузки и UI-видимости; попросить открыть новую задачу или получить свежий скрин меню вместо предположения."
    source_example: "examples/good-03-legacy-prompt-migration.md"
  - symptom: "Пользователь просит показать команду первой после `/`."
    root_cause: "Порядок списка может зависеть от реализации интерфейса, а не только от имени skill."
    do_next_time: "Предложить короткое имя и префикс `00-` только как проверяемую попытку; подтвердить результат свежим наблюдением UI."
    source_example: "examples/good-02-menu-priority.md"
