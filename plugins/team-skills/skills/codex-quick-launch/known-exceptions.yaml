exceptions:
  - symptom: "Skill обнаружен и вызывается в CLI/IDE, но workflow считается незавершённым из-за отсутствующей проверки slash-списка ChatGPT Desktop."
    root_cause: "Критерий завершения одной поверхности был ошибочно применён ко всем runtime; Desktop slash-список не является условием готовности CLI/IDE."
    do_next_time: "Сначала зафиксировать целевую поверхность. Для CLI/IDE проверить `/skills` и `$имя`, а Desktop-видимость и первое место вернуть как `не применимо`; для ChatGPT Desktop отдельно проверить Skills и slash-список."
    source_example: "examples/good-01-existing-skill.md"
  - symptom: "Папка и `name` совпадают, но содержат кириллицу, пробелы, `_`, uppercase, крайний/двойной дефис или больше 64 символов, и skill не обнаруживается."
    root_cause: "Совпадение папки и frontmatter было ошибочно принято за полную валидность имени; Codex skill требует короткое имя в lowercase hyphen-case."
    do_next_time: "До записи нормализовать имя по `^[a-z0-9]+(?:-[a-z0-9]+)*$`, проверить предел 64 символа, показать итоговый `$имя` пользователю и только затем создать совпадающие папку и поле `name`."
    source_example: "examples/good-03-legacy-prompt-migration.md"
  - symptom: "Пользовательский skill создан в `.codex/skills`, но не обнаруживается на ожидаемой поверхности."
    root_cause: "Для нового личного skill был выбран недокументированный discovery path; актуальная документация перечисляет `$HOME/.agents/skills`."
    do_next_time: "Сначала использовать `%USERPROFILE%\\.agents\\skills\\<имя>\\SKILL.md` на Windows или `$HOME/.agents/skills/<имя>/SKILL.md` на macOS/Linux, затем проверить `$имя` или Skills и выполнить не более одного restart."
    source_example: "examples/good-03-legacy-prompt-migration.md"
  - symptom: "Пользователь просит показать команду первой после `/`."
    root_cause: "Документированная видимость enabled skill в slash-списке была смешана с отдельной `/имя`-командой и недокументированным управлением позицией."
    do_next_time: "Создать skill в поддерживаемом path, проверить его в slash-списке и отдельно вызвать через `$имя`; первое место и буквальный `/имя` пометить неподтверждёнными, не добавляя `00-`."
    source_example: "examples/good-02-menu-priority.md"
  - symptom: "После первой неудачной UI-проверки создаются plugin, отдельный marketplace и `commands/<имя>.md`, но быстрый вызов всё равно не появляется."
    root_cause: "Неподтверждённая модель одной поверхности была заменена другой неподтверждённой моделью; текущая структура plugin не документирует `commands/` как компонент."
    do_next_time: "Остановить смену механизмов, проверить path/frontmatter/кодировку и целевую поверхность; не создавать plugin для одного prompt без запроса на распространение и текущего документального подтверждения."
    source_example: "examples/anti-03-plugin-detour.md"
  - symptom: "Plugin отмечен как `installed, enabled`, а нужный файл есть в cache, но пользователь не видит и не может вызвать ожидаемое действие."
    root_cause: "Backend-состояние установки и cache было ошибочно принято за пользовательский результат на другой поверхности."
    do_next_time: "Вернуть статусы `установлено: да`, `видно: нет`, `фактический вызов: нет`, `цель достигнута: нет` и остановиться без manifest/cachebuster-итераций до нового прямого доказательства."
    source_example: "examples/anti-03-plugin-detour.md"
  - symptom: "После ручной правки `config.toml` путь с кириллицей превращается в mojibake, а команды plugin начинают падать."
    root_cause: "Конфигурация была переписана через небезопасный encoding flow ради обхода, который не требовался для пользовательского skill."
    do_next_time: "Не трогать config для личного skill; для marketplace использовать штатную CLI-команду. Если отдельная правка явно разрешена и неизбежна, сначала сделать backup и проверить UTF-8 round-trip до замены файла."
    source_example: "examples/anti-03-plugin-detour.md"
