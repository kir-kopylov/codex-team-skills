owner: "@kir-kopylov"
status: "team-ready"
summary: "Ищет небезопасные копии секретов и платёжных данных, выводит только безопасные указатели и ведёт revoke-first очистку через подтверждение."
use_cases:
  - "Проверить разрешённые локальные файлы, почту, cloud documents, заметки, репозитории, архивы, backups, версии и корзины на небезопасные копии секретов."
  - "Получить path-only отчёт без matched values, snippets, строк и secret fingerprints."
  - "Найти логины с паролями, access tokens, private keys, recovery material, connection secrets и платёжные связки с PIN/CVV."
  - "Провести revoke-first очистку найденных копий по подтверждённым batch и проверить результат повторным scan."
do_not_use_for:
  - "Раскрытие, копирование, маскирование, хеширование, проверку или применение найденных значений."
  - "Сканирование чужих аккаунтов, обход прав, вскрытие encrypted vault или загрузку corpus во внешний сервис без разрешения."
  - "Автоматическое удаление, purge версий/корзин/backups или rewrite git history без отдельного подтверждения."
  - "Уничтожение incident evidence, legal hold или единственной рабочей копии до решения владельца."
  - "Удаление правильной копии из approved password manager или managed secrets vault."
natural_triggers:
  - "найди файлы с паролями"
  - "проверь почту и документы на секреты"
  - "покажи только пути к утечкам"
  - "найди ключи доступа и токены во всех моих источниках"
  - "найди карты с PIN CVV и сроком"
  - "подготовь безопасную очистку секретов"
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
last_reviewed: "2026-07-12"
source_asset: "Обобщено из обезличенного запроса на path-only поиск и безопасную очистку секретов; реальные источники, аккаунты, пути и значения в repo не переносились."
