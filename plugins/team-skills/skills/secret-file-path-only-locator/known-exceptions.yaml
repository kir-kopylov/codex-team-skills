exceptions:
  - symptom: "Scanner печатает совпавшее значение, строку или snippet ещё до формирования отчёта."
    root_cause: "Output mode не был проверен на синтетическом corpus до real-data scan."
    do_next_time: "Не запускать scanner на реальных источниках; проверить path-only/redacted output на синтетике или поставить BLOCKED_UNSAFE_OUTPUT_CHANNEL."
    source_example: "examples/anti-01.md"
  - symptom: "Отчёт говорит, что всё чисто, хотя часть почты, versions, trash, backups или git history не сканировалась."
    root_cause: "Список находок подменил coverage-матрицу, а недоступные поверхности исчезли из финала."
    do_next_time: "Сначала перечислить все заявленные поверхности и завершить PARTIAL_COVERAGE при любом pending, blocked или unknown."
    source_example: "examples/good-01.md"
  - symptom: "Копии удалены, но ключ, пароль, session или карта остаются действующими."
    root_cause: "Cleanup начался до revoke, rotate, invalidate, freeze или reissue."
    do_next_time: "Сначала выполнить revoke/rotate/invalidate/freeze/reissue через владельца, подтвердить replacement и только затем удалять одобренный batch копий."
    source_example: "examples/good-02.md"
  - symptom: "Обычное короткое число ошибочно классифицировано как PIN/CVV или номер карты."
    root_cause: "Detector использовал голый regex без checksum и контекста платёжных полей."
    do_next_time: "Требовать структурную проверку номера карты и контекстную связку; одиночное короткое число не считать платёжным секретом."
    source_example: "examples/good-03.md"
  - symptom: "Approved password manager или managed vault попал в список мусора на удаление."
    root_cause: "Наличие секрета перепутано с небезопасным местом хранения."
    do_next_time: "Исключить утверждённые vault из cleanup scope и искать только дубли вне разрешённого хранилища."
    source_example: "examples/anti-02.md"
