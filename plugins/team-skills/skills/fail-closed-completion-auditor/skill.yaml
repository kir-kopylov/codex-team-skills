source_asset: "Санитизированный контракт аудита ложного завершения, сформированный из рабочего инцидента без переноса приватного контекста и деталей конкретного репозитория."
status: "experimental"
summary: "Проверяет все пути к финальному завершению и запрещает закрытие без прямых доказательств каждого обязательного условия."
use_cases:
  - "Проверить существующую реализацию, которая может объявить успех при неполном выполнении многошаговой операции."
  - "Разобрать фактический запуск или отчёт и установить, достаточно ли его доказательств для закрытия."
  - "После инцидента получить точный путь ложного завершения и минимальный воспроизводимый контрпример без ремонта системы."
do_not_use_for:
  - "Проектирование будущего /goal-контракта — это goal-contract-shaper."
  - "Исправление кода, точная проверка сохранённого payload, replay, recovery и идемпотентность."
  - "Проверка текущего состояния отдельного внешнего объекта без аудита завершения всей операции."
natural_triggers:
  - "проверь, не объявляет ли процесс успех раньше времени"
  - "можно ли честно считать этот запуск завершённым"
  - "найди путь ложного success"
  - "проверь все пути к завершению"
  - "проверь completion gate после инцидента"
