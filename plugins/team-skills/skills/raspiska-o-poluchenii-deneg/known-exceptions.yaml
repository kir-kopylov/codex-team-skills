exceptions:
  - symptom: "Сумма прописью разошлась с суммой цифрами (цифрами 500 000, прописью «пятьдесят тысяч»)."
    root_cause: "Цифры и пропись заполнялись как два независимых поля, без обязательной взаимной сверки перед генерацией."
    do_next_time: "Считать цифры и пропись одной сверяемой парой: показать обе формы вместе и подтвердить совпадение до рендера."
    source_example: "examples/good-01.md"
  - symptom: "В расписку подставлены ИИН и номер паспорта, которые пользователь не давал."
    root_cause: "Skill «дозаполнил» личные данные по догадке или из прошлого контекста."
    do_next_time: "Отсутствующие личные данные оставлять графой «____»; брать ФИО, ИИН, паспорт и адрес только из явно переданных пользователем."
    source_example: "examples/anti-01.md"
