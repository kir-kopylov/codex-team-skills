exceptions:
  - symptom: "Пользователь просил подключить учётную запись, а skill сразу потребовал URL и начал клонировать случайный проект."
    root_cause: "Смешаны два разных результата: host-level credential и локальная копия конкретного репозитория; URL был угадан по нерелевантному экрану."
    do_next_time: "Сначала довести GCM до LOCAL_CREDENTIAL_READY без репозитория. URL принимать только из явного сообщения пользователя, кнопки Clone with HTTPS или подтверждённого origin."
    source_example: "examples/anti-02-guessed-repo-or-multi-account.md"
  - symptom: "Repository-only PAT проверили запросом /api/v4/user, получили 403 и объявили токен нерабочим."
    root_cause: "Scopes read_repository/write_repository относятся к Git over HTTP; write_repository прямо не поддерживает API-аутентификацию."
    do_next_time: "Не использовать API как проверку. Локальную запись проверять через GCM, удалённое чтение — через точный приватный HTTPS repo."
    source_example: "examples/anti-01-api-or-public-repo-proof.md"
  - symptom: "git ls-remote публичного проекта прошёл даже с заведомо неверным токеном."
    root_cause: "Публичный GitLab repo читается анонимно, поэтому успех не доказывает, что credential был отправлен или принят."
    do_next_time: "Не засчитывать публичный repo. Для server-side проверки нужен приватный доступный repo; без него завершить на LOCAL_CREDENTIAL_READY."
    source_example: "examples/anti-01-api-or-public-repo-proof.md"
  - symptom: "Пользователь нажал Generate token, но Windows продолжила использовать старый credential."
    root_cause: "GitLab показал новое значение только в браузере; создание PAT не записывает его в Git Credential Manager."
    do_next_time: "Сразу скопировать показанный один раз token и запустить bundled script. При старой записи использовать -Replace."
    source_example: "examples/good-02-replace-stale-credential.md"
  - symptom: "Страница с новым токеном закрыта до копирования, а пользователь пытается найти значение в списке токенов."
    root_cause: "GitLab показывает значение PAT только после создания; список хранит метаданные, а не повторно раскрываемый секрет."
    do_next_time: "Отозвать потерянный PAT и создать новый. Не просить пользователя присылать новое значение в чат."
    source_example: "examples/good-01-new-pc-no-repo.md"
  - symptom: "Наличие записи cmdkey или успешный локальный GCM get назвали полной проверкой GitLab-аккаунта."
    root_cause: "Локальный credential store не обращается к GitLab и не доказывает срок действия токена, доступ к проекту или право push."
    do_next_time: "Назвать состояние LOCAL_CREDENTIAL_READY. REMOTE_READ_VERIFIED выдавать только после git ls-remote точного приватного repo."
    source_example: "examples/good-03-private-repo-verification.md"
  - symptom: "Skill требует одновременно read_repository и write_repository для pull и push."
    root_cause: "По текущему контракту GitLab scope write_repository уже даёт read и write для Git over HTTP; второй scope избыточен."
    do_next_time: "Для только чтения выбрать read_repository; для pull и push выбрать write_repository. Оба отмеченных scope принять как допустимые, но не обязательные."
    source_example: "examples/good-01-new-pc-no-repo.md"
