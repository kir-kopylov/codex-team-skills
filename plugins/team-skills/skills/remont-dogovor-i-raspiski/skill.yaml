summary: "Собирает пакет документов по сделке на ремонт: рамочный договор оказания услуг и расписки (опц. акт) со ссылкой на перечень работ; держит сквозные инварианты (единый адрес/имена, итог = аванс + остаток, аванс = сумма частей, хронология) и оставляет пустые графы «____»."
use_cases:
  - "Собрать рамочный договор оказания услуг на ремонт со ссылкой на перечень работ из remont-smeta-builder."
  - "Сделать пакет «договор + расписки по платежам (аванс, этапы, окончательный расчёт)» с единым адресом и именами."
  - "Свести суммы так, чтобы итог = аванс + остаток и аванс = сумма частей, и проверить хронологию документов."
do_not_use_for:
  - "Договоры аренды/найма и допсоглашения к ним — это dopsoglasheniya-po-oplate."
  - "Составление самой сметы и пересчёт объёмов/цен — это remont-smeta-builder; здесь перечень идёт приложением."
  - "Юридическое заключение или подстановку выдуманных сторон, адресов, сумм и дат вместо подтверждённых пользователем."
natural_triggers:
  - "составь договор на ремонт и расписки"
