exceptions:
  - symptom: "Итог по договору не сошёлся: аванс + остаток не равны общей сумме, а сумма расписок не равна итогу."
    root_cause: "Суммы в договоре и расписках вводились по отдельности, без проверки инварианта итог = аванс + остаток = сумма частей."
    do_next_time: "До сборки проверять инвариант итог = аванс + остаток и аванс = сумма частей; расхождение выносить пользователю, не подгонять цифры молча."
    source_example: "examples/good-01.md"
  - symptom: "Расписка от 1 июня ссылается на акт приёмки от 10 июня — документ ссылается на «будущий» документ."
    root_cause: "Не проверена хронология ссылок между документами пакета."
    do_next_time: "Проверять хронологию: документ не должен ссылаться на более позднюю дату; конфликт выносить пользователю, а не «чинить» ссылку молча."
    source_example: "examples/anti-02.md"
