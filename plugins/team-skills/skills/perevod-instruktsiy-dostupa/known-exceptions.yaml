exceptions:
  - symptom: "В китайском адресе имена собственные переведены (например, 阿拉木图 или 三月八日街), хотя пользователь просил транслитерацию."
    root_cause: "Правило смешивало транслитерацию названия улицы и города со стилем адреса на языке перевода и допускало иероглифы для имён собственных."
    do_next_time: "Название города и улицы транслитерировать латиницей, а тип адресного объекта переводить: Almaty, 8 Marta 街, Kosmonavtov 大道, Tramvayny 巷."
    source_example: "Обезличенный случай перевода JSON инструкций доступа, где Almaty и 8 Marta должны были остаться латиницей в ch.address."
  - symptom: "Целевые блоки корректно разбираются как JSON, но содержат следы машинного перевода вроде castle вместо замка или maid вместо сотрудника уборки."
    root_cause: "Существующим блокам en, kk, ch доверяли только потому, что файл разбирался, вместо пересборки или сверки смысла с ru."
    do_next_time: "Пересобрать целевые блоки из ru либо сверить их по списку опасных маркеров до сохранения: castle, maid, битая кодировка и слово Консьерж за пределами ru."
    source_example: "Обезличенный случай с JSON инструкций доступа, где остались старые машинные переводы."
  - symptom: "Проверка JSON проходит, но переведённая инструкция противоречит ru: условие про отдельный вход, главный вход, лестницу или лифт привязано к другому действию."
    root_cause: "Проверка сравнивала схему, плейсхолдеры и токены, но не сверяла маршрут, действие и условие каждого шага с русским источником."
    do_next_time: "Перед сдачей сверять смысл: для каждого нумерованного шага сравнить маршрут, вход, направление, лифт или лестницу, потребность в ключе или коде, альтернативы и порядок действий в ru и en, kk, ch."
    source_example: "Обезличенный случай, где во втором шаге целевого языка изменился маршрут гостя при формально корректном JSON."
  - symptom: "Слова переведены, но токены переносов изменились: CRLF стал LF, LF стал CRLF, одиночный CR пропал или границы абзацев и пунктов слиплись."
    root_cause: "Переносы считали косметикой или позволили редактору и форматтеру нормализовать их вместо посимвольной сверки последовательностей по каждому полю."
    do_next_time: "Перед сохранением извлечь токены CRLF, LF, CR из каждой строки ru и соответствующих строк en, kk, ch и не сдавать файл, пока количество, порядок и тип не совпадут точно."
    source_example: "Обезличенное правило приёмки, по которому переносы внутри строковых значений JSON должны пережить перевод без нормализации."
