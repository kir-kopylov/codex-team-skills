owner: "@etazhycommerce"
authors:
  - "Оксана"
source_asset: "Методика Оксаны для перевода инструкций доступа посуточной аренды; опубликована в санированном виде — без приватных файлов, реальных путей, кодов доступа, адресов и идентификаторов квартир."
status: "experimental"
summary: "Переводит JSON инструкций доступа, заселения и выезда для посуточных апартаментов на английский, казахский и китайский с сохранением схемы, кодов, разметки, плейсхолдеров, переносов строк и кодировки UTF-8 без BOM."
use_cases:
  - "Перевести JSON входа, заселения или выезда из русского блока в en, kk, ch и сохранить готовый файл."
  - "Исправить старые машинные переводы в JSON, не доверяя существующим блокам целевых языков."
  - "Проверить сохранность разметки, плейсхолдеров, кодов доступа, этажей, подъездов, адресов и точной последовательности переносов строк CRLF, LF, CR."
  - "Применить правила транслитерации городов и улиц: имя латиницей, тип адресного объекта на языке перевода."
do_not_use_for:
  - "Обычный художественный перевод без JSON-схемы и инструкций доступа, заселения или выезда."
  - "Юридически заверенный, нотариальный или официальный перевод."
  - "Проверку того, что адрес, наличие, цена, телефон, график или реквизиты актуальны прямо сейчас."
  - "Публикацию приватных исходных JSON, реальных адресов, кодов доступа или идентификаторов квартир в публичный repo."
natural_triggers:
  - "переведи JSON с инструкциями доступа на три языка"
  - "переведи entranceMessages.json"
  - "сделай готовый JSON с блоками en, kk, ch"
  - "исправь перевод улиц и названия города в китайском блоке"
  - "проверь UTF-8 без BOM, плейсхолдеры и переносы строк в переведённом JSON"
example_files:
  - "examples/good-01-ready-file.md"
  - "examples/good-02-street-city-transliteration.md"
  - "examples/good-03-repair-machine-translation.md"
  - "examples/good-04-line-break-preservation.md"
  - "examples/anti-01-chat-only-literary-translation.md"
  - "examples/anti-02-live-state-verification.md"
last_reviewed: "2026-09-20"
