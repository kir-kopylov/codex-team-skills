interface:
  display_name: "Перевод инструкций доступа"
  short_description: "Переводит JSON инструкций доступа с проверкой схемы, кодов и смысла"
  default_prompt: "Сделай перевод этого JSON инструкций доступа на английский, казахский и китайский, сохранив схему, коды, плейсхолдеры, смысл маршрутов, последовательность переносов CRLF, LF, CR и кодировку UTF-8 без BOM."
