owner: "@kir-kopylov"
status: "experimental"
summary: "Проверяет, что текст объясняет о причинах, ограничениях и механизмах, и отделяет это от желательных условий."
source_asset: "Обезличенная процедура сравнительного разбора аналитических ответов; примеры вымышлены, исходная переписка и частные сведения не публикуются."
use_cases:
  - "Проверить, объясняет ли ответ наблюдаемое поведение или предлагает желательное устройство."
  - "Сравнить глубину и полезность нескольких объяснений по одному критерию."
  - "Найти непроверенные допущения о согласии, полномочиях, мотивах и управляемости."
do_not_use_for:
  - "Самостоятельное установление фактов без источников или подмена полного исследования разбором текста."
  - "Обязательное ранжирование, переписывание ответа или производственный аудит плана без запроса."
  - "Критика личности автора или подтверждение предпочтения пользователя вопреки содержанию."
natural_triggers:
  - "проверь объяснительную ценность"
  - "что здесь действительно объяснено"
  - "сравни глубину и содержательность этих объяснений"
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
last_reviewed: "2026-11-20"
