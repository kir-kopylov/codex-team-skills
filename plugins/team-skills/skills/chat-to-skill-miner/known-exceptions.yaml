exceptions:
  - symptom: "Навык объявлен дублем другого skill только потому, что оба получают на вход чат."
    root_cause: "Совпадение входного материала было принято за совпадение выполняемой операции и результата."
    do_next_time: "Сравнить вопрос, выход и точку остановки: поиск кандидатов, фиксация статусов тезисов и проектирование одного контракта являются разными этапами."
    source_example: "examples/anti-02.md"
  - symptom: "Результат одного исторического чата превращён в обязательный список кандидатов для всех последующих запусков."
    root_cause: "Предметный пример был встроен в ядро процедуры вместо использования как заменяемой проверки."
    do_next_time: "Генерировать кандидатов только из текущего материала, а предметные примеры использовать для проверки общего гейта повторяемости."
    source_example: "examples/good-03.md"
  - symptom: "Навык выдаёт полный контракт и начинает создавать новый skill вместо ранжирования кандидатов."
    root_cause: "Не закреплена граница остановки между поиском кандидатов и проектированием выбранного skill."
    do_next_time: "Остановиться после ранжированного списка и передать выбранный кандидат в skill-methodologist."
    source_example: "examples/anti-02.md"
  - symptom: "Уже смерженный патч или изменение в актуальной доставке снова попадает в рекомендацию V1, либо исторический, отменённый commit или закрытый незамерженный PR ошибочно выдаётся за текущую доставку."
    root_cause: "Утверждение из чата или совпадение с отдельным историческим commit заменило проверку актуального worktree, tip активной ветки, head открытого PR и актуального main; признаки составной дельты из разных слоёв могли быть ошибочно объединены в MERGED + EXACT, а состояние runtime было смешано с доставкой в repo."
    do_next_time: "Сначала сформулировать точную поведенческую дельту, считать delta_match отдельно на целостном снимке каждого слоя и по read-only доказательствам классифицировать implementation_state, delta_match и runtime_state; для COMMITTED доказать активную ветку, достижимость реализующего commit из её tip и наличие всей дельты в итоговом снимке tip, не объединять слои, при PARTIAL перенести каждую совпавшую часть в её собственное состояние доставки, а остаток независимо классифицировать до конечного состояния или безопасного UNKNOWN."
    source_example: "examples/good-04.md"
