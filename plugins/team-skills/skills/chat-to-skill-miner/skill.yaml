owner: "@kir-kopylov"
author_github: "@kir-kopylov"
authors:
  - "Кирилл Копылов"
source_asset: "Санитизированная методика поиска и ранжирования кандидатов на навыки из рабочих чатов; приватные переписки и предметные данные не переносились."
status: "team-ready"
summary: "Находит в чатах повторяемые процессы, отделяет уже реализованное от предложенного и рекомендует новый skill, патч, reference/test или отсутствие изменения библиотеки."
use_cases:
  - "Изучить длинный рабочий чат и выделить несколько повторяемых процессов, которые оправдывают отдельные skills."
  - "Отделить рабочие процедуры от стилевых предпочтений, единичных идей и небезопасных автоматизаций."
  - "Оценить кандидатов по повторяемости, боли, границам, тестируемости и выбрать не более трёх для дальнейшего проектирования."
  - "Отличить новый skill от патча существующего workflow, общей справки, теста или случая, где библиотеку менять не нужно."
  - "Не рекомендовать повторно изменение, которое доказано на актуальном worktree, tip активной ветки доставки, head открытого PR или актуальном main."
do_not_use_for:
  - "Обычный пересказ чата, протокол встречи или извлечение списка задач."
  - "Проектирование полного контракта одного уже выбранного skill; для этого используйте skill-methodologist."
  - "Доказательный реестр принятых, отвергнутых и открытых тезисов; для этого используйте razbor-chata-na-artefakty."
  - "Создание файлов, tests, catalog или Pull Request нового skill; для этого используйте add-team-skill."
natural_triggers:
  - "изучи этот чат и предложи навыки"
  - "что здесь можно формализовать"
  - "какие навыки создать из нашей работы"
  - "найди повторяемые процессы в этом диалоге"
  - "какие навыки или патчи можно извлечь из этого чата"
  - "отсей ложные навыки и расставь реальные по приоритету"
example_files:
