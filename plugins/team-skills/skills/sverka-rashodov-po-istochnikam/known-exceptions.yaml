  - symptom: "Квитанция без перечня работ объявлена подтверждением назначения из соседнего сообщения."
    root_cause: "Соседство и совпадение суммы использованы вместо установленной связи документа с конкретной операцией."
    do_next_time: "Отдельно назвать поля квитанции и утверждение сообщения; проверить основание связи, при неоднозначности оставить её неустановленной и точно описать расходящиеся назначения."
    source_example: "examples/anti-01.md"
  - symptom: "Суммы до и после комиссии сложены как подтверждённые поступления."
    root_cause: "Сопоставлены суммы с разными основаниями, а поля eHous приняты за доказательство выплаты."
    do_next_time: "Отдельно сверить сумму и период каждой заявки, установить основание и единицы комиссии, для выплаты использовать связанный платёжный документ."
    source_example: "examples/good-06.md"
