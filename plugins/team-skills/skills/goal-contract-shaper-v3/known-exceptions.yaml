exceptions:
  - symptom: "Ассистент начинает выполнять целевую задачу вместо shaping."
    root_cause: "Сырая цель выглядит как обычная практическая задача, и режим goal-shaper не удержан."
    do_next_time: "Сразу сказать, что skill не выполняет задачу и не запускает /goal; перейти к checklist и задать один вопрос."
    source_example: "examples/anti-01-execute-task.md"
  - symptom: "Пользователь раздражается на служебный заголовок, который показывает внутреннюю механику чеклиста."
    root_cause: "Заголовок показывает внутреннюю механику чеклиста вместо человеческого процесса выявления."
    do_next_time: "Использовать 'Сейчас выявляем' и коротко объяснить, какое условие контракта формируется."
    source_example: "examples/good-01-live-state-goal.md"
  - symptom: "Вопрос получается перегруженным и смешивает несколько решений."
    root_cause: "Ассистент пытается закрыть сразу статус, приоритет канала и тайминг."
    do_next_time: "Переформулировать до одного конкретного решения, ответ на которое можно вставить в контракт."
    source_example: "examples/good-01-live-state-goal.md"
  - symptom: "Ассистент сужает цель до доменного сценария и пропускает механику создания ценности."
    root_cause: "Goal shaping начинается с привычного checklist по live-state, а не с объекта работы, ценности, ролей, единиц процесса, потери, стоимости и риска."
    do_next_time: "Сначала выявить универсальную грамматику деятельности: что меняем, для кого это ценно, кто проверяет реальность, кто действует, что является одним кругом и что теряется без действия."
    source_example: "examples/good-04-value-creation-cycle.md"
  # --- v3: карточки из аудита сессии pc-upgrade-hunt (2026-07-04) ---
  - symptom: "Контракт задаёт финал, недостижимый агентом в одиночку (нужен user-only грант или ответ третьих лиц), и loop не может завершиться (Stop-hook перезапускается)."
    root_cause: "Финал не разложен на под-условия по владельцу власти; нет BLOCKED-состояния и partial-выхода, реально терминирующего completion-hook."
    do_next_time: "Пункт 1a: проверить достижимость каждого под-условия; чужую власть — в Шаг 0 или BLOCKED; успех мерить контролируемым агентом уровнем ('сделано агентом' vs 'подтверждено миром')."
    source_example: "unknown"
  - symptom: "Проверка выставила 'годен' по заголовку/названию/допущению, а реальный признак (форм-фактор, ECC, доставка) ему противоречил."
    root_cause: "Головное требование не разложено в per-unit проверку прямого признака; прокси принят за факт."
    do_next_time: "Матрица покрытия требований (пункт 3): прямой признак, named false-positive прокси, нет источника → UNVERIFIED."
    source_example: "unknown"
  - symptom: "Разрешения/сессии вооружаются реактивно в точке критического действия, пользователя заваливает окнами, автономия рушится."
    root_cause: "Авторизация не вынесена в предусловие; цепочка полномочий (все consent-слои) не смоделирована."
    do_next_time: "Шаг 0 вооружения + Цепочка полномочий (пункт 6); окно-разрешение — кликом в самом окне, не текстом в чат (иначе отмена = reject)."
    source_example: "unknown"
  - symptom: "Агент уверенно утверждал, как ведёт себя внешняя система; после опровержения выдавал новую уверенную теорию."
    root_cause: "Нет эпистемического сброса после опровержения (карта принята за территорию)."
    do_next_time: "Эпистемический гейт: гипотеза до наблюдения; после опровержения — модель подсистемы в UNKNOWN; два опровержения → STOP+эскалация."
    source_example: "unknown"
  # --- v3.1: карточка из сессии pc-upgrade-hunt (2026-07-06) ---
  - symptom: "Окно 'Allow Claude to read/click/navigate on <site>?' в Claude Code повторяется на каждое действие; 'Always allow' нажимается, но 'Your approved sites' расширения остаётся пустым."
    root_cause: "Claude-in-Chrome (наблюдалось на v1.0.79) пишет любой ответ диалога как разовый грант (duration:'once'); вечный грант не создаётся. Баг-репорт: github.com/anthropics/claude-code/issues/74715."
    do_next_time: |
      До старта цикла (Шаг 0) открыть страницу настроек расширения Claude -> Permissions -> "Your approved sites"
      и убедиться, что ВСЕ домены цели в списке. Если нет — жать кнопку бесполезно; рабочий обход:
      chrome://extensions -> включить "Режим разработчика" -> карточка Claude -> ссылка "service worker" ->
      вкладка Console -> выполнить, подставив свои домены (при первом paste Chrome попросит набрать "allow pasting"):
        chrome.storage.local.get('permissionStorage', d => {
          const s = d.permissionStorage || { permissions: [] };
          for (const host of ['SITE.ru', 'www.SITE.ru']) {
            s.permissions.push({ id: crypto.randomUUID(),
              scope: { type: 'netloc', netloc: host },
              action: 'allow', duration: 'always', createdAt: Date.now() });
          }
          chrome.storage.local.set({ permissionStorage: s }, () => console.log('OK', s.permissions));
        });
      После — обновить страницу настроек и сверить, что домены появились (грант = след, а не жест).
      После обновления расширения проверять, не починена ли кнопка (issue #74715); отзыв гранта — кнопкой Revoke в том же списке.
    source_example: "unknown"
