  - "examples/good-02-ci-debug-goal.md"
  - "examples/good-03-feedback-answer.md"
  - "examples/good-04-value-creation-cycle.md"
  - "examples/anti-01-execute-task.md"
  - "examples/anti-02-one-shot-rewrite.md"
