owner: "@kir-kopylov"
status: "experimental"
base_version: "goal-contract-shaper (plugin team-skills), snapshot 2026-07-04"
summary: "ЭКСПЕРИМЕНТАЛЬНАЯ v3: формирует проверяемый /goal-контракт из сырой цели; дополнительно жёстко закрывает достижимость финала, completion gate, предикат-над-прокси, BLOCKED, вооружение предпосылок, цепочку полномочий, сквозную пробу, единый источник правды, провенанс и эпистемический гейт. Для независимого A/B-тестирования против базовой версии."
changes_from_base:
  - "1a. Достижимость финала (satisfiability): под-условия по владельцу власти; отклонять недостижимый агентом финал без BLOCKED."
  - "Шаг 0. Вооружение human-only предпосылок до цикла, каждая с точным органом управления."
  - "Фаза 0. Сквозная проба одной единицы через самую трудную стадию до масштабирования."
  - "Completion gate: user-visible success, direct evidence, forbidden false positives, freshness, human gate, contradiction check, close_allowed."
  - "Пункт 3. Матрица покрытия требований: per-unit проверка прямого признака, named false-positive прокси, нет источника → UNVERIFIED."
  - "Пункт 4. BLOCKED как штатное состояние; partial-result реально терминирует completion-hook."
  - "Пункт 6. Цепочка полномочий: путь через все consent-слои; звенья, что агент не выдаёт себе сам."
  - "Пункт 7. Единый источник правды (счётчики из журнала) + read-then-act."
  - "Пункт 9. Провенанс human/bot: авто-ответ платформы не в зачёт human-gated проверки."
  - "Пункт 11. Блокеры по классу: перечень иллюстративный + catch-all."
  - "Жёсткие правила: эпистемический гейт + формат блокера (одна строка + одно физ-действие)."
  - "known-exceptions.yaml: +4 карточки из аудита сессии pc-upgrade-hunt."
  - "v3.1 Шаг 0: грант = след, а не жест (после жеста — сверка по авторитетному хранилищу; след отсутствует → обход из known-exceptions или BLOCKED) + инвентаризация всех доменов browser-цели с грантами скопом."
  - "v3.1 Фаза 0: критерий 'тишины разрешений' — сквозная проба засчитана только без единого всплывшего окна подтверждения."
  - "v3.1 Пункт 6: у каждого звена цепочки полномочий — способ верификации следа гранта и известный обман звена."
  - "v3.1 known-exceptions.yaml: +карточка про сломанный 'Always allow' Claude-in-Chrome с готовым обходом (issue anthropics/claude-code#74715)."
use_cases:
  - "Довести сырую цель до проверяемого /goal-контракта перед запуском AI-loop."
  - "Выявить объект работы, создаваемую ценность, финал, текущие сигналы, роли, единицы действия/проверки/потери, цикл, стопы, память, экономику, данные, риски и production gaps."
  - "Оформить сопровождаемый человеческий цикл, когда результат требует человека, полномочий, денег, доверия, переговоров, физического действия или внешнего события."
  - "Остановить преждевременное выполнение задачи, когда пользователь просит сначала проверить пригодность цели для /goal."
  - "Задать completion gate, который не даёт закрыть /goal по процессу, форме входа, spinner, старому скрину или успешной CLI/Codex-проверке вместо прямого пользовательского результата."
do_not_use_for:
  - "Непосредственное выполнение целевой задачи, поиск live-state, браузинг, контакт с внешними сервисами или запуск /goal."
  - "Разовую задачу, которую закрывает один обычный prompt без итераций, внешних систем и проверяемого финала."
  - "Создание файлов нового team skill в repo; для этого используйте add-team-skill."
natural_triggers:
  - "проверь цель для /goal"
  - "подходит ли это для /goal"
  - "сформулируй /goal-контракт"
  - "доведи сырую цель до goal-контракта"
  - "не выполняй задачу, помоги сделать цель проверяемой"
  - "сделай из этого проверяемую /goal-цель"
  - "разложи цель как процесс создания ценности"
  - "проверь роли, единицы действия, потери и доказательства"
  - "добавь completion gate к /goal"
example_files:
