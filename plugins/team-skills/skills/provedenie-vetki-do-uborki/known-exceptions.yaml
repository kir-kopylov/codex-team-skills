exceptions:
  - symptom: "Команды git не срабатывают с ошибкой not a git repository."
    root_cause: "Skill дал короткую команду без git -C, хотя текущий терминал стоял не в target repo."
    do_next_time: "Перед любой командой доказать target repo и использовать git -C <repo>, пока cwd не подтверждён."
    source_example: "examples/anti-01.md"
  - symptom: "Старый локальный commit cherry-pick'ится на свежий main и ломает тесты."
    root_cause: "Commit был создан до текущего repo contract и не содержит новых обязательных файлов или секций."
    do_next_time: "После cherry-pick прогнать tests, довести пакет до текущего контракта repo и amend/rebase перед push."
    source_example: "examples/good-01.md"
  - symptom: "Remote branch выглядит как clutter, но не merged в origin/main."
    root_cause: "Skill принял наличие remote branch за достаточное доказательство для удаления."
    do_next_time: "Сначала проверить commit, diff, PR state и reachability; unmerged ветку удалить только после явного discard решения."
    source_example: "examples/good-03.md"
  - symptom: "Пока выполнялись тесты, origin/main продвинулся, но commit и push продолжились по результатам со старой базы."
    root_cause: "Skill не связал тесты с конкретными base, WIP-delta, index tree и final HEAD, сравнивал base-dependent raw diff либо терял позицию правки при нормализации hunk, не отделил base-derived semver от стабильной дельты, мог свести намеренный minor/major bump к patch, а recovery-stash счёл своим по позиции без доказательства новой записи."
    do_next_time: "Разделить clean committed-only и WIP; для WIP доказать все dirty, untracked и same-path hunks, exact index tree и родителей stash, до apply потребовать UNIQUE_HUNK_MAPPING_PASS либо остановиться на неоднозначных одинаковых строках, в проверенном непустом temp-каталоге воспроизвести стабильную дельту через GIT_INDEX_FILE на новой базе и сравнить expected/actual tree; каждый producer, compare и mutation закрывать собственным fail-closed переходом с явной проверкой exit status, не полагаясь на статус последней команды, отдельно проверить нормализованный manifest, сохранённый тип semver bump и новую версию, ровно один stash по object SHA и subject; после доказанного commit удалить только его либо сохранить при заблокированном cleanup, затем проверить exact lease и post-push base/head readback."
    source_example: "examples/good-04.md"
  - symptom: "Вспомогательная проверка падает до начала работы: интерпретатор не найден либо в worktree нет своей среды с зависимостями repo."
    root_cause: "Предполагалось, что короткая команда интерпретатора есть в поиске команд и что каждый worktree содержит собственную полную среду."
    do_next_time: "Сразу вызывать абсолютный интерпретатор из основной среды repo для всех worktree этого репозитория и проверять его до первой проверки."
    source_example: "examples/good-01.md"
  - symptom: "Инструменты внезапно перестают находиться в оболочке посреди цикла команд."
    root_cause: "Переменной дали имя `path`; в zsh это имя связано с массивом путей поиска команд и перезаписало его."
    do_next_time: "Не называть переменные оболочки `path`; путь к инструменту получать через `command -v`, а не подставлять абсолютный путь наугад."
    source_example: "examples/good-01.md"
  - symptom: "Подготовленные файлы с текстом PR исчезли между шагами, а повтор ответа в обсуждении упёрся в обрыв соединения."
    root_cause: "Временный каталог и доступность API приняты за состояние, сохраняющееся между шагами."
    do_next_time: "Держать подготовленные артефакты вне временного каталога, перед правкой перечитывать живое описание PR, а перед повтором запроса проверять, не опубликован ли ответ уже."
    source_example: "examples/good-01.md"
  - symptom: "Локальная проверка описания PR запущена без обязательного режима, а подготовленный текст затем остановлен языковым гейтом."
    root_cause: "Прежний вызов проверки сочтён действующим, а технические слова — проходящими гейт без оформления кодом."
    do_next_time: "Прогонять `scripts/check_pr_governance.py metadata --event-path <файл события>` из среды repo до сборки артефактов одобрения и оформлять технические слова кодом."
    source_example: "examples/good-01.md"
  - symptom: "Ответ в обсуждении PR не отправился: команда не собралась из-за обратных кавычек внутри шаблонной строки."
    root_cause: "Обратные кавычки markdown внутри тела комментария оказались синтаксисом окружающей шаблонной строки."
    do_next_time: "Тело комментария передавать отдельной безопасно экранированной переменной или файлом и не встраивать его в шаблонную строку."
    source_example: "examples/good-01.md"
  - symptom: "Чтение одного комментария по идентификатору возвращает 404."
    root_cause: "Использован адрес комментариев к коду ревью, хотя идентификатор принадлежит комментарию обсуждения."
    do_next_time: "Комментарий обсуждения читать адресом обсуждений `issues/comments/{id}`; после любой ошибки перечитывать состояние до повтора."
    source_example: "examples/good-01.md"
  - symptom: "Ожидание проверок оборвалось по связи, когда большинство задач уже завершилось."
    root_cause: "Долгое watch-соединение принято за надёжный источник финального статуса CI."
    do_next_time: "После обрыва watch отдельно перечитать полный список проверок PR и не считать транспортный сбой результатом CI."
    source_example: "examples/good-01.md"
  - symptom: "Для одного изменения открыто два PR: отложенная задача продолжила работу после запуска обходного пути."
    root_cause: "Отсутствие задачи в списке после нескольких проверок принято за доказательство, что она больше не запустится."
    do_next_time: "Не запускать запасную задачу, пока отложенная не получила явный конечный или отменённый статус; иначе ждать либо работать только в одной уже существующей."
    source_example: "examples/good-01.md"
