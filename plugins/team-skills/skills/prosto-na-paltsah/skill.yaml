owner: "@kir-kopylov"
author_github: "@kir-kopylov"
authors:
  - "Автор исходного навыка, передавший архив prosto-na-paltsah (имя не подтверждено)"
source_asset: "Санированный навык из переданного архива plus личный промпт-первоисточник из семи вопросов «объясни по-простому, как умному человеку не в теме», переработанный под краткий ответ по умолчанию."
status: "experimental"
summary: "Объясняет незнакомую штуку простыми словами и доводит до адресного решения «вникать сейчас / не сейчас / проба», коротким ответом по умолчанию."
use_cases:
  - "Человек не понимает незнакомую технологию, концепцию, метод или термин и просит объяснить по-простому, как умному человеку не в теме."
  - "Человек принёс статью, спеку, лендинг, релиз-ноут или пересказ видео и спрашивает, что это и нужно ли это ему сейчас."
  - "Человек уже получил короткий ответ и просит развернуть один блок — цену, альтернативы, шаги на старт или проверку заявленных свойств."
do_not_use_for:
  - "Подтверждение живого состояния перед действием — цена, наличие, слот, реквизиты; для этого используйте `verify`."
  - "Готовое решение о том, оставить ли уже построенный механизм в собственном коде; для этого используйте `overengineering-stop-gate`."
  - "Разбор идеи пользователя на скрытые допущения и системный контекст без незнакомого предмета; для этого используйте `conceptual-decomposition`."
natural_triggers:
  - "объясни по-простому, я не в теме"
  - "что это вообще такое"
  - "как это работает"
  - "нужно ли мне это сейчас"
  - "стоит ли в это вникать"
  - "чем отличается от того, что у меня уже есть"
