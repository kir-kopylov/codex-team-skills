exceptions:
  - symptom: "Навык разбирал статью, спеку или объяснение коллеги так, будто их написал продавец: искал присвоенные чужие механизмы, вместо объяснения выдавал разоблачение."
    root_cause: "Один из семи вопросов первоисточника — «что тут маркетинг, а что подтверждено» — был поднят до посылки всего навыка, и остальные шаги оказались переписаны через фигуру продавца, которой в источнике не было."
    do_next_time: "Держать проверку источника одним шагом из девяти и применять её к любому источнику, включая собственную догадку. Начинать с устройства предмета, а не с поиска подвоха. Формулировка «разоблачение как самоцель» вынесена в фон-запреты."
    source_example: "examples/good-02-prinesli-lending.md"
  - symptom: "На простой вопрос «что такое X» выдавалось полотно из девяти разделов с заголовками, хотя человек просил объяснить по-простому."
    root_cause: "Процедура и формат вывода были слиты: каждый шаг содержал требование что-то вывести («оба списка обязательны», «четыре строки, ни одну не пропускать», «минимум три альтернативы»), и модель читала нумерованные заголовки шагов как оглавление ответа."
    do_next_time: "Пункты мышления держать без нумерованных заголовков и без глаголов вывода, а формат ответа задавать отдельно и числом. Любая нижняя граница («минимум три») читается как цель — оставлять только потолки."
    source_example: "examples/good-01-nezakomiy-termin.md"
  - symptom: "Короткий ответ упирался в потолок, и под нож первым уходило объяснение — оставался вердикт без предмета, который отменяется первой встречной фразой."
    root_cause: "Объяснение — единственный эластичный кусок ответа, остальные куски атомарны, поэтому при переполнении режется именно оно, если порядок отреза не задан явно."
    do_next_time: "Соблюдать записанный порядок отреза: приглашение, признак списка, кэш-формула, основание. Устройство режется последним и никогда не опускается ниже одного предложения."
    source_example: "examples/good-03-razvertka-odnogo-bloka.md"
  - symptom: "Ответ был коротким, но проверить в нём было нечего: «полезная штука, скорее всего вам подойдёт, стоит попробовать»."
    root_cause: "Краткость понималась как разрешение опускать ярлыки источника, «не знаю» и условие отмены, хотя она разрешает не печатать только известное."
    do_next_time: "Краткость — законная причина не печатать известное и незаконная — замаскировать неизвестное. Решение без адреса и без строки «отменяется, если» считать таким же провалом, как полотно."
    source_example: "examples/anti-01-chelovek-perechislil-voprosy.md"
