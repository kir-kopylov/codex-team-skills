owner: "@kir-kopylov"
author_github: "@kir-kopylov"
authors:
  - "kir-kopylov"
source_asset: "Обезличенный рабочий процесс фиксации представления Google Sheets в репозитории."
status: "team-ready"
summary: "Фиксирует объявленный контракт представления Google Sheets в одном YAML и сверяет его с живой вкладкой без записи в таблицу."
use_cases:
  - "Создать в репозитории один YAML-контракт по структуре и оформлению существующей вкладки Google Sheets."
  - "Обновить управляемые части существующего YAML после свежего чтения вкладки, сохранив соседние ключи."
  - "Сравнить объявленные свойства представления с живой вкладкой и получить точный статус MATCH, DRIFT или BLOCKED."
do_not_use_for:
  - "Изменение или восстановление живой Google-таблицы по YAML."
  - "Экспорт строк данных, значений формул, комментариев или истории изменений."
  - "Двусторонняя синхронизация, миграция схемы либо создание генератора таблиц."
  - "Версионирование бизнес-правил и предметных статусов, не относящихся к представлению."
natural_triggers:
  - "зафиксируй формат этой вкладки Google Sheets в репозитории"
  - "обнови YAML-шаблон по живой вкладке без данных"
  - "сверь сохранённое представление с Google Sheets"
  - "проверь, не уплыло ли оформление вкладки"
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
last_reviewed: "2026-08-22"
