exceptions:
  - symptom: "Результат назван полностью воспроизводимым шаблоном или средством восстановления вкладки."
    root_cause: "Односторонний снимок ошибочно принят за исполнимую схему, хотя обратная запись не реализована и не проверена."
    do_next_time: "Сузить обещание до фиксации и сравнения объявленных полей; явно запретить применение YAML обратно к Google Sheets."
    source_example: "examples/anti-01.md"
  - symptom: "В YAML попали рабочие строки, идентификатор таблицы, её URL или приватный локатор внутри формулы."
    root_cause: "Сборщик вышел за allowlist представления и начал сохранять содержимое либо приватный адрес источника."
    do_next_time: "Удалить лишние поля, повторно прочитать только метаданные, заголовки и текст формул без вычисленных значений; при приватном локаторе в формуле вернуть BLOCKED."
    source_example: "examples/anti-02.md"
  - symptom: "Обновление YAML затёрло соседние ключи или чужие незакоммиченные изменения."
    root_cause: "Вместо точечной замены provenance и view_contract файл был перезаписан целиком без предпроверки состояния целевого пути."
    do_next_time: "До записи проверить только целевой путь; при предшествующих изменениях вернуть BLOCKED, иначе сохранить все ключи вне двух управляемых частей."
    source_example: "examples/good-02.md"
