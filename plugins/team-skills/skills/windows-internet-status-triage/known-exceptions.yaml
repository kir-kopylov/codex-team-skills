exceptions:
  - symptom: "Windows показывает No internet, но curl/браузер/winget частично работают; dns.msftncsi.com возвращает 198.18.x.x вместо стандартного 131.107.255.255."
    root_cause: "NCSI ожидает стандартный DNS probe content, а текущая DNS/VPN/роутер-политика возвращает fake-IP из 198.18.0.0/15. Фактическая сеть жива, но Windows internet-status не совпадает с политикой DNS."
    do_next_time: "Сначала собрать факты и backup. Если расхождение стабильно и пользователь согласен на временный workaround, выставить ActiveDnsProbeContent в фактический DNS-ответ, очистить DNS cache, перезапустить Dnscache/NlaSvc/netprofm и проверить Get-NetConnectionProfile."
    source_example: "examples/good-01.md"
  - symptom: "После диагностики внутри Codex видны HTTP_PROXY/HTTPS_PROXY/ALL_PROXY=http://127.0.0.1:9, codex doctor или winget падают, а вне sandbox те же проверки зеленые."
    root_cause: "Ложноположительный симптом из sandbox/ограниченного агентского окружения, а не реальная системная proxy-настройка Windows."
    do_next_time: "Не чинить Windows по этим данным. Перепроверить ключевые команды вне sandbox/elevated: codex doctor, winget --info, Get-NetConnectionProfile; только потом делать вывод о реальной системе."
    source_example: "examples/good-03.md"
  - symptom: "Fake-IP на роутере/VPN отключили, а Windows снова показывает No internet после прежнего workaround."
    root_cause: "ActiveDnsProbeContent был временно синхронизирован с fake-IP, но DNS-политика изменилась и теперь Windows ожидает устаревший ответ."
    do_next_time: "Восстановить backup NCSI или вернуть ActiveDnsProbeContent к стандартному 131.107.255.255, затем очистить DNS cache и перезапустить NlaSvc/netprofm."
    source_example: "examples/good-02.md"
  - symptom: "Ассистент сразу правит NCSI, не проверив фактический HTTP/HTTPS доступ и не сделав backup."
    root_cause: "Нарушена граница skill: NCSI workaround применен как магическая правка, а не как подтвержденная синхронизация ожидания Windows с текущим DNS-ответом."
    do_next_time: "Остановиться, снять collect-network-status, сделать backup, объяснить риск и только после этого применять set-ncsi-probe-content."
    source_example: "examples/anti-01.md"
  - symptom: "При IPv4Connectivity = Internet ассистент продолжает менять NCSI, хотя не устанавливается Store/winget приложение."
    root_cause: "Неверный routing: Windows internet-status уже корректный, а проблема находится в Store login, WAM, App Installer, package source или конкретном installer flow."
    do_next_time: "Закрыть этот skill и перейти к Windows Store/app install triage. NCSI не менять."
    source_example: "examples/anti-02.md"
