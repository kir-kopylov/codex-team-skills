owner: "@kir-kopylov"
status: "experimental"
summary: "Runbook для случая, когда Windows показывает No internet/Offline, хотя сеть частично работает: собрать факты, отделить NCSI от реальной поломки сети, распознать fake-IP/proxy/VPN/sandbox шум, сделать backup перед временной правкой NCSI и проверить откат."
use_cases:
  - "Windows показывает No internet/Без доступа к Интернету, но браузер, curl, winget, Store или отдельные сайты частично работают."
  - "Нужно проверить NCSI: ActiveDnsProbeContent, dns.msftncsi.com, msftconnecttest и расхождение между ожидаемым и реальным DNS-ответом."
  - "DNS возвращает fake-IP диапазона 198.18.x.x, и надо понять, это нормальная политика VPN/прокси/роутера или причина неверного Windows internet-status."
  - "Перед временной правкой NCSI надо сделать backup, применить изменение, перезапустить минимальный набор служб и оставить rollback."
  - "Нужно отделить реальные Windows-сетевые симптомы от ложных ошибок, появившихся только внутри Codex/sandbox окружения."
do_not_use_for:
  - "Полностью мертвая сеть, когда не работает ни браузер, ни HTTP probe, ни базовая связность со шлюзом/DNS."
  - "Обход блокировок, настройка VPN-провайдера, смена DNS-политики организации или ремонт firewall/TCP-IP stack."
  - "Починка Microsoft Store, winget или CLI, если Windows уже показывает IPv4Connectivity = Internet."
  - "Удаление VPN/TAP/WireGuard драйверов, изменение системного proxy или правка hosts без отдельного доказательства и rollback."
natural_triggers:
  - "Windows не видит интернет"
  - "значок сети показывает нет интернета, но сайты открываются"
  - "Store или winget думает offline"
  - "dns.msftncsi.com возвращает 198.18"
  - "почини NCSI"
  - "ActiveDnsProbeContent"
  - "IPv4Connectivity не Internet"
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
last_reviewed: "2026-07-07"
source_asset: "Сформирован из рабочей диагностики Windows 10, где система показывала неверный internet-status из-за NCSI/DNS fake-IP, а дополнительный шум создавали sandbox proxy env vars. Приватные пути, аккаунты и raw логи в skill не переносились."
