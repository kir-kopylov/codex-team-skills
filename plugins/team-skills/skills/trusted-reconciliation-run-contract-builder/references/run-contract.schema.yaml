invariants:
  - "Статус зрелости подтверждается зависимыми гейтами, а не одним enum."
  - "YAML с повторяющимися ключами отклоняется до проверки контракта."
  - "Все нетерминальные состояния имеют путь к CLOSED или SUPERSEDED."
  - "ИИ использует закрытый allowlist предложений и не принимает решения."
  - "Покрытие и экономика используют типизированные числа и ссылки на доказательства."
  - "PRESENT stable_source_id называет поле из key_fields; ABSENT запрещает автоматическую идентификацию."
  - "Время наблюдения имеет формат ISO date или ISO timestamp."
  - "Каждая unresolved-запись блокирует хотя бы один следующий уровень зрелости."
  - "Пилот на реальных данных блокируется неизвестным data governance."
  - "VALID подтверждает только форму и внутреннюю согласованность."
