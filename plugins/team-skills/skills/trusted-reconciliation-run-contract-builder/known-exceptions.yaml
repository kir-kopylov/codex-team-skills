exceptions:
  - symptom: "Список файлов назван полным, но условные источники и доказательство нулевой активности не определены."
    root_cause: "Желаемая полнота подменена закрытым периметром источников."
    do_next_time: "Добавить паспорт каждого условного источника, условие появления, владельца и наблюдаемое свидетельство отсутствия операций."
    source_example: "examples/anti-01.md"
  - symptom: "Банковская строка, бронирование, сутки проживания, распределение и отчётная строка получили один идентификатор."
    root_cause: "Разные зёрна и связи многие-ко-многим схлопнуты в плоский реестр."
    do_next_time: "Развести исходные события, нормализованные записи, бизнес-объекты, распределения и решения; связать их отдельными ключами."
    source_example: "examples/good-01.md"
  - symptom: "ИИ сам подтвердил сопоставление на основании высокой уверенности и закрыл исключение."
    root_cause: "Самооценка модели подменяет детерминированную проверку и полномочие человека."
    do_next_time: "Вернуть режим PROPOSE_ONLY, сохранить наблюдаемое основание и кандидатов, а решение направить уполномоченному владельцу."
    source_example: "examples/anti-02.md"
  - symptom: "Повторный запуск переписал прежний итог, поэтому изменение нельзя объяснить."
    root_cause: "Не задан неизменяемый снимок входов, новый run_id и ссылка замещения."
    do_next_time: "Создать новый запуск из нового манифеста, сохранить прежний результат и связать версии через supersedes_run_id."
    source_example: "examples/good-02.md"
  - symptom: "Метрика показывает сто процентов покрытия, потому что все неизвестные суммы зарегистрированы как исключения."
    root_cause: "Истинное покрытие смешано с долей регистрации исключений или знаменатель оставлен неизвестным."
    do_next_time: "Разделить две метрики, запретить исключения в числителе истинного покрытия и не публиковать процент без известного знаменателя."
    source_example: "examples/good-03.md"
  - symptom: "Зелёный результат валидатора выдан за доказательство готовности к промышленной эксплуатации."
    root_cause: "Структурная проверка YAML подменяет пилот на реальных периодах и проверку бизнес-истины."
    do_next_time: "Оставить production_readiness_claim=false и провести отдельный пилот с ручной базой, ошибками, затратами и критериями приёмки."
    source_example: "examples/anti-01.md"
