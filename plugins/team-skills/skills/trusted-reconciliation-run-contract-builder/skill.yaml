source_asset: "Санитизированная методика проектирования проверяемого пакетного цикла сверки из диалога об управленческом учёте; частные данные и реальные реквизиты не переносились."
status: "experimental"
summary: "Проектирует проверяемый контракт пакетной сверки с паспортами источников, жизненным циклом запуска, границами ИИ, происхождением цифр, пилотом и экономикой."
use_cases:
  - "Превратить описание еженедельной сверки выписок, CRM и ручных реестров в исполнимый проект контроля."
  - "Задать идентичность источников, операций и запусков, очередь исключений и трассировку каждой итоговой цифры."
  - "Развести детерминированные проверки, предложения ИИ и решения уполномоченного человека."
  - "Спроектировать повторный запуск, поздние данные, переоткрытие, наблюдаемость, метрики, пилот и экономическую проверку."
do_not_use_for:
  - "Фактическая загрузка и проведение операций, расчёт управленческой отчётности, платежи или взаимозачёты."
  - "Подтверждение бизнес-истины, бухгалтерской корректности или полноты реальных данных по одной структурной проверке."
  - "Заявление о готовности к промышленной эксплуатации без пилота на реальных периодах и наблюдаемых результатов."
  - "Проектирование произвольной ИИ-системы, не связанной с повторяемой сверкой и доказуемым происхождением цифр."
natural_triggers:
  - "спроектируй рабочий еженедельный цикл сверки"
  - "нужна архитектура где цифра разворачивается до документа"
  - "опиши идентичность операций и повторный запуск"
  - "разведи правила ИИ и ручные решения"
  - "собери контракт очереди исключений и пилота"
