exceptions:
  - symptom: "Скил посчитал смету по ценам Алматы, хотя объект в другом городе."
    root_cause: "Локация не была зафиксирована до расчёта, цены взяты из примера/памяти."
    do_next_time: "Сначала спросить город/регион и страну, зафиксировать текущую дату, затем искать живые цены под эту локацию; цифры из примеров не переносить."
    source_example: "examples/good-02.md, examples/anti-02.md"
    status: "author-hypothesis-not-observed"
  - symptom: "Вывод «суммы хватит/не хватит» дан без объёма и замеров."
    root_cause: "Скил прыгнул к выводу до попозиционного расчёта."
    do_next_time: "Сначала собрать объём интервью и замерами, посчитать попозиционно, и только потом сравнивать с суммой."
    source_example: "examples/anti-01.md"
    status: "author-hypothesis-not-observed"
  - symptom: "Формулы в книге дают #VALUE на незаполненных ячейках."
    root_cause: "Ссылки на ячейки ввода не обёрнуты в N(), плейсхолдер-текст ломает арифметику."
    do_next_time: "Оборачивать ссылки на ввод в N(); проверять книгу на ошибки формул до выдачи."
    source_example: "examples/good-03.md"
    status: "author-hypothesis-not-observed"
  - symptom: "Цена в смете названа без живого источника и без 2-3 ссылок-подтверждений (общий класс сбоя, не только Алматы)."
    root_cause: "Цена взята из памяти, прошлого диалога или одного непроверенного источника; происхождение цифры не зафиксировано."
    do_next_time: "Для каждой ценовой строки давать живой источник и 2-3 независимые ссылки под город и текущий год; если подтверждения нет — помечать цену как ориентир-гипотезу, а не как живую расценку."
    source_example: "examples/anti-02.md"
    status: "author-hypothesis-not-observed"
  - symptom: "Количества в смете не сходятся с замерами: ручной перенос рассинхронизирован."
    root_cause: "Числа из замерных листов перенесены в смету вручную и разошлись с источником после правок; смета и замеры считаются по разным данным."
    do_next_time: "Тянуть количества в смету ссылками на ячейки замеров, не дублировать цифры руками; перед выдачей сверять итоги сметы с замерными листами и фиксировать расхождения."
    source_example: "examples/good-03.md"
    status: "author-hypothesis-not-observed"
  - symptom: "После переноса .xlsx в Google Таблицы поплыло условное форматирование/валидация или статус «Тестов» не подсвечивается."
    root_cause: "Авто-конверсия .xlsx→Google Sheets лоссовая; часть CF/валидации деградирует."
    do_next_time: "Статус читать по числовой колонке «Уровень» (она переносится надёжно), а не по цвету; пройти чек-лист A2 из файла-инструкции; что именно поплыло — занести сюда как наблюдённый случай."
    source_example: "scripts/build_smeta_xlsx.py (--format gsheet), референс «Форматы вывода»"
    status: "author-hypothesis-not-observed"
  - symptom: "Соредактор в общей Google Таблице затёр формулу (Сумма/ИТОГО/нетто)."
    root_cause: "Не были выставлены защищённые диапазоны при раздаче доступов команде."
    do_next_time: "Перед шарингом закрыть формульные ячейки, «Справочники» и параметры «Сводки» защищёнными диапазонами; роли раздавать по матрице (мастер — обычно Комментатор)."
    source_example: "scripts/build_smeta_xlsx.py (gsheet_bridge_md, матрица ролей)"
    status: "author-hypothesis-not-observed"
