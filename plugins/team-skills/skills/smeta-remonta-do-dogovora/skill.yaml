owner: "@kir-kopylov"
author_github: "@kir-kopylov"
authors:
  - "Кирилл Копылов"
status: "draft"
summary: "Собирает смету на ремонт квартиры через интервью, замеры и тесты и выдаёт рабочую Excel-книгу со сметой-меню; цены берёт живые под город и год пользователя."
use_cases:
  - "Посчитать ремонт квартиры попозиционно и убрать конфликт «что входит в цену» между собственником и мастером."
  - "Сделать замерные листы и Excel-смету с разделами «делаем точно» и «может понадобиться», ведомостью материалов и тестами замеров."
  - "Проверить устную договорённость «за всё» реальной попозиционной стоимостью по актуальным местным ценам."
do_not_use_for:
  - "Гарантировать итоговую цену ремонта или заменить живые офферы и договор: смета по поиску — ориентир, не контракт."
  - "Переносить цены или ставки из примера на другой город или год без свежего поиска под локацию и текущую дату."
  - "Публиковать приватные данные объекта: адрес, тех.паспорт, кадастровый номер, имена, телефоны, абсолютные личные пути."
natural_triggers:
  - "составь смету на ремонт"
  - "посчитай ремонт квартиры"
  - "сделай замерный лист и смету в экселе"
  - "смета-меню чтобы не спорить о цене"
  - "что входит в сумму за ремонт"
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
last_reviewed: "2026-08-04"
source_asset: "Санитизированная методика подготовки ремонтной сметы по интервью, замерам и местным ценовым ориентирам; адреса, реквизиты и данные конкретных заказчиков или исполнителей не переносились."
