owner: "@kir-kopylov"
status: "team-ready"
summary: "Безопасно проверяет и удаляет локальные следы macOS-приложений после явного подтверждения."
use_cases:
  - "Проверить, какие локальные следы macOS-приложения остались после удаления из Applications."
  - "Почистить кэш и контейнеры приложения, не затрагивая пользовательские документы и загрузки."
  - "Объяснить, что можно безопасно удалить, а что требует отдельного подтверждения или ручных прав macOS."
do_not_use_for:
  - "Удаление аккаунтов, облачных чатов, подписок, лицензий или серверных данных приложения."
  - "Автоматическое удаление всего, что совпало по строке, без отчёта и явного подтверждения пользователя."
  - "Очистка Downloads, Documents, Desktop или рабочих проектов без отдельного явного разрешения."
natural_triggers:
  - "удали приложение с Mac"
  - "проверь следы Telegram"
  - "почисти кэш Zoom"
  - "что осталось от Slack на компьютере"
  - "безопасно удали локальные данные приложения"
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
last_reviewed: "2026-05-21"
