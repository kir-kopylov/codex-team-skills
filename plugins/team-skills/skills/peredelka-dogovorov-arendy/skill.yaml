owner: "@kir-kopylov"
author_github: "@kir-kopylov"
status: "team-ready"
summary: "Ведёт переоформление и forensic-аудит пакета договоров найма жилья: смена наймодателя, фиксация перерасхода бюджета улучшений, допсоглашения, единое оформление пакета."
use_cases:
  - "Подготовить расторжение и новый договор найма при смене наймодателя, сохранив сквозную хронологию документов."
  - "Провести forensic-аудит существующего договора найма по чеклисту и найти дыры в разделе о расторжении, бюджете улучшений или ответственности."
  - "Зафиксировать перерасход бюджета улучшений соглашением о сальдо и допсоглашением о его погашении новым наймодателем."
do_not_use_for:
  - "Разовое допсоглашение только по смене суммы или порядка оплаты без переоформления стороны - для этого dopsoglasheniya-po-oplate."
  - "Юридическое заключение или начало подготовки документов без явного плана и подтверждения пользователя."
  - "Публикацию реальных ФИО, ИИН, номеров документов, адресов объектов или сумм конкретных сделок без privacy-review."
natural_triggers:
  - "переоформи договор аренды на другого наймодателя"
  - "зафиксируй перерасход бюджета улучшений"
  - "проверь договор найма на дыры"
  - "сделай forensic-аудит договора"
  - "построй хронологию документов по объекту"
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
last_reviewed: "2026-08-04"
authors:
  - "Кирилл Копылов"
source_asset: "Санитизированная методика переоформления и перекрёстной проверки пакета договоров найма; реальные стороны, адреса, реквизиты, суммы и частные документы не переносились."
