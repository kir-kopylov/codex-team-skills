owner: "@kir-kopylov"
author_github: "@kir-kopylov"
authors:
  - "Кирилл Копылов"
source_asset: "Обезличенная методика разведения удалённого репозитория, marketplace, установленного plugin, личных перекрытий и списка навыков текущей сессии; сформирована по повторяющимся сбоям сопровождения Team Skills."
status: "experimental"
summary: "Read-only показывает состояние Team Skills на пяти слоях и первое доказанное расхождение, не изменяя среду."
use_cases:
  - "Понять, почему новый или обновлённый skill есть в GitHub, но не виден пользователю."
  - "Сравнить удалённый main, marketplace-источник, установленный plugin и список skills текущей сессии."
  - "Найти точные одноимённые личные копии и отделить возможное перекрытие от доказанного."
  - "Получить диагностическую карту перед изменяющим обновлением Team Skills."
do_not_use_for:
  - "Обновление marketplace, установка plugin, перенос или удаление дублей и перезапуск Codex; для этого нужен team-skills-maintenance."
  - "Вывод об активной версии только по cache, локальному checkout или памяти предыдущей сессии."
  - "Массовый обход произвольных домашних каталогов, публикация личных путей или чтение содержимого уникальных личных skills."
natural_triggers:
  - "какая версия библиотеки навыков реально активна"
  - "почему новый навык не виден"
  - "сравни GitHub, установленный plugin и текущую сессию"
  - "проверь, не перекрывает ли локальный skill командный"
  - "где застряло обновление Team Skills"
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
last_reviewed: "2026-08-05"
