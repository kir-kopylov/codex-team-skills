exceptions:
  - id: "cache-mistaken-for-current-session"
    symptom: "Наличие новой папки в cache выдано за доказательство, что текущая сессия уже использует новую версию."
    root_cause: "Установленный слой и загруженный при старте список skills были объединены."
    do_next_time: "Проверять текущую сессию только по данным самой сессии; при их отсутствии ставить UNKNOWN_SESSION_NOT_OBSERVED."
    source_example: "examples/anti-01.md"
  - id: "personal-name-match-called-proven-shadow"
    symptom: "Одноимённый личный каталог сразу назван причиной перекрытия plugin."
    root_cause: "Кандидат по имени был принят за наблюдаемый приоритет загрузки."
    do_next_time: "Ставить POTENTIAL_PERSONAL_SHADOW; OBSERVED_PERSONAL_SHADOW разрешён только при наблюдаемом источнике реально загруженного skill."
    source_example: "examples/good-02.md"
  - id: "local-checkout-called-remote-main"
    symptom: "Версия локального checkout названа актуальной версией GitHub main без чтения remote SHA."
    root_cause: "Локальное состояние было подменено удалённым."
    do_next_time: "Получить remote SHA и прочитать manifest именно из этого commit; при недоступной сети вернуть UNKNOWN_COMMAND_FAILED."
    source_example: "examples/anti-01.md"
  - id: "session-semver-inferred-from-visible-name"
    symptom: "По наличию имени skill в сессии приписана semver установленного plugin."
    root_cause: "Интерфейс показал имя, но не источник и версию, а пробел был заполнен догадкой."
    do_next_time: "Подтвердить только видимость имени, а semver сессии оставить UNKNOWN_NOT_EXPOSED."
    source_example: "examples/good-03.md"
  - id: "diagnostic-skill-mutates-environment"
    symptom: "Во время выяснения расхождения агент запускает upgrade, plugin add, карантин или restart."
    root_cause: "Read-only диагностика смешана с исправлением."
    do_next_time: "Завершить карту без изменений; мутацию выполнять только как новую задачу через team-skills-maintenance."
    source_example: "examples/anti-02.md"
