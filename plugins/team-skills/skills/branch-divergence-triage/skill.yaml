owner: "@kir-kopylov"
author_github: "@kir-kopylov"
authors:
  - "Кирилл Копылов"
source_asset: "Разовый разбор отставшей ветки в этом же репозитории: пофайловая классификация и вычитание множеств строк, выполненные вручную и затем перенесённые в скрипт."
status: "experimental"
summary: "Пофайлово доказывает, что в отставшей ветке своё, и выносит вердикт о стратегии переноса, ничего не меняя."
use_cases:
  - "Понять до выбора механизма, какие файлы отставшей ветки уже есть в базе дословно, а какие несут работу."
  - "Решить, спасать ветку или закрывать, когда часть её работы уже влита другим Pull Request."
  - "Задать состав чистой пересборки: какие именно пути переносить на свежую базу."
do_not_use_for:
  - "Сам перенос, создание ветки, Pull Request и уборку веток: это git-pr-lifecycle-safeguard."
  - "Разрешение конфликта внутри одного файла и ручное слияние текста."
  - "Отладку логов непрерывной интеграции."
  - "Ветку, которая не отстаёт от базы: разбирать нечего."
natural_triggers:
  - "ветка отстала от main"
  - "можно ли тут просто сделать rebase"
  - "что в этой ветке моё, а что уже влито"
  - "как донести эту работу до main"
  - "стоит ли эту ветку вообще спасать"
example_files:
  - "examples/good-01.md"
  - "examples/anti-01.md"
last_reviewed: "2026-08-12"
