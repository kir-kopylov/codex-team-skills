owner: "@kir-kopylov"
author_github: "@kir-kopylov"
status: "team-ready"
summary: >-
  Разбирает длинный чат на реестр утверждений `registry.md`: одна строка на утверждение,
  статус первым символом (`+` принято, `x` отвергнуто, `?` открыто, `0` без реакции) и
  якорь цитатой из чата. Работает в два прохода с обязательной остановкой: статусы правит
  человек, машинный шлюз (`check_registry.py` плюс `sha256`) открывает фазу 2, и только
  тогда из выправленного реестра собираются четыре артефакта в папке разбора — дополнение
  к правилам, память проекта, передача смены и записи решений в формате MADR.
use_cases:
  - "Превратить длинный чат с исследованием и спорами в артефакты, не смешав отвергнутые ветки с принятыми и не выдав предложения агента за решения человека."
  - "Собрать реестр утверждений со статусами и якорями, чтобы человек выправил классификацию первыми символами строк, а не вычитывал пересказ."
  - "Собрать передачу смены и память проекта перед новой сессией, когда часть контекста сжата и дословного текста по ранним ходам уже нет."
  - "Оформить принятые в чате решения записями MADR со статусом `proposed`, где в «Рассмотренные варианты» идут только альтернативы, привязанные маркером `альт:NNN` к этому решению."
do_not_use_for:
  - "Решить, стоит ли внедрять обсуждавшийся в чате инструмент или подход — это гейт существования `overengineering-stop-gate`."
  - "Спроектировать контракт нового skill из чата — это `skill-methodologist`."
  - "Построчно объяснить предыдущий ответ ассистента — это `a-postrochniy-razbor`."
  - "Применять артефакты: править существующие правила и память проекта, сливать их с разбором, открывать PR — решение о применении принимает человек, skill пишет только в папку разбора."
natural_triggers:
  - "разбери этот чат"
  - "собери реестр утверждений"
  - "выжимка из чата, четыре артефакта"
  - "сделай ADR по этому чату"
  - "что из этого чата пойдёт в правила проекта"
example_files:
