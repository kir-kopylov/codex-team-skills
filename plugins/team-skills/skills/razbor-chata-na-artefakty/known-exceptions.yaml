exceptions:
  - symptom: >-
      Маркер `!сомнение` оказался внутри текста утверждения, а не в конце строки:
      проверка напечатала «незакрыто !сомнение: 0», и фаза 2 пошла по реестру,
      который человек не вычитывал.
    root_cause: >-
      Маркер распознавался только как хвостовой токен строки, а остановка между
      фазами держалась на том, что модель прочитала строку вывода, а не на коде
      возврата.
    do_next_time: >-
      Искать маркер в любом месте строки: засчитывать его в незакрытые и
      одновременно объявлять нарушением формата, а фазу 2 закрывать кодом
      возврата 3 — шлюз обязан держаться кодом, а не внимательным чтением.
    source_example: "examples/good-03-szhatyy-kontekst-shlyuz-zakryt.md"
  - symptom: >-
      Человек дописал строку в реестр markdown-рефлексом, через дефис
      («- 905 | ...»), и строка молча исчезла: не попала ни в счётчик
      утверждений, ни в список дописанного от 900, ни в нарушения — при этом
      правка считалась учтённой.
    root_cause: >-
      Дефис входил в фильтр служебных строк шапки, поэтому дописанная строка
      отбрасывалась вместе с ними и не оставляла следа в отчёте.
    do_next_time: >-
      Дефис в области утверждений — нарушение формата с прямым указанием
      заменить его на статус (`+ x ? 0`); ни одна строка этой области не должна
      исчезать из отчёта бесследно.
    source_example: "examples/good-01-reestr-i-chetyre-artefakta.md"
  - symptom: >-
      Проверка формата прошла, но гарантии не дала: скрипт проверил одни байты,
      модель прочитала другие — файл успели сохранить между двумя шагами.
    root_cause: >-
      Проверка формата и чтение реестра были независимыми событиями, без
      привязки вердикта к конкретному содержимому файла.
    do_next_time: >-
      Печатать `sha256` проверенных байтов и требовать совпадения с хешем файла,
      прочитанного в этом же ходу; расхождение — закрытый шлюз, а не мелкое
      несоответствие, которое можно прокомментировать и пойти дальше.
    source_example: "examples/anti-01-sobrat-vsyo-srazu.md"
  - symptom: >-
      Реестр собран из сжатой сводки беседы: якорь реконструирован по пересказу
      и внешне не отличался от цитаты — правило «строка без якоря не входит»
      выполнено формально и нарушено фактически.
    root_cause: >-
      Инструкция «перечитать чат целиком» в длинной сессии невыполнима: ранние
      ходы сжаты, дословного текста больше нет, а якорь по пересказу и якорь по
      цитате визуально неразличимы.
    do_next_time: >-
      Начинать фазу 1 карточкой доступности чата (что доступно дословно, что
      сжато), спорные строки помечать `!контекст-сжат` и не выдавать за
      привязанные; маркер снимает человек по своей прокрутке либо строка уходит
      в раздел «Без якоря».
    source_example: "examples/good-03-szhatyy-kontekst-shlyuz-zakryt.md"
  - symptom: >-
      В «Рассмотренные варианты» каждого ADR попала одна и та же свалка всех
      строк `x`, и раздел обесценился: по нему нельзя понять, какие альтернативы
      взвешивались именно для этого решения.
    root_cause: >-
      Статус `x` означает «отвергнуто вообще», а варианты ADR — альтернативы
      конкретного решения; связи между отвергнутой строкой и решением в формате
      реестра не было.
    do_next_time: >-
      В варианты ADR брать только строки `x` с маркером `альт:` на номер этого
      решения; непривязанные `x` оставлять в памяти и передаче смены как
      антицели; привязанных нет — писать это прямо, а не добивать раздел.
    source_example: "examples/good-02-ideyu-razobrali-pustye-artefakty.md"
  - symptom: >-
      Проверку запускали относительным путём `scripts/check_registry.py`, и она
      падала с «файл не найден» — шаг выглядел как поломка самого скрипта.
    root_cause: >-
      Путь к bundled script записан относительно папки skill, а рабочий каталог
      сессии — проект человека, который лежит в другом месте.
    do_next_time: >-
      Вызывать проверку как `python3 <skill-dir>/scripts/check_registry.py
      <путь к registry.md>`, где `<skill-dir>` — папка этого skill; относительный
      путь `scripts/...` не подставлять.
    source_example: "examples/anti-02-vpisat-v-pravila-proekta.md"
