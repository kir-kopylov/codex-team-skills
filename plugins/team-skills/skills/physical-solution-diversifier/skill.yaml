owner: "@kir-kopylov"
status: "experimental"
summary: "Создаёт веер из 5–7 физически разных решений одной задачи и отсекает косметические дубли по материалу, технологии, поведению и механизму."
use_cases:
  - "Развести одну информационную или поведенческую задачу на физически разные предметные концепции до выбора конструкции."
  - "Получить минимум пять вариантов из разных классов материалов, технологий изготовления и с разным физическим поведением."
  - "Сравнить материальные концепции по общей матрице и выбрать 2–3 направления для прототипирования."
  - "Остановить преждевременное схождение к первому правдоподобному носителю или конструкции."
do_not_use_for:
  - "Чертёж, развёртка, печатный макет или изготовление уже выбранной конструкции."
  - "Цветовые, стилистические и композиционные варианты одного и того же физического объекта."
  - "Инженерный расчёт, сертификация, подтверждение безопасности, живых цен или наличия материалов."
  - "Случай, где пользователь прямо зафиксировал один способ изготовления и не просит исследовать альтернативы."
natural_triggers:
  - "предложи разные физические конструкции"
  - "дай веер материальных решений"
  - "придумай минимум пять вариантов из разных материалов"
  - "разведи решения по технологиям"
  - "не зацикливайся на одном носителе"
  - "подбери разные физические способы донести эту информацию"
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
last_reviewed: "2026-07-16"
source_asset: "Сформирован из санированного диалога о настольной памятке: после преждевременного выбора бумажного тотема задача была поднята до общего требования выдавать веер решений по разным материалам, технологиям и физическим свойствам. Исходные локальные файлы и изображения не перенесены."
