exceptions:
  - symptom: "Веер содержит слабые или экзотические конструкции только ради уникальности каждой оси."
    root_cause: "Разнообразие стало целевой функцией раньше feasibility и outcome fit."
    do_next_time: "Сначала удалить нарушения hard constraints и слабые по outcome fit направления, затем применять coverage targets; разрешить объяснённые повторы категорий."
    source_example: "examples/good-01.md"
  - symptom: "Формально разные названия скрывают один материал, механизм или способ взаимодействия."
    root_cause: "Строковая уникальность была принята за смысловую проверку."
    do_next_time: "Использовать контролируемые category IDs, затем обязательно заполнить semantic_review по материалу, технологии, поведению, взаимодействию, механизму и shortlist."
    source_example: "references/diversity-gate.md"
  - symptom: "Валидатор принимает больше семи концепций, неправильные типы или неполный shortlist."
    root_cause: "Проверялась только непустота значений и нижняя граница количества."
    do_next_time: "Проверить диапазон 5–7, тип каждого поля, enum-категории, constraint/criteria coverage и структуру shortlist."
    source_example: "tests/test_physical_solution_diversifier.py"
  - symptom: "Shortlist выглядит убедительно, но выбранный вариант доминируется другим или основан на оценках без evidence."
    root_cause: "Сравнительная таблица не имела convergence gate, confidence и Pareto-проверки."
    do_next_time: "Заполнить критерии, веса, score, confidence и evidence; убрать доминируемые варианты и дать следующий тест каждому финалисту."
    source_example: "references/diversity-gate.md"
  - symptom: "Агент предлагает ослабить требование безопасности, совместимости или нормативное ограничение ради пяти вариантов."
    root_cause: "Hard constraints были смешаны с пользовательскими предпочтениями."
    do_next_time: "Никогда не ослаблять hard constraints; неизвестное соответствие помечать unknown, исключать из shortlist и направлять на отдельную проверку."
    source_example: "examples/good-03.md"
