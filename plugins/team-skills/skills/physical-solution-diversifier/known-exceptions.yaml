exceptions:
  - symptom: "Веер выглядит большим, но варианты отличаются только цветом, формой, размером или близкими материалами при одном механизме."
    root_cause: "Генерация началась с готовой конструкции, а не с морфологического поля материала, технологии, физического поведения и взаимодействия."
    do_next_time: "Удалить косметические дубли, заново построить морфологическое поле и допускать вариант только при новом классе материала, новой технологии, новом физическом поведении и новом механизме."
    source_example: "examples/anti-01.md"
  - symptom: "Концепт-карточки содержат точные цены, наличие, обещания прочности или безопасности без текущих доказательств."
    root_cause: "Исследование пространства решений было смешано с закупкой, инженерной проверкой или live-state верификацией."
    do_next_time: "Оставить только широкий класс стоимости и пометки предположений; живые цены, наличие и безопасность вынести в отдельную проверку после выбора концепции."
    source_example: "examples/anti-02.md"
  - symptom: "Из-за жёстких ограничений невозможно получить пять разных классов материалов, но список дополнен фиктивными вариантами."
    root_cause: "Требование количества ошибочно поставлено выше реальных ограничений среды и безопасности."
    do_next_time: "Остановиться, назвать конфликт и предложить ослабить ровно одно ограничение или разрешить меньшее число честно разных концепций."
    source_example: "examples/good-03.md"
