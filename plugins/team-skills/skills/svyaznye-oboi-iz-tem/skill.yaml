owner: "@kir-kopylov"
status: "experimental"
summary: "Связывает темы в сцену, встраивает календарные надписи в её материал и по запросу создаёт разные художественные варианты."
use_cases:
  - "Обои из нескольких праздников или тем с общим действием."
  - "Переделка несвязного набора предметов в одну сцену."
  - "Добавление даты и подтверждённых отсылок к принятому сюжету."
  - "Календарные обои, из которых читаются дата, названия праздников и запрошенное приветствие."
  - "Несколько разных художественных направлений с одинаковыми обязательными надписями."
do_not_use_for:
  - "Коллаж с намеренно независимыми блоками или уже жёстко заданная композиция."
  - "Фотобомбинг, примерка мебели, отдельный предмет без связи тем."
  - "Установка обоев, управление удалённым компьютером или автоматический календарь."
natural_triggers:
  - "Сделай обои из этих тем."
  - "Свяжи праздники одним сюжетом для обоев."
  - "Переделай обои: предметы должны взаимодействовать."
  - "Предложи несколько совершенно разных вариантов обоев к этим праздникам."
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
  - "examples/good-04.md"
  - "examples/good-05.md"
  - "examples/anti-03.md"
last_reviewed: "2026-11-09"
