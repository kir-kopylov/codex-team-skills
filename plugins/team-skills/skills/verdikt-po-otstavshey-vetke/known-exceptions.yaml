exceptions:
  - symptom: "Разбор показал, что ветка добавляет свои строки, хотя на деле база содержит их все в расширенном виде."
    root_cause: "Расхождение считали от вершины базы, а не от точки слияния: между базой ветки и вершиной прошли чужие коммиты, и их содержимое попало в сравнение."
    do_next_time: "Считать добавленные веткой строки от точки слияния и вычитать из них множество строк базы; вершина базы для этого не годится."
    source_example: "examples/good-01.md"
  - symptom: "Проверка «работа влита» по родству коммита отвечает «нет», хотя содержимое в базе есть."
    root_cause: "Pull Request влит squash-слиянием, поэтому в базе лежит другой коммит с другим хэшем, и проверка достижимости даёт ложный отрицательный ответ."
    do_next_time: "Доказывать попадание работы содержимым файлов в базе; родство коммита использовать только как дополнительный признак."
    source_example: "examples/good-01.md"
  - symptom: "Ветка, которая только удаляла строки или меняла права на файл, получила вердикт «переносить нечего»."
    root_cause: "Сравнение смотрело лишь на добавленные строки: при удалении список добавленного пуст, а при смене прав совпадает содержимое, и файл ошибочно признавался дублем базы."
    do_next_time: "Учитывать удаления наравне с добавлениями, сравнивать строки с кратностью и проверять режим записи дерева, а не только содержимое."
    source_example: "examples/anti-01.md"
  - symptom: "Слияние отставшей ветки прошло почти без конфликтов, и это приняли за признак безопасности."
    root_cause: "Одинаковые файлы система слияния схлопывает молча, а конфликты оставляет там, где сторона ветки устарела; ответ «оставить нашу версию» откатывает уже принятую чужую работу."
    do_next_time: "Отсутствие конфликтов признаком безопасности не считать: сначала получить пофайловую классификацию, потом выбирать механизм переноса."
    source_example: "examples/anti-01.md"
