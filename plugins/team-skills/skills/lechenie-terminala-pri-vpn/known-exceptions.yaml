exceptions:
  - symptom: "gh и curl падают по TLS handshake timeout, браузер ходит в интернет; в окружении терминала стоят HTTP_PROXY/HTTPS_PROXY на 127.0.0.1 с мёртвым портом."
    root_cause: "Переменные прокси залипли от прокси-режима VPN-приложения, а система уже переведена в туннельный режим: терминал упирается в мёртвый локальный прокси, хотя туннель работает."
    do_next_time: "Безусловная проба в обход (curl --noproxy), при 200 — обход env -u для рабочей команды и предложение постоянного лечения: выключить системный прокси в VPN-приложении или вычистить переменные из профиля."
    source_example: "examples/good-01-stale-proxy-vars.md"
  - symptom: "git по ssh-remote (git@host:...) не пушится; вычистили HTTP_PROXY/HTTPS_PROXY и git config http.proxy — не помогло."
    root_cause: "Для ssh-remote прокси-механика git/libcurl не действует вообще: git запускает ssh, а ssh не знает про HTTP-прокси. Часто в цензурируемой сети мёртв сам порт 22."
    do_next_time: "Шаг 2 дерева: git remote -v. Для ssh — не лечить прокси-деревом; перевести remote на https или настроить ssh (ProxyCommand/ProxyJump, порт 443) с согласия человека."
    source_example: "examples/anti-01-toggle-blindly.md"
  - symptom: "Маяки шага 1 (google.com и github.com) дали 000 без VPN, ассистент решил «сеть мертва» и ушёл чинить сеть."
    root_cause: "Оба маяка из блокируемого в РФ класса: 000 при живой сети означал блокировку, а не отказ сети."
    do_next_time: "Брать пару маяков разных классов: внутристрановой доступный (ya.ru) + внешний целевой. 200 на внутристрановом и 000 на внешнем = блокировка (причина включить VPN), а не поломка сети."
    source_example: "examples/good-01-stale-proxy-vars.md"
  - symptom: "Продиктовали человеку в PowerShell curl -s -m 10 и env -u — посыпались ошибки разбора параметров, команды не выполнились."
    root_cause: "В PowerShell curl — псевдоним Invoke-WebRequest (падает на -m как неоднозначном флаге ещё до сети), а команды env там нет вообще."
    do_next_time: "Определить оболочку исполнителя; в PowerShell писать curl.exe и Remove-Item Env:... (или cmd /c \"set VAR=&& ...\"); env -u — только в Git Bash. См. раздел «Команды по оболочкам»."
    source_example: "examples/anti-01-toggle-blindly.md"
  - symptom: "Переменные прокси вычищены (env -u), а git всё равно идёт через мёртвый прокси и падает."
    root_cause: "Задан git config http.proxy, который замещает переменные окружения (libcurl берёт явную настройку конфига раньше окружения)."
    do_next_time: "Развязка А: если улика в конфиге — универсальный обход git -c http.proxy= -c https.proxy= push (пустое значение перебивает и конфиг, и переменные). Для http-адресов помнить, что curl читает только строчную http_proxy."
    source_example: "examples/good-01-stale-proxy-vars.md"
  - symptom: "nslookup вернул реальные адреса, ассистент заключил «туннеля нет» и погнал человека переключать VPN, хотя обход одной командой уже чинил."
    root_cause: "Туннель без подмены DNS (redir-host в mihomo по умолчанию; выключенный FakeIP в sing-box/Xray/v2rayN/Happ; классические WireGuard/OpenVPN) возвращает реальные адреса — отсутствие 198.18.x.x туннель не опровергает."
    do_next_time: "198.18.x.x использовать только как положительный признак; исход решать безусловной пробой в обход (шаг 4), а не по DNS-картине."
    source_example: "examples/anti-01-toggle-blindly.md"
  - symptom: "Человек включил туннельный режим, а терминал сразу не ожил; пробы через локальный прокси-порт по-прежнему 000."
    root_cause: "Переменные окружения перехватывают трафик терминала раньше туннеля: пока они стоят, состояние туннеля из терминала не видно."
    do_next_time: "Сначала убрать переменные из пробы (--noproxy / env -u), только потом судить, жив ли туннель."
    source_example: "examples/good-01-stale-proxy-vars.md"
  - symptom: "VPN-приложение показывает пинг 2ms и статус «подключён», при этом туннель не передаёт трафик."
    root_cause: "Внутренний пинг приложения меряет не то (и честно предупреждает, что при туннельном режиме TCP/ICMP-пинг недоступен)."
    do_next_time: "Показометрам приложения не верить; статус туннеля устанавливать только контрольной пробой curl из терминала."
    source_example: "examples/anti-01-toggle-blindly.md"
