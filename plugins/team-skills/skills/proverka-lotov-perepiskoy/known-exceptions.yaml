exceptions:
  - symptom: "Шаблон чуть не ушёл в чат, где пользователь уже договорился с продавцом о цене."
    root_cause: "Агент считал чат новым, не прочитав историю перед отправкой."
    do_next_time: "Всегда открывать чат и читать историю ДО ввода текста; чат с перепиской пользователя не трогать, содержательные ответы продавца в нём засчитывать как чек-2."
    source_example: "examples/good-02.md"
  - symptom: "«Получен ответ» оказался автоответчиком («Здравствуйте! Отвечу позже»), лот едва не засчитан."
    root_cause: "Правило зачёта было сформулировано как «пришло любое сообщение»."
    do_next_time: "Засчитывать только содержательный ответ по существу вопроса; автоответы не сбрасывают таймер; в журнале помечать провенанс человек/автоответчик/нет."
    source_example: "examples/anti-01.md"
  - symptom: "Лот «16GB DDR4 2400» за треть медианы оказался серверной планкой с наклейкой SERVER ONLY / REG-ECC."
    root_cause: "Заголовок объявления не отличает обычную планку от серверной и ноутбучной; дешёвая цена — приманка."
    do_next_time: "Спецификацию подтверждать только прямым признаком (зум партномера на фото или характеристики карточки); цену ниже 60% медианы отбраковывать до диалога."
    source_example: "examples/good-01.md"
  - symptom: "Подсказчик элементов страницы дважды указал не на ту кнопку; слепой клик открыл рекламный сайт."
    root_cause: "Безымянные кнопки в дереве страницы; семантический поиск элементов путает похожие карточки."
    do_next_time: "Перед кликом по важной кнопке читать её содержимое точечно и кликать только подтверждённый элемент; клик по «Купить»-подобным кнопкам запрещён."
    source_example: "examples/anti-02.md"
  - symptom: "Скриншоты страниц не снимаются: сайт держит вкладку в вечной загрузке, снимок падает по таймауту."
    root_cause: "Инструмент снимка ждёт полной загрузки, а маркетплейсы держат живые соединения бесконечно."
    do_next_time: "Попробовать Esc (останавливает загрузку) и повторить снимок; если серия таймаутов повторяется — зафиксировать факт текстом страницы с датой-временем, отклонение честно указать в отчёте, пользователя позвать одной строкой."
    source_example: "examples/good-03.md"
