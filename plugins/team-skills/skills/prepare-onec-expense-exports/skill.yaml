summary: "Готовит выгрузки расходов из 1С:Бухгалтерия 3.0 для управленческого отчета по марже квартир."
use_cases:
  - "Подсказать, какой отчет 1С открыть для аренды, КУ, интернета, ремонтов и прочих расходов по квартирам."
  - "Проверить скриншот или Excel/CSV-выгрузку 1С и понять, хватает ли аналитики для поквартирного отчета."
  - "Нормализовать выгрузку 1С в длинную таблицу расходов, пригодную для соединения с выручкой."
  - "Разделить прямые расходы по квартирам и общие расходы, которые нужно распределять расчетным методом."
  - "Подготовить данные для директорского отчета: прибыль, маржа и проблемные квартиры."
do_not_use_for:
  - "Налоговые консультации, аудиторские заключения, юридические выводы и исправление регламентированного учета без бухгалтера."
  - "Точный поквартирный факт по расходам, если в 1С нет квартиры, договора, объекта, подразделения или другой базы отнесения."
  - "Подмену исходных данных догадками, когда нет скриншота, выгрузки, счета, периода или базы распределения."
  - "Публикацию реальных адресов, ФИО, телефонов, личных путей, raw-скриншотов или клиентских выгрузок в repo."
natural_triggers:
