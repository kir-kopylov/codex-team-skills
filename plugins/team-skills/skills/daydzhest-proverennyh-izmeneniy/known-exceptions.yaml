exceptions:
  - symptom: "Рядом с фактом стояла настоящая ссылка, но она не подтверждала сделанный вывод о причине или пользе."
    root_cause: "Наличие ссылки спутали с доказанностью соседнего смыслового утверждения."
    do_next_time: "Оставить в фактическом блоке только допущенный claim; причину и вывод вынести отдельно с меткой POSITION, INFERENCE или HYPOTHESIS."
    source_example: "examples/good-01-facts-before-advice.md"
  - symptom: "Одна ссылка на практику выглядела как способ попробовать три разных новых действия."
    root_cause: "Практика была привязана к новости целиком, а не к конкретному «Теперь можно»."
    do_next_time: "Для каждого самостоятельного действия хранить свою practice-запись или честный статус MISSING."
    source_example: "examples/good-03-practice-per-action.md"
  - symptom: "Ссылка «разобрать в чате» открыла пустой или другой чат, хотя письмо обещало переданный контекст."
    root_cause: "Название ссылки обещало поведение внешнего маршрута без проверки на целевом устройстве."
    do_next_time: "Без проверки называть ссылку нейтрально «Открыть чат»; обещать контекст только после подтверждения его передачи."
    source_example: "examples/anti-02-false-comparison.md"
