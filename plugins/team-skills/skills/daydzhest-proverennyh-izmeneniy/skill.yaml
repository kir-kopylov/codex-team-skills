owner: "@kir-kopylov"
author_github: "@kir-kopylov"
authors:
  - "Кирилл Копылов"
source_asset: "Санитизированный редакционный процесс утреннего журнала изменений: факты и источники рядом с новостью, затем отделённое практическое толкование."
status: "experimental"
summary: "Собирает короткий понятный дайджест только из уже проверенных изменений, не меняя их смысл."
use_cases:
  - "Собрать ежедневный или еженедельный дайджест из утверждённых изменений с источниками рядом с каждым фактом."
  - "Сократить длинный разбор без превращения гипотезы в факт и без потери условий доступа."
  - "Связать каждое «Теперь можно» с отдельной практикой или честно показать её отсутствие."
do_not_use_for:
  - "Проверка новизны возможности, поиск источников или изменение статуса доказательства."
  - "Отправка письма, создание Gmail-черновика или проверка фактической доставки."
  - "Утверждение «изменений нет» при неполном охвате источников."
natural_triggers:
  - "собери дайджест обновлений"
  - "сократи письмо без потери связей"
  - "что из новинок важно мне"
  - "сделай утренний журнал изменений"
  - "поставь источники рядом с новостями"
example_files:
  - "examples/good-01-facts-before-advice.md"
  - "examples/good-02-partial-coverage.md"
  - "examples/good-03-practice-per-action.md"
  - "examples/anti-01-unapproved-item.md"
  - "examples/anti-02-false-comparison.md"
last_reviewed: "2026-09-10"
