owner: "@kir-kopylov"
author_github: "@kir-kopylov"
authors:
  - "Кирилл Копылов"
source_asset: "Исходная методика проверки актуальности, добавленная автором в commit 1c4b66e и доработанная по обезличенной обратной связи."
status: "team-ready"
summary: "Разделяет поисковую находку, публичную страницу, путь заказа и ответ человека, сохраняя кандидатов с unknown без ложной актуальности."
use_cases:
  - "Поиск заданного числа товаров, услуг или исполнителей с отдельными уровнями доказательства для наличия, цены, характеристик, срока и контакта."
  - "Подбор кандидатов или слотов, где публичные сведения, путь действия и ответ человека нельзя смешивать в один статус."
  - "Сохранение полезных кандидатов с полями unknown отдельно от объектов, которые полностью проходят требования пользователя."
do_not_use_for:
  - "Чисто справочные вопросы без действия по конкретному объекту."
  - "Задачи, которые перехватывает более узкий скилл, например скрининг откликов конкретной вакансии."
  - "Многочасовая переписка с продавцами на поддерживаемом маркетплейсе, для которой есть отдельный навык проверки лотов."
  - "Творческие или гипотетические запросы, где живая актуальность не важна."
natural_triggers:
  - "проверь прямо сейчас"
  - "проверь перед покупкой"
  - "подтверди наличие и цену"
  - "проверь по моменту"
  - "верификация"
  - "подтверди в моменте"
  - "найди в наличии"
  - "найди подходящих с проверкой"
  - "найди 15 реальных предложений"
  - "перед покупкой проверь прямо сейчас предложения по уровням доказательств и сохрани unknown"
example_files:
