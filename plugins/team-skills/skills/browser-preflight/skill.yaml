owner: "@kir-kopylov"
status: "experimental"
summary: "Исполнитель шага вооружения для браузерных целей: инвентаризация доменов, сверка грантов по следу на странице расширения, обход сломанной кнопки «Always allow», проба тишины окон согласия и вердикт «цикл можно отпускать»."
use_cases:
  - "Вооружить разрешения браузера перед запуском автономной браузерной /goal-цели на сайтах."
  - "Проверить, какие домены реально в списке разрешённых сайтов расширения, а какие только «нажимались»."
  - "Провести человека через обход сломанной кнопки «Always allow» с обязательной сверкой следа."
  - "Подтвердить пробой на каждом домене, что окна согласия больше не всплывают, до старта цикла."
do_not_use_for:
  - "Выполнение самой целевой задачи, покупки, сообщения, вход в аккаунты, капча, платежи."
  - "Правка файлов базы расширения напрямую — скрипт только читает, а судья это страница расширения."
  - "Формирование /goal-контракта — это goal-contract-shaper; этот skill исполняет его шаг вооружения."
natural_triggers:
  - "вооружи браузер перед целью"
  - "проверь разрешения сайтов перед запуском"
  - "подготовь браузер к автономному циклу"
  - "проверь список разрешённых сайтов расширения"
  - "добейся тишины окон согласия"
  - "агент опять спрашивает разрешение на каждый клик"
example_files:
  - "examples/good-01-full-preflight.md"
  - "examples/anti-01-allow-once-loop.md"
last_reviewed: "2026-07-06"
source_asset: "Сформирован из рабочей сессии диагностики разрешений расширения Claude-in-Chrome (46 нажатий «Always allow» впустую, обход через консоль service worker, баг anthropics/claude-code#74715); приватные пути и данные аккаунтов в skill не переносились."
