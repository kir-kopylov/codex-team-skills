exceptions:
  - symptom: "Человек жмёт «Always allow», окно возвращается на каждое действие; список разрешённых сайтов расширения пуст."
    root_cause: "Кнопка «Always allow» в Claude-in-Chrome (наблюдалось на версии 1.0.79) пишет разовый грант вместо вечного; в базе записи duration=once, вечных нет. Баг anthropics/claude-code#74715."
    do_next_time: "Не советовать жать кнопку повторно. Сначала проба «кнопка починена?»; если нет — вести через обход (консоль service worker → снипет с доменами → сверка следа на странице). После обновления расширения проверять, не починена ли кнопка."
    source_example: "examples/anti-01-allow-once-loop.md"
  - symptom: "Страница расширения не показывает только что добавленные домены."
    root_cause: "Страница читает состояние при загрузке, а не в живую."
    do_next_time: "Обновить страницу перед сверкой; след смотреть после обновления."
    source_example: "examples/good-01-full-preflight.md"
  - symptom: "Браузер отказывается вставлять снипет в консоль."
    root_cause: "Защита панели разработчика от вставки чужого кода при первой вставке."
    do_next_time: "Проговорить, зачем эта защита, и попросить человека набрать в той же строке фразу, которую требует браузер (обычно allow pasting), нажать Enter и вставить снипет снова."
    source_example: "examples/good-01-full-preflight.md"
  - symptom: "Переключение Ask before acting в боковой панели не убирает окна в сессии Claude Code."
    root_cause: "Это режим задач боковой панели; запросы от Claude Code берут режим из сообщения приложения, а не из настройки панели."
    do_next_time: "Не отправлять человека к этому переключателю; вооружать домены через список разрешённых сайтов расширения."
    source_example: "examples/anti-01-allow-once-loop.md"
  - symptom: "Домен виден в списке разрешённых, а окно согласия при пробе всё равно всплывает."
    root_cause: "Устаревшее состояние расширения: грант записан, но не применяется рантаймом."
    do_next_time: "Не гнать повторный обход (след уже есть). Перезапустить service worker расширения и повторить пробу; если окно устойчиво — BLOCKED с диагнозом «грант записан, но не применяется»."
    source_example: "examples/anti-01-allow-once-loop.md"
