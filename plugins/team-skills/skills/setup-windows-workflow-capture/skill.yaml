owner: "@kir-kopylov"
status: "experimental"
summary: "Настраивает и проверяет OBS для записи двух рабочих экранов, звука компьютера и микрофона на Windows."
use_cases:
  - "Подготовить Windows-компьютер сотрудника к локальной записи двух рабочих экранов в OBS Studio."
  - "Разделить общий звук, звук компьютера или телефонии и микрофон USB-гарнитуры по трём дорожкам."
  - "Проверить короткий MKV-файл до длительной записи и оценить требуемое свободное место."
do_not_use_for:
  - "Скрытое наблюдение, запись без информированного согласия или захват несогласованных личных данных."
  - "Анализ, расшифровка или описание уже записанного рабочего процесса."
  - "macOS, Linux, удалённая трансляция или конфигурация без двух рабочих экранов без отдельной адаптации."
natural_triggers:
  - "настрой запись двух экранов для анализа работы"
  - "подготовь OBS на компьютере сотрудника"
  - "проверь экраны и звук перед записью"
  - "сделай такой же сетап записи рабочего места"
  - "настрой 2 кадра в секунду и отдельные звуковые дорожки"
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
