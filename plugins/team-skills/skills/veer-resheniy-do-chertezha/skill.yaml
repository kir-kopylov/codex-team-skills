owner: "@kir-kopylov"
author_github: "@kir-kopylov"
status: "experimental"
summary: "Строит 5–7 пригодных физических концепций: сначала проверяет hard constraints, затем покрывает разные материалы и технологии и формирует evidence-based Pareto shortlist."
use_cases:
  - "Развести одну информационную или поведенческую задачу на широкий набор физически разных и feasible-концепций до выбора конструкции."
  - "Покрыть разные классы материалов, технологии изготовления, физические поведения и взаимодействия без diversity theater."
  - "Сравнить концепции по общим критериям, доказательствам и уверенности и выбрать 2–3 недоминируемых направления для прототипирования."
  - "Остановить преждевременное схождение к первому правдоподобному носителю или конструкции."
do_not_use_for:
  - "Чертёж, развёртка, печатный макет или изготовление уже выбранной конструкции."
  - "Цветовые, стилистические и композиционные варианты одного и того же физического объекта."
  - "Инженерный расчёт, сертификация, подтверждение безопасности, живых цен или наличия материалов."
  - "Случай, где пользователь прямо зафиксировал один способ изготовления и не просит исследовать альтернативы."
natural_triggers:
  - "предложи разные физические конструкции"
  - "дай веер материальных решений"
  - "придумай минимум пять вариантов из разных материалов"
  - "разведи решения по технологиям"
  - "не зацикливайся на одном носителе"
  - "подбери разные физические способы донести эту информацию"
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
last_reviewed: "2026-08-04"
authors:
  - "Кирилл Копылов"
source_asset: "Сформирован из санированного диалога о настольной памятке и усилен forensic-аудитом: diversity переведено из цели в coverage после feasibility, добавлены convergence, economics, safety и eval gates. Исходные локальные файлы и изображения не перенесены."
evaluation:
  status: "not-run"
  required_before_team_ready: true
  rubric: "references/eval-rubric.md"
  minimum_cases: 10
