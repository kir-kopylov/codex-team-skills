owner: "@kir-kopylov"
author_github: "@kir-kopylov"
authors:
  - "Кирилл Копылов"
source_asset: "Санитизированный рабочий процесс из разбора расходящихся ответов ChatGPT: восстановление эффективных входов, проверка причинных версий и ограничение вывода доступными доказательствами."
status: "experimental"
summary: "Проверяет, почему два якобы одинаковых запуска дали разные результаты, не подменяя доказательства мнением."
use_cases:
  - "Сравнить два ответа модели или агента, которые пользователь считает результатами одного запроса."
  - "Проверить версии о влиянии контекста, режима, модели, времени, источников или инструментов на расхождение."
  - "Отделить наблюдаемую разницу условий от недоступной реконструкции внутренних вызовов прошлого запуска."
do_not_use_for:
  - "Общий справочный вопрос о режимах или моделях без конкретных расходящихся запусков."
  - "Статистический A/B-тест большого числа запусков или оценка качества ответов."
  - "Будущий технический эксперимент для локализации сбоя; тогда использовать proverka-prichin-sboya."
natural_triggers:
  - "почему один и тот же запрос дал разные ответы"
  - "проверь гипотезы, а не высказывай мнение"
  - "сравни два запуска и покажи, что реально различалось"
  - "докажи, что разницу вызвал режим"
  - "это одна задача или разные эффективные входы"
example_files:
  - "examples/good-01-izmenilsya-zapros.md"
  - "examples/good-02-izmenilos-vremya.md"
  - "examples/good-03-raznye-instrumenty.md"
  - "examples/anti-01-spravka-o-rezhimah.md"
  - "examples/anti-02-net-istorii-zapuskov.md"
last_reviewed: "2026-10-18"
