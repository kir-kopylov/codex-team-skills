exceptions:
  - symptom: "В пользовательский ZIP автоматически попал LICENSE.txt или другой служебный файл, который не нужен для работы навыка."
    root_cause: "Исходный repo-пакет ошибочно приняли за готовый пользовательский артефакт и скопировали целиком без функционального отбора."
    do_next_time: "Собирать отдельную подготовленную копию по allowlist: SKILL.md и только реально необходимые файлы; не добавлять лицензию, README и registry-файлы автоматически."
    source_example: "examples/good-01.md"
  - symptom: "Локально проверенный ZIP назвали загруженным, принятым или включённым в Claude."
    root_cause: "Статическую проверку файлов смешали с внешним действием в аккаунте и runtime-проверкой после загрузки."
    do_next_time: "Всегда завершать отчёт строкой «Загрузка в Claude: не выполнялась» и не повышать STATIC_VALIDATED до доказанного импорта."
    source_example: "examples/anti-02.md"
