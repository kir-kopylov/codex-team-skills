exceptions:
  - symptom: "После широкого forensic-аудита простое исправление доставки небольшой библиотеки командных skills было раздуто до корпоративной платформы обновлений."
    root_cause: "Audit scope перепутали с remediation scope: буквальную цель, класс продукта и текущую delivery-модель не проверили и не использовали как жёсткую границу решения."
    do_next_time: "Сначала зафиксировать буквальную цель, подтвердить класс продукта и текущий эксплуатационный контур по доступному source of truth, разделить меры на три категории и включить в итог не более трёх обязательных направлений."
    source_example: "examples/good-04-proportional-team-skills-remediation.md"
  - symptom: "Загрузчик зависимостей не возвращает управление, и проверка исходных файлов не начинается."
    root_cause: "Предполагалось, что загрузчик отработает быстро; сколько ждать и чем заменить его при зависании, заранее решено не было."
    do_next_time: "Если загрузчик не вернулся в отведённое окно, прервать его один раз, назвать ограничение и продолжить уже доступным конвертером в режиме чтения, не изменяя исходные файлы."
    source_example: "examples/good-04-proportional-team-skills-remediation.md"
  - symptom: "Набор тестов не стартует: харнесс не может создать временный каталог сессии в изолированной среде."
    root_cause: "Предполагалось, что харнесс держит все временные файлы внутри доступной на запись области проекта."
    do_next_time: "Запускать такой набор тестов с разрешённым доступом к файловой системе либо заранее направить корень временных файлов в разрешённый каталог."
    source_example: "examples/good-04-proportional-team-skills-remediation.md"
  - symptom: "Часть первоисточников не открывается с внутренней ошибкой загрузки, и это принимается за опровержение проверяемого утверждения."
    root_cause: "Сбой получения страницы смешан с её содержанием, а отсутствие истории инструментов в чужом представлении принято за отсутствие прежней проверки."
    do_next_time: "Существенные выводы строить только на успешно открытых первоисточниках; неудачную загрузку фиксировать как недоступность, а не как ложность, и не выводить из представления без истории инструментов, что проверки не было."
    source_example: "examples/good-06-local-market-and-unavailable-sources.md"
  - symptom: "Разбор опирался на зарубежные примеры рынка, хотя задача относится к другому региону и его площадкам."
    root_cause: "Зарубежные премиальные образцы приняты за достаточную опору для местного протокола покупки."
    do_next_time: "До выбора признаков и вопросов продавцу проверить географию, реально доступные площадки, местный ассортимент, региональные спецификации моделей и стоимость доставки."
    source_example: "examples/good-06-local-market-and-unavailable-sources.md"
  - symptom: "Проверка вёрстки на узком экране шла при фактической ширине по умолчанию: заданный размер не применился к скрытой вкладке."
    root_cause: "Переопределение размера на уровне браузера принято за действующее для каждой вкладки."
    do_next_time: "До того как считать снимок доказательством пригодности, измерить фактический размер области в самой странице и задавать его средствами, действующими в пределах проверяемой вкладки."
    source_example: "examples/good-06-local-market-and-unavailable-sources.md"
