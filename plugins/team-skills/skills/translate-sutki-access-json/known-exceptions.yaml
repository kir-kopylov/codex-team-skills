exceptions:
  - symptom: "Chinese address uses translated proper names such as 阿拉木图 or 三月八日街 when user asked for transliteration."
    root_cause: "The rule mixed transliteration of the street/city name with target-language address style and allowed Chinese characters for proper names."
    do_next_time: "Transliterate city and street names with Latin letters, but translate the address type: Almaty, 8 Marta 街, Kosmonavtov 大道, Tramvayny 巷."
    source_example: "Sanitized regression from Sutki access JSON translation where Almaty and 8 Marta had to remain Latin in ch.address."
  - symptom: "Target blocks parse as JSON but contain literal machine-translation artifacts such as 'castle is open' or 'maid'."
    root_cause: "Existing en/kk/ch blocks were trusted because they parsed, instead of being rebuilt or semantically audited from ru."
    do_next_time: "Rebuild target-language blocks from ru or audit them against risky markers before saving; search for castle, maid, mojibake and Консьерж outside ru."
    source_example: "Sanitized regression from access-instruction JSON with old machine translations."
  - symptom: "JSON validation passes, but translated route instructions contradict ru: for example a separate entrance, main entrance, stairs or elevator condition is assigned to the wrong action."
    root_cause: "The check compared schema, placeholders and tokens but did not compare each route/action/condition semantically against the Russian source."
    do_next_time: "Run semantic equivalence audit before delivery: for every numbered step compare route, entrance, direction, elevator/stairs, key/code need, alternatives and action sequence in ru -> en/kk/ch."
    source_example: "Sanitized regression from an apartment access JSON where target-language step 2 changed the guest route despite valid JSON."
  - symptom: "Target translation preserves the words but changes line-break tokens: CRLF becomes LF, LF becomes CRLF, lone CR is removed, or paragraph/list boundaries are flattened."
    root_cause: "The workflow treated line breaks as cosmetic formatting or allowed a JSON writer/editor to normalize them instead of comparing token sequences per field."
    do_next_time: "Before saving, extract line-break tokens CRLF/LF/CR from every ru string and corresponding en/kk/ch strings; block delivery until count, order and token type match exactly."
    source_example: "Sanitized acceptance rule for Sutki access JSON where line breaks inside JSON string values must survive translation without normalization."
