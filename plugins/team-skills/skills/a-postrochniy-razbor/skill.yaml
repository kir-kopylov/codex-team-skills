owner: "@kir-kopylov"
author_github: "@kir-kopylov"
authors:
  - "Кирилл Копылов"
status: "team-ready"
summary: "Построчно объясняет предыдущий ответ ассистента простыми словами для не-технаря: каждая строка как есть и под ней объяснение «для домохозяйки»."
use_cases:
  - "Не-технарь получил технический ответ (команды, вывод терминала, шаги) и хочет понять каждую строку, а не общий смысл."
  - "Нужно показать построчно: сама строка как есть и под ней простое объяснение, что это и что за действие сделано."
  - "Для строк-команд нужно отдельно объяснить, зачем команда запущена и что получилось."
do_not_use_for:
  - "Просьба сократить, обобщить или сделать выжимку ответа — это противоположность построчному разбору."
  - "Перевод ответа на другой язык, литературная редактура или объяснение новой темы с нуля."
  - "Нет предыдущего ответа для разбора или объект разбора не определён."
natural_triggers:
  - "разбери построчно"
  - "объясни прошлый ответ простыми словами"
  - "построчный разбор"
  - "распиши, что значит каждая строка"
  - "объясни для домохозяйки, что ты сделал"
  - "переведи на человеческий язык твой предыдущий ответ"
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
last_reviewed: "2026-08-04"
source_asset: "Методика построчного разбора технического ответа с сохранением исходных строк, простыми объяснениями и отдельной проверкой смысла команд; частные данные в пакет не включены."
