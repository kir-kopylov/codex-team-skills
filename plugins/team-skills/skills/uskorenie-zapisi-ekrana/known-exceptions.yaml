exceptions:
  - symptom: "Куски выходят разной длины, картинка длиннее звука, и к концу собранного ролика звук убегает вперёд на несколько секунд."
    root_cause: "Запись экрана снята с переменной частотой кадров, а ограничение длины задано до входного файла: обрезка считает по капризам исходника, и разбег копится на каждом стыке склейки."
    do_next_time: "Перемотку задавать до входного файла, ограничение длины — после него, и обязательно обнулять отсчёт времени куска. Длину прибивать жёстко и резать обе дорожки одной меткой."
    source_example: "examples/good-01.md"
  - symptom: "Собралась не та сборка: часть ступеней плана пропала, при этом код возврата был нулевой."
    root_cause: "Кодировщик в цикле прочитал стандартный ввод и сожрал остаток таблицы ступеней, а нулевой код возврата пришёл от последней команды конвейера, а не от сборки."
    do_next_time: "Вызывать кодировщик с отключённым чтением стандартного ввода. Вердикт выносить по таблице сверки длин, а не по коду возврата."
    source_example: "examples/anti-02.md"
  - symptom: "Подсказка «как ужаться до лимита» промахнулась в полтора раза: предложенное качество дало почти прежний вес."
    root_cause: "К записи экрана применили учебное правило про кино, где шесть единиц качества режут поток вдвое. На почти статичной картинке вес держат не детали, а редкие изменения, и правило не работает."
    do_next_time: "Пользоваться замеренными коэффициентами из скрипта. Если промахнулись — перемерить пилотом и поправить константы, а не подгонять качество вслепую."
    source_example: "examples/good-03.md"
