owner: "@kir-kopylov"
author_github: "@kir-kopylov"
authors:
  - "Кирилл Копылов"
source_asset: "Личный навык автора и его рабочий скрипт сборки, собранные при обработке двух собственных записей экрана; перенесены в командную библиотеку без приватных путей и сырого контекста."
status: "experimental"
summary: "Ускоряет и сжимает запись экрана по ступенчатому плану скоростей, сохраняя высоту голоса и синхронность звука с картинкой."
use_cases:
  - "Сократить длинную запись экрана ступенчатым ускорением, не превращая голос в бурундучий."
  - "Уложить запись экрана в заявленный лимит веса и понять, чем именно её ужимать."
  - "Вырезать из записи экрана заданные куски и собрать итог без рассинхрона на стыках."
do_not_use_for:
  - "Видео с камерой, лицом, музыкой или монтажным ритмом: ускорение и подмораживание кадра там выглядят как брак."
  - "Настоящий монтаж с титрами, переходами и кадрированием по сюжету."
  - "Простое сжатие без изменения скорости: это одна команда, отдельный конвейер не нужен."
  - "Освобождение места на диске удалением файлов."
natural_triggers:
  - "ускорь запись экрана"
  - "сожми скринкаст"
  - "запись экрана слишком длинная"
  - "разгони видео по ступеням"
  - "вырежи куски из записи экрана"
  - "уложи запись в лимит по весу"
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
last_reviewed: "2026-08-10"
