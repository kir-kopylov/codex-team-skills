owner: "@kir-kopylov"
status: "team-ready"
summary: "Добавляет на фото слои комичного фотобомбинга, сохраняя исходных людей, объекты и фон."
use_cases:
  - "Добавить на фото playful-фотобомбинг, не меняя людей, животных, объекты, текст и фон."
  - "Усилить визуальную шутку по уровням: от почти незаметной до абсурдной."
  - "Перевести обычные просьбы вроде детский вайб, мемнее или ещё уровень в безопасный image-edit prompt."
do_not_use_for:
  - "Форензическая, юридически значимая или доказательная правка изображений."
  - "Обман личности, травля или правки, меняющие лица, выражения или позы реальных людей."
  - "Хоррор, gore, реалистичные травмы или последствия катастроф."
natural_triggers:
  - "сделай фотобомбинг"
  - "добавь людей/животных"
  - "усиль абсурд"
  - "сделай мемнее"
  - "ещё уровень"
  - "детский вайб"
  - "пенсионный вайб"
example_files:
  - "examples/good-01-friends-chat.md"
  - "examples/good-02-child-safe.md"
  - "examples/good-03-escalation.md"
  - "examples/anti-01-do-not-change-subjects.md"
  - "examples/anti-02-no-horror-disaster.md"
last_reviewed: "2026-05-11"
