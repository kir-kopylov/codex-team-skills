exceptions:
  - symptom: "Публичная кнопка «Подключить» открывает общий dashboard без выбранной услуги."
    root_cause: "Маркетинговая ссылка ведёт в кабинет, но не переносит контекст продукта или абонента."
    do_next_time: "Не засчитывать переход; проверить услугу на точном номере и искать прямое действие либо маршрут обращения внутри кабинета."
    source_example: "examples/good-03.md и test_known_megafon_exceptions_are_preserved"
  - symptom: "Поиск услуги на абоненте ничего не находит."
    root_cause: "Отсутствие услуги в каталоге не означает, что оператор не принимает заявку на её подключение."
    do_next_time: "После проверки текущего состояния перейти к обращению об отсутствующей услуге, сохранив точный номер и действие."
    source_example: "examples/good-03.md и test_known_megafon_exceptions_are_preserved"
  - symptom: "Кнопка отправки обращения неактивна при заполненных основных полях."
    root_cause: "Предзаполненный контакт не подходит для выбранного способа уведомления, например SMS."
    do_next_time: "Проверить требования поля уведомления; использовать подтверждённый мобильный контакт из приватного профиля или выбрать допустимый канал."
    source_example: "examples/good-03.md и test_known_megafon_exceptions_are_preserved"
  - symptom: "В одном разделе обращений дубль не найден."
    root_cause: "Кабинет разделяет обращения по нескольким вкладкам или источникам создания."
    do_next_time: "Перед новой заявкой проверить все релевантные очереди и сопоставить номер, услугу, действие и незавершённый статус."
    source_example: "examples/good-03.md и test_known_megafon_exceptions_are_preserved"
  - symptom: "После отправки или подключения страница подтверждения потеряна либо зависла."
    root_cause: "Неизвестно, завершилось ли внешнее действие; повторный клик может создать дубль."
    do_next_time: "Не повторять мутацию; сначала перечитать услугу, заказы и обращения и только затем решать, нужен ли новый submit."
    source_example: "examples/anti-02.md и test_skill_contract_blocks_blind_retry"
