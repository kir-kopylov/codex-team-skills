exceptions:
  - symptom: "Пользователь спрашивает, почему конкретная компания не попала, а прошлый список выглядит как случайный пропуск."
    root_cause: "Skill смешал строгий входной корпус с широким рынком и не вынес тематически подходящего кандидата вне корпуса."
    do_next_time: "Сначала объяснить фильтр корпуса, затем отдельно пометить кандидата как 'вне корпуса, проверить', если он тематически релевантен."
    source_example: "examples/good-03-excluded-company-challenge.md"
  - symptom: "Отзывы похожей компании или филиала учитываются как доказательство для оцениваемого подрядчика."
    root_cause: "Название бренда оказалось неуникальным, а search result не был проверен по домену, адресу, юрлицу или устойчивой связке контактов."
    do_next_time: "Не смешивать отзывы без точной привязки; ставить 'сомнительно' и не повышать балл, пока связь не подтверждена."
    source_example: "examples/good-02-review-adjusted-ranking.md"
  - symptom: "Search snippet или карточка платформы превращается в уверенное утверждение о цене, телефоне, выезде или работе сегодня."
    root_cause: "Skill принял индексные данные за live-state."
    do_next_time: "Использовать формулу 'видел в кэше [дата/источник] — нужно подтвердить в моменте через [канал]' для всех актуальных состояний."
    source_example: "examples/anti-01-live-state-overclaim.md"
  - symptom: "Общие положительные отзывы по массовым услугам повышают рейтинг как будто доказывают сложный специализированный кейс."
    root_cause: "Skill не отделил сервисную надёжность от доказательств похожей работы."
    do_next_time: "Разделять review signal: общий сервисный след, релевантный сложный кейс, собственный отзыв и красный флаг."
    source_example: "examples/good-02-review-adjusted-ranking.md"
