owner: "@kir-kopylov"
author_github: "@kir-kopylov"
authors:
  - "Кирилл Копылов"
source_asset: "Обезличенный рабочий диалог, в котором рефрейм через вину был заменён различением стыда, ощущения малости и доступности одного малого действия; частный контекст и сырой текст не перенесены."
status: "draft"
summary: "Помогает отделить переживание стыда и собственной малости от способности выполнить одно безопасное следующее действие."
use_cases:
  - "Вернуться к одному рабочему или бытовому действию, когда пользователь прямо называет стыд причиной избегания."
  - "Снизить порог запуска действия без требования сначала почувствовать себя уверенным, большим или исправленным."
  - "Перевести тотальный приговор себе в конкретный объект избегания и ограниченный следующий шаг."
  - "Исправить диалог, если пользователь уточнил, что переживает не вину, а стыд и недееспособность."
do_not_use_for:
  - "Постановка диагноза, оценка личности, поиск травмы или длительная психотерапевтическая работа."
  - "Обычная усталость, техническая блокировка или отсутствие информации, когда стыд пользователем не назван."
  - "Ситуация непосредственной угрозы безопасности, где первым действием должна быть живая помощь, а не продуктивность."
  - "Автоматическая отправка сообщений, принятие решений или другие внешние действия без полномочия пользователя."
  - "Публичное сохранение сырого личного диалога или приватных сведений."
natural_triggers:
  - "Примени shame-to-next-action: меня парализовало от стыда"
  - "Я избегаю сообщений, потому что мне стыдно"
  - "Чувствую себя маленьким и недееспособным, помоги сделать один шаг"
  - "Мне не нужно утешение, доведи меня до первого действия"
  - "Расколдуй меня и помоги сделать маленькое действие"
example_files:
