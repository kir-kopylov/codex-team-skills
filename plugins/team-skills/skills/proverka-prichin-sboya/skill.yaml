owner: "@kir-kopylov"
author_github: "@kir-kopylov"
status: "experimental"
summary: "Проверяет причины сбоя или фактическое правило неоднозначного поведения одним безопасным опытом."
use_cases:
  - "При первом неоднозначном сбое отделить пользовательский результат от промежуточных зелёных сигналов и выбрать один проверяемый опыт."
  - "При нейтральном воспроизводимом поведении различить правила выбора источника, среды, профиля или API-маршрута без догадки о внутренней реализации."
  - "Различить две причины сетевой, API-, CI-, интеграционной или desktop-проблемы по свежему локальному наблюдению."
  - "Остановить составную проверку, которая одновременно меняет несколько причинных факторов и не позволяет локализовать сбой."
  - "Передать повторяющуюся безрезультатную диагностику в stuck-troubleshooting-reframe после двух одинаковых циклов."
do_not_use_for:
  - "Точная failing assertion уже задаёт очевидный локальный fix, и конкурирующих причин нет."
  - "Нужен статистический продуктовый A/B-тест, организационный разбор или обычный code review."
  - "Проверка требует неразрешённого изменения production, VPN, firewall, DNS, credentials, аккаунта, звонка или платежа."
  - "Диагностика уже зациклилась на одном состоянии; тогда используйте stuck-troubleshooting-reframe."
natural_triggers:
  - "проверь причины сбоя"
  - "дай один безопасный опыт, который различит две причины"
  - "не гадай, а проверь"
  - "в одном месте работает, в другом нет"
  - "какой один тест отличит эти причины"
  - "по какому правилу это на самом деле работает"
  - "интерфейс показывает одно, а система возвращает другое"
  - "предложи минимальный эксперимент, различающий версии"
  - "не гадай о причине — установи фактическое поведение"
example_files:
  - "examples/good-01-sip-timeout.md"
  - "examples/good-02-ci-artifact-vs-runtime.md"
  - "examples/good-03-green-ui-vs-outcome.md"
  - "examples/good-04-neutral-source-selection.md"
  - "examples/anti-01-exact-assertion.md"
  - "examples/anti-02-compound-change.md"
  - "examples/anti-03-unsafe-or-nondiscriminating.md"
last_reviewed: "2026-09-03"
authors:
  - "Кирилл Копылов"
source_asset: "Сформирован из санированного механизма послойной SIP-диагностики и обобщён на технические системы; частные реквизиты, журналы и пути не перенесены."
