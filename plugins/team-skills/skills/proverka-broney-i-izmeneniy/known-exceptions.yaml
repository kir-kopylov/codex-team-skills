exceptions:
- symptom: Лишний вопрос о квартире задерживает ответ.
  root_cause: Адрес уточняли до самостоятельного поиска.
  do_next_time: Сначала получить актуальные совпадения; спрашивать только при неустранимой
    неоднозначности.
  source_example: examples/good-01.md
- symptom: Назван неверный автор продления.
  root_cause: Взято имя из карточки вместо автора события истории.
  do_next_time: Найти изменение выезда в ZAIVKA_HIS и связать USR с USR.ID; при отсутствии
    записи не угадывать.
  source_example: examples/good-02.md
- symptom: Ответ незаметно добавляет ещё сутки к уже продлённой брони.
  root_cause: Текущая дата прочитана без истории недавних изменений.
  do_next_time: При проверке продления получать историю единственного текущего проживания
    и явно назвать уже внесённый перенос.
  source_example: examples/good-03.md
