owner: '@kir-kopylov'
status: team-ready
summary: Проверяет свежие брони eHous, ближайший заезд и автора изменения дат без
  записи в базу.
use_cases:
- Проверить возможность продления проживания и ближайший заезд.
- Выяснить, кто изменил дату выезда и когда.
do_not_use_for:
- Оформление или отмена брони, изменение цены и оплата.
- Выручка, историческая доступность на площадках и общая карта системы.
natural_triggers:
- Можно продлить проживание в eHous на сутки?
- Когда следующий заезд в этой квартире?
- Кто изменил бронь и когда?
example_files:
- examples/good-01.md
- examples/good-02.md
- examples/good-03.md
- examples/anti-01.md
- examples/anti-02.md
last_reviewed: '2026-11-09'
source_asset: "Обезличенный перенос личного навыка ehous-booking-check, проверенного на рабочем подключении eHous."
