owner: "@kir-kopylov"
status: "team-ready"
summary: "Создаёт сопоставимую серию вариантов одного предмета в одном помещении, сохраняет реальные ракурсы и проверяет полный пакет N × M."
use_cases:
  - "Придумать и показать несколько вариантов мебели, текстиля, светильника или декора в неизменном помещении."
  - "Примерить заданные пользователем концепции или конкретные товары по фотографиям на нескольких реальных видах комнаты."
  - "Исправить один вариант во всех его изображениях, сохранив остальные варианты и уже проверенные ячейки."
do_not_use_for:
  - "Полное переоформление помещения, изменение планировки или одновременную замену нескольких независимых категорий предметов."
  - "Изображения разных помещений в одном заказе."
  - "Закупку, проверку актуальной цены и наличия или доказательство точной вместимости по фото."
natural_triggers:
  - "Покажи варианты дивана в этой комнате."
  - "Примерь эти светильники в комнате."
  - "Сравни ковры по два изображения каждого."
  - "Замени все стулья на три разных варианта."
  - "Измени только ножки в третьем варианте."
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
last_reviewed: "2026-09-13"
source_asset: "Согласованный пользователем контракт многовидовой примерки одного предмета в одном помещении; частные изображения, товарные карточки и пути не включены."
