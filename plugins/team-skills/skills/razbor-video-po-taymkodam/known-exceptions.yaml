exceptions:
  - symptom: "Ассистент сообщает, что посмотрел видео, хотя видел только превью, первый кадр или несколько миниатюр, а затем готовит документ как по полной записи."
    root_cause: "Превью было ошибочно принято за проверку всей визуальной последовательности, а наличие аудиопотока и его содержание не проверялись отдельно."
    do_next_time: "Сначала выполнить media preflight, распределить кадры по всей длительности, полностью проверить аудиодорожку и пройти двухдорожечный gate; до этого не утверждать, что запись просмотрена и прослушана."
    source_example: "examples/anti-01.md"
  - symptom: "Распознавание речи или декодирование падает при запуске случайного системного python.exe, после чего аудио молча пропускается."
    root_cause: "Использован неподходящий runtime или отсутствующий codec вместо доступного media tool либо bundled runtime; технический сбой был ошибочно превращен в содержательный вывод."
    do_next_time: "Проверить потоки и доступные runtime-инструменты, попробовать совместимый локальный декодер; если звук недоступен, честно назвать ограничение и не приписывать записи неподтвержденную речь."
    source_example: "examples/good-04.md"
  - symptom: "Человеческое уточнение теряется между машинными версиями, а подтверждение слов превращается в неподтверждённое имя говорящего."
    root_cause: "Причина исходного сбоя не установлена; наблюдаемая ошибка — смешение оснований для слов и роли."
    do_next_time: "Сохранить отдельно текст, роль и источник; человеческое исправление не отменять машинным большинством, неизвестного говорящего не достраивать по смыслу. Применить references/ogranichennaya-sverka-rechi.md."
    source_example: "examples/good-05.md"
  - symptom: "Сверка продолжается после отказа пользователя от ручной расшифровки, а готовые ссылки остаются только в сообщениях о ходе."
    root_cause: "Причина исходного сбоя не установлена; в результате не сохранены граница продолжения и доступ к спорным фрагментам."
    do_next_time: "Завершить по имеющимся материалам без новых вопросов; дополнительный проход требует нового основания. Сохранить таймкоды, пробелы и готовые аудиоссылки в итоговом ответе."
    source_example: "examples/anti-03.md"
