owner: "@kir-kopylov"
status: "experimental"
summary: "Семантическое ядро Яндекс.Директа для посуточной аренды квартир (STR): гео-кластеры из адресов, маски по группам спроса, частоты Вордстата через браузер пользователя с журналом прогресса, вердикты по частотному порогу, минус-лист без самоконфликтов и черновик кампаний в xlsx-книге. Экспериментальный: обкатка на реальных прогонах, обратная связь через штатный опрос после использования."
use_cases:
  - "Собрать с нуля семантику Директа для посуточной аренды в новом городе по списку адресов: кластеры, маски, частоты, вердикты, кампании."
  - "Дозалить новый кластер адресов в существующую книгу ядра, не потеряв ручные вердикты и решения по минусам."
  - "Проверить минус-лист (свой или подрядчика) на конфликты с собственными масками до заливки в Директ."
  - "Разобрать мусорные хвосты Вордстата в пополнение минус-листа через лист «Хвосты»."
do_not_use_for:
  - "Разовая проверка частоты одной-двух фраз — полный цикл не нужен."
  - "SEO-ядро и структура сайта под органику — другой результат."
  - "Ведение ставок, бюджетов и объявлений в Директе; Google Ads."
  - "Ниши без гео-привязки объектов — веер групп и кампании заточены под STR."
natural_triggers:
  - "собери семантику для Директа"
  - "маски и минус-слова для посуточной аренды"
  - "ключи для Вордстата по нашим адресам"
  - "прогони маски через Вордстат"
  - "добавь новый кластер адресов в ядро"
  - "проверь минус-лист против масок"
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
last_reviewed: "2026-07-24"
source_asset: "Обобщён из обезличенного рабочего прогона семантики посуточной аренды (город-миллионник, ~20 адресных кластеров, 184 маски): адреса, частоты и клиентские данные в repo не переносились."
