owner: "@kir-kopylov"
status: "experimental"
summary: "Проверяет права, активы, источники выплат и выход из вложения в строящийся или запускаемый объект доходной недвижимости."
source_asset: "Обезличенная процедура сопоставления нескольких инвестиционных инструментов по открытым материалам; исходные документы и частное заключение не публикуются."
use_cases:
  - "Различить акции проектной компании, покупку дома и будущего гостиничного номера под одним брендом."
  - "Проверить, кто обязан платить инвестору, из какого источника и на каких условиях возможен выход."
  - "Отделить денежную доходность от роста цены и подготовить запрос решающих документов."
do_not_use_for:
  - "Биржевой портфель, трейдинг, распределение личного капитала и выбор жилья для проживания."
  - "Покупка, отправка сообщений, публичное обвинение или гарантирование дохода."
natural_triggers:
  - "Проверь предложение вложиться в доходную недвижимость до перечисления денег."
  - "Предлагают акции проекта, дом под аренду или гостиничный номер — что я получу и кто должен платить."
  - "Разбери обещанную доходность и какие документы нужны для решения."
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
last_reviewed: "2026-10-18"
