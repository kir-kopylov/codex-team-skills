exceptions:
  - symptom: "Настоящий запуск и настоящее письмо в близкое время зачли как плановую отправку, хотя их ничто не связывало."
    root_cause: "Временное соседство подменило прямую цепочку от идентификатора запуска к конкретному вызову отправки."
    do_next_time: "Требовать один и тот же turn_id в записи планировщика и отправки, затем связать message_id ответа провайдера с полученной копией."
    source_example: "examples/anti-01-timing-is-not-chain.md"
  - symptom: "Правильный текст письма прошёл проверку, хотя HTML был от другого выпуска."
    root_cause: "Проверяли только видимую текстовую версию и не сравнивали ожидаемый HTML."
    do_next_time: "Если HTML входил в ожидаемый выпуск, сравнивать его так же, как тему, текст и получателей."
    source_example: "examples/good-03-html-checked.md"
  - symptom: "Пустой новый поиск стёр из вывода ранее сохранённую квитанцию получения."
    root_cause: "Старое доказательство не оценили отдельно до попытки нового чтения."
    do_next_time: "Передавать prior_receipt отдельным входом, сохранять факт его наличия и выдавать UNPROVEN для нового поиска без отрицания старой квитанции."
    source_example: "examples/good-02-prior-receipt.md"
