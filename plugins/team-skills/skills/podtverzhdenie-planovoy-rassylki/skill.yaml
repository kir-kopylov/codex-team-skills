owner: "@kir-kopylov"
author_github: "@kir-kopylov"
authors:
  - "Кирилл Копылов"
source_asset: "Санитизированный процесс восстановления утренней рассылки: отделяет подготовку, отправку, доказательство получения и проверку дублей."
status: "experimental"
summary: "Проверяет доказательства того, что один неизменённый выпуск был отправлен по расписанию и получен."
use_cases:
  - "Установить, сработала ли одна конкретная плановая рассылка и можно ли зачесть её как доставленную."
  - "Отделить запись запуска от доказательства фактической отправки и получения письма."
  - "Проверить дубли в явно названном ящике и интервале без обещания глобальной уникальности."
do_not_use_for:
  - "Исследование содержания выпуска, исправление фактов или генерация нового письма."
  - "Отправка, повторная отправка, создание Gmail-черновиков или изменение расписания."
  - "Заявление об exact-once вне наблюдаемого ящика, интервала и доказательств провайдера."
natural_triggers:
  - "рассылка сработала"
  - "почему письма нет"
  - "не было ли дубля"
  - "можно ли засчитать этот запуск"
  - "подтверди плановую доставку"
example_files:
  - "examples/good-01-complete-chain.md"
  - "examples/good-02-prior-receipt.md"
  - "examples/good-03-html-checked.md"
  - "examples/anti-01-timing-is-not-chain.md"
  - "examples/anti-02-incomplete-duplicate-search.md"
last_reviewed: "2026-09-10"
