exceptions:
  - symptom: "Ученик получил результат, но не понимает, зачем выполнял действие и как оно отвечает на вопрос встречи."
    root_cause: "В последовательности отсутствует явная связь до действия и вывод после результата."
    do_next_time: "Восстановить вопрос, цель до действия и вывод на наблюдаемом результате; проверить это в полном прогоне."
    source_example: "examples/good-01.md"
  - symptom: "После перехода между чатами или уточнения ученик не знает, где и что делать дальше."
    root_cause: "Сценарий не указал место возврата или ближайшее действие после ответа."
    do_next_time: "Назвать оба места и действие, после уточнения вернуть к ближайшему шагу в том же сообщении."
    source_example: "examples/good-02.md"
  - symptom: "Использование готового подключения названо новой настройкой, а показанный результат предлагается создать повторно."
    root_cause: "Исходное состояние и уже выполненное действие не сохранены в выводах и переходах."
    do_next_time: "Отделить существовавшее от сделанного; при достаточном материале сразу дать итог и право на правку."
    source_example: "examples/good-03.md"
  - symptom: "Полная готовность объявлена после первого ответа, старой версии либо обхода хотя бы одного обязательного эпизода."
    root_cause: "Частичная проверка использована вместо полного основного маршрута конкретного файла."
    do_next_time: "Зафиксировать окончательную версию и пройти её от фактической загрузки до результата каждого эпизода и памятки; недоступность оставить явным препятствием."
    source_example: "examples/anti-02.md"
  - symptom: "Вместо нативного приложения проверяющий запускает веб-версию."
    root_cause: "Целевая поверхность проверки была заменена браузером без основания в запросе."
    do_next_time: "Выбрать нативное приложение до первого действия, проверять только его; недоступность приложения не разрешает веб-обход."
    source_example: "examples/anti-02.md"
