owner: "@kir-kopylov"
status: "experimental"
summary: "Создаёт файл самостоятельной практики по вопросам ученика и обязательно проверяет весь путь от загрузки до памятки."
source_asset: "Согласованный контракт по разработке сопровождаемой практики и повторным проверкам файла; в пакет перенесены только общие правила и синтетические примеры."
use_cases:
  - "Собрать по материалам встречи один файл домашки, который ChatGPT сам проведёт."
  - "Исправить такую домашку по наблюдаемым затруднениям и полностью перепроверить окончательную версию."
do_not_use_for:
  - "Обычный конспект, экзамен или общая программа без вопросов и задач конкретного ученика."
  - "Только проверка чужого файла, самостоятельное проведение занятия вместо подготовки или публикация материалов."
natural_triggers:
  - "Сделай по этой встрече домашку, которую ChatGPT сам проведёт."
  - "Преврати вопросы ученика в практику одним файлом."
  - "Исправь домашку по замечаниям и полностью проверь её прохождение."
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
last_reviewed: "2026-11-12"
