summary: "Переводит ежедневные операционные сводки и сменные отчеты на один или несколько языков без потери фактов."
use_cases:
  - "Перевести ежедневную операционную сводку, сменный отчет или 'сутки' на один целевой язык без сокращения фактов."
  - "Подготовить один daily brief на несколько языков для команды, сохранив структуру, даты, числа, имена, статусы и тон."
  - "Аккуратно обработать внутренние сокращения, местные термины или неоднозначные формулировки в регулярном статусе."
do_not_use_for:
  - "Литературную редактуру, маркетинговую адаптацию, summary или пересказ вместо точного перевода."
  - "Юридически значимый, нотариальный или сертифицированный перевод."
  - "Подтверждение live-state фактов: актуальной цены, наличия, телефона, графика, реквизитов или текущего статуса."
natural_triggers:
