owner: "@kir-kopylov"
author_github: "@OfficeManEtazhy"
authors:
  - "Елизавета"
  - "коллега по договорной работе"
status: "team-ready"
summary: "Помогает готовить допсоглашения к договорам аренды по постоплате, вычету или разовому изменению суммы."
use_cases:
  - "Собрать ДС о переносе оплаты на постоплату на основе предоставленного договора аренды или найма."
  - "Собрать ДС о разовом вычете из арендной платы за конкретный месяц."
  - "Собрать ДС о разовом изменении суммы аренды за конкретный месяц с обязательной сверкой реквизитов."
do_not_use_for:
  - "Переоформление стороны договора, смену наймодателя или полную переработку договора аренды."
  - "Юридическое заключение, спорную правовую позицию или forensic-аудит договора."
  - "Публикацию raw-реквизитов, приватных договоров, ИНН, адресов объектов или внутренних эталонов без privacy-review."
natural_triggers:
  - "сделай ДС по постоплате"
  - "сделай допник по оплате"
  - "подготовь дополнительное соглашение на вычет"
  - "измени сумму аренды допсоглашением"
  - "оформи ДС к договору найма"
example_files:
  - "examples/good-01-postoplata.md"
  - "examples/good-02-vychet.md"
  - "examples/good-03-scan-sverka.md"
  - "examples/anti-01-no-contract.md"
  - "examples/anti-02-public-ready.md"
last_reviewed: "2026-08-04"
source_asset: "Исходный пакет передан коллегой по договорной работе; опубликован как доменный asset после repo-contract обвязки."
