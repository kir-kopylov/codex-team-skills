owner: "@kir-kopylov"
status: "team-ready"
summary: "Восстанавливает официальный источник знания или доступа без раскрытия и применения секретов."
use_cases:
  - "Найти владельца корпоративной системы, действующий регламент или официальный канал запроса доступа."
  - "Восстановить происхождение конфигурации, реквизитов или организационного знания по разрешённым пользователю источникам."
  - "Отделить пользователя приложения от учётной записи БД, VPN, IAM, API или другой подсистемы."
  - "Найти путь к read-only или иной минимальной роли, не используя обнаруженные административные реквизиты."
do_not_use_for:
  - "Извлечение, показ, подбор, проверку или применение паролей, токенов, ключей и административных учётных данных."
  - "Вход в чужие аккаунты, обход прав, вскрытие зашифрованных хранилищ или повышение привилегий."
  - "Изменение пользователей, прав, паролей и конфигурации, отправку заявок, проверку подключения, SQL или API."
  - "Чистую live-state проверку цены, наличия, телефона или расписания; для этого используйте verify."
natural_triggers:
  - "найди официальный источник доступа"
  - "кто владелец системы"
  - "где запросить read-only"
  - "восстанови цепочку происхождения доступа"
  - "найди регламент или источник реквизитов"
  - "логин приложения работает, а доступ к базе не работает"
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
last_reviewed: "2026-07-12"
source_asset: "Обобщено из обезличенного рабочего расследования происхождения доступа; названия систем, люди, адреса, пути и реквизиты в repo не переносились."
