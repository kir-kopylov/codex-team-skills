exceptions:
  - symptom: "Рабочий логин приложения принимается за доказательство доступа к БД или API."
    root_cause: "Агент смешал независимые уровни идентичности и начал искать реквизиты не той подсистемы."
    do_next_time: "Сначала построить карту уровней доступа и для каждого доказательства назвать подсистему, которую оно реально подтверждает."
    source_example: "examples/good-01.md"
  - symptom: "Поиск официального источника превращается в чтение конфигов и вывод чувствительных строк."
    root_cause: "Агент начал с secret-like терминов и содержимого файлов вместо владельца, регламента и метаданных."
    do_next_time: "Перейти к metadata-first и path-only поиску; при неожиданном чувствительном фрагменте не повторять значение и оставить только безопасный указатель."
    source_example: "examples/good-02.md"
  - symptom: "Старое письмо или локальный конфиг объявляется действующим источником полномочий."
    root_cause: "Техническая связь и исторический след ошибочно приняты за текущее разрешение."
    do_next_time: "Сравнить полномочие и даты, найти текущий канал подтверждения и не ставить READY_TO_USE до снятия противоречия."
    source_example: "examples/good-03.md"
