owner: "@kir-kopylov"
author_github: "@kir-kopylov"
authors:
  - "Кирилл Копылов"
status: "experimental"
summary: "Останавливает зацикленную диагностику через обязательные поля: outcome, state fingerprint, layer ledger, external-case matrix, pivot gate, owner, rollback, falsifier и stop condition."
use_cases:
  - "Остановить repair-loop, где connected/listener/TCP/green/progress есть, но пользовательский outcome не достигнут."
  - "После двух одинаковых failed или partial с тем же state fingerprint запретить третье действие в том же слое."
  - "Сменить слой гипотезы через layer ledger и external-case matrix, а не через новый набор догадок."
  - "Превратить кандида из отдельного поиска внешней практики в локально проверяемый gate, не выдавая чужой кейс за доказанную локальную причину."
  - "Вернуть один проверяемый pivot gate с action_owner, expected_observation, falsifier, rollback и stop_condition."
  - "Разобрать длинный инцидент и отделить причинный рычаг от промежуточных false-positive признаков."
do_not_use_for:
  - "Первые минуты диагностики, когда ещё не собраны outcome, current_state и список уже проверенных веток."
  - "Обычный code review, точечный bugfix с ясной failing assertion или одноразовый справочный вопрос."
  - "Отдельный поиск того, как другие решали похожую проблему, если нет повторённого local no-outcome и закрываемой ветки."
  - "Создание файлов нового team skill, catalog, examples и PR; для этого используйте add-team-skill."
  - "Проектирование контракта будущего skill без внесения файлов в repo; для этого используйте skill-methodologist."
  - "Бесконечный веб-поиск без немедленного возврата к локальному gate и local_observable."
natural_triggers:
  - "мы ходим кругами"
  - "всё было мимо"
  - "пересмотри предпосылки"
  - "что на самом деле сработало"
  - "какой слой мы проверяем"
  - "connected есть, но результата нет"
  - "два раза один и тот же timeout/no-QR/no-outcome"
  - "меньше философии, больше gates"
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
last_reviewed: "2026-08-12"
source_asset: "Сформирован из санированного урока длинного Telegram/Happ repair-loop: локальные proxy/DC/connected признаки не двигали пользовательский outcome, а перелом случился после поиска похожих случаев и перехода от app-level proxy к system-level TUN. Частные пути, скриншоты, аккаунты и raw-журнал не перенесены."
