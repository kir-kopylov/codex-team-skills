owner: "@kir-kopylov"
status: "experimental"
summary: "Принудительно останавливает зацикленную диагностику, извлекает ложную рамку, сверяет похожие внешние кейсы и возвращает один проверяемый pivot-gate."
use_cases:
  - "Остановить repair-loop, где локальные проверки дают connected/listener/TCP/green/progress, но пользовательский outcome не достигнут."
  - "После двух одинаковых failed или partial gate сменить слой гипотезы, а не повторять ту же ветку другими командами."
  - "Найти похожие реальные кейсы, выделить общий класс сбоя и превратить его в один локальный проверяемый следующий шаг."
  - "Разобрать длинный инцидент и честно отделить причинный рычаг от ложных технических признаков."
  - "Сформулировать pivot verdict для пользователя в стрессе: что закрываем, что проверяем теперь и что запрещено повторять."
do_not_use_for:
  - "Первые минуты диагностики, когда ещё не собраны базовые факты, outcome и список уже проверенных веток."
  - "Обычный code review, точечный bugfix с ясной failing assertion или одноразовый справочный вопрос."
  - "Создание файлов нового team skill, catalog, examples и PR; для этого используйте add-team-skill."
  - "Проектирование контракта будущего skill без внесения файлов в repo; для этого используйте skill-methodologist."
  - "Бесконечный веб-поиск без немедленного возврата к локальному gate."
natural_triggers:
  - "мы ходим кругами"
  - "всё было мимо"
  - "найди как люди решали похожую проблему"
  - "пересмотри предпосылки"
  - "что на самом деле сработало"
  - "какой слой мы проверяем"
  - "connected есть, но результата нет"
  - "два раза один и тот же timeout/no-QR/no-outcome"
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
last_reviewed: "2026-07-09"
source_asset: "Сформирован из санированного урока длинного Telegram/Happ repair-loop: локальные proxy/DC/connected признаки не двигали пользовательский outcome, а перелом случился после поиска похожих случаев и перехода от app-level proxy к system-level TUN. Частные пути, скриншоты, аккаунты и raw-журнал не перенесены."
