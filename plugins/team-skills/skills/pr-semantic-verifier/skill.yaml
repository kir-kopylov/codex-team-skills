owner: "@kir-kopylov"
status: "experimental"
summary: "Проверяет, доказывают ли изменения и тесты заявленный результат PR, отличая дефект реализации от дефекта проверки, старого падения и непроверенного runtime."
use_cases:
  - "Сопоставить заявленный результат GitHub PR с авторитетным требованием, diff, тестами и фактическими наблюдениями на точном head."
  - "Отличить новую регрессию от старого падения осторожным сравнением одного сценария на base и head."
  - "Выявить false green, когда CI подтверждает строку, mock, config или другой proxy вместо обещанного результата."
  - "Разделить доказательства repository, CI, merge, installation, runtime и пользовательского результата."
do_not_use_for:
  - "Обычный code review стиля, архитектуры, безопасности или производительности без вопроса о доказанности результата."
  - "Исправление уже локализованного корректного CI-сбоя либо ведение PR до merge вместо профильного workflow."
  - "Изменение кода, тестов, комментариев или Git state, если пользователь попросил только проверить."
  - "Утверждение о текущем состоянии внешнего UI или компьютера другого человека без свежего наблюдения."
  - "Проверка GitLab MR в первой версии skill."
natural_triggers:
  - "проверь семантику этого PR"
  - "доказывают ли тесты исправление"
  - "CI зелёный, но проблема реально решена?"
  - "это новая регрессия или старое падение?"
  - "сломан код или сам тест?"
  - "не ослабили ли проверку ради зелёного CI?"
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/good-04.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
  - "examples/anti-03.md"
last_reviewed: "2026-07-20"
source_asset: "Сформирован из санированного разбора случая, где зелёный CI не доказывал пользовательский результат; raw-диалог, приватные пути и данные другого компьютера не перенесены."
evaluation:
  status: "not-run"
  required_before_team_ready: true
  rubric: "references/eval-rubric.md"
  minimum_cases: 10
