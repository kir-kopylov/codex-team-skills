exceptions:
  - symptom: "Зелёный CI принят за доказательство результата на Desktop или другой пользовательской поверхности."
    root_cause: "Проверка подтверждала наличие строки или файла, а слой repository был неявно перенесён на runtime."
    do_next_time: "Построить claim/evidence ledger, присвоить PROXY_ONLY и оставить внешнюю поверхность UNVERIFIED до прямого наблюдения."
    source_example: "examples/good-01.md"
  - symptom: "Падение на head объявлено новой регрессией без запуска сопоставимого сценария на base."
    root_cause: "Красный head был принят за причинность PR без baseline и проверки сопоставимости среды."
    do_next_time: "При спорной причинности выполнить безопасное base/head-сравнение; introduced-regression назначать только при base pass, head fail и сопоставимой среде."
    source_example: "examples/good-03.md"
  - symptom: "Merge, установка plugin или обновление repo выданы за доказательство работы на компьютере пользователя."
    root_cause: "Разные доказательные слои были сведены в одно состояние готовности."
    do_next_time: "Назвать верхний доказанный слой и оставить installation, runtime или user-outcome UNVERIFIED, пока они не наблюдались напрямую."
    source_example: "examples/good-04.md"
  - symptom: "Падающую проверку ослабили до наличия строки или файла, чтобы вернуть зелёный CI."
    root_cause: "Исправление было выбрано по цвету check, а не по исходному инварианту и авторитетному требованию."
    do_next_time: "Сначала восстановить требуемое наблюдение и два oracle-вопроса; менять тест только при test-contract-defect без ослабления исходного инварианта."
    source_example: "examples/good-02.md"
  - symptom: "Старый exact-string assertion продолжает блокировать PR после явного изменения авторитетного контракта."
    root_cause: "Fixture или test oracle не были синхронизированы с документированным contract change."
    do_next_time: "Зафиксировать contract-changed и stale-fixture, подтвердить поведение прямой пробой и обновить тест вместе с источником требования."
    source_example: "examples/good-02.md"
