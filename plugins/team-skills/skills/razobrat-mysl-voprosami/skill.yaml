source_asset: "Авторский навык разбора убеждений, учебных затруднений и аналитических выводов через вопросы."
status: "experimental"
summary: "Помогает самому разобраться в убеждении, непонятном шаге или выводе через один вопрос за ход."
use_cases:
  - "Выяснить, на чём держится собственное убеждение и что могло бы его изменить."
  - "Найти непонятный шаг в материале и своими словами объяснить правило."
  - "Сопоставить объяснения наблюдения и сформулировать различающую проверку."
do_not_use_for:
  - "Прямое объяснение, пересказ или проверка фактов по внешним источникам."
  - "Интервью для сбора требований или описания процесса другого человека."
natural_triggers:
  - "Помоги разобраться. Задавай по одному вопросу"
  - "Не давай готовый ответ. Помоги мне разобраться по одному вопросу."
  - "Задавай по одному вопросу и помоги проверить мой вывод."
