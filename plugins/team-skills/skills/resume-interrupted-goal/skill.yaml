owner: "@kir-kopylov"
status: "experimental"
summary: "В режиме только чтения восстанавливает проверяемое состояние прерванного /goal и выдаёт один безопасный следующий шаг."
use_cases:
  - "После падения приложения или длинного чата доказать, что уже завершено и что можно продолжать первым."
  - "Сопоставить управляющие файлы проекта, Git, текущее состояние внешней системы и постоянные артефакты без повторного чтения всей истории."
  - "Обнаружить конфликт между route, state, HEAD и фактическими файлами до запуска нового /goal-цикла."
  - "Проверить, не были ли commit, push, PR/MR или другое внешнее действие уже выполнены."
do_not_use_for:
  - "Исполнение следующего шага, запуск или восстановление /goal и изменение репозитория или внешней системы."
  - "Поиск неизвестной session, cwd, worktree, commit или target repo по длинной или архивной задаче; для этого использовать codex-session-to-repo-rescue."
  - "Формирование /goal-контракта; для этого использовать goal-contract-shaper."
  - "Простую проверку Git без прерванной цели; для этого использовать git-worktree-reality-check."
natural_triggers:
  - "продолжи прерванный /goal"
  - "после падения Codex проверь, что уже сделано"
  - "можно ли безопасно продолжить этот goal"
  - "восстанови состояние и следующий шаг"
  - "не читай весь чат, восстановись по файлам"
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
last_reviewed: "2026-07-19"
source_asset: "Санитизированный процесс восстановления после длинных /goal-задач; исходные чаты, личные пути и приватные данные в репозиторий не переносились."
