exceptions:
  - symptom: "Агент продолжает работу, потому что один state-файл помечен ACTIVE, хотя управляющий route говорит, что цикл не запускался."
    root_cause: "Самый свежий или машинно выглядящий источник ошибочно принят за единственную истину."
    do_next_time: "Вернуть RECONCILE_REQUIRED, показать оба утверждения и сверить identity цикла с текущим runtime/provider state до любого продолжения."
    source_example: "examples/good-02.md"
  - symptom: "Для восстановления агент заново читает весь длинный журнал или чат и снова раздувает контекст."
    root_cause: "Контрольная точка не отделена от хвоста событий после неё."
    do_next_time: "Сначала проверить контрольную точку, затем прочитать только хвост после курсора; полный проход разрешать только для аудита, восстановления или повреждённой точки."
    source_example: "examples/good-01.md"
  - symptom: "Чат утверждает, что push или PR уже сделан, и агент либо верит этому, либо повторяет действие без проверки."
    root_cause: "Память чата была принята за доказательство текущего состояния внешней системы."
    do_next_time: "Проверить provider state только для чтения; без наблюдаемого следа вернуть INSUFFICIENT_EVIDENCE и не повторять внешнее действие."
    source_example: "examples/good-03.md"
  - symptom: "По названию архивной задачи выбран предположительный репозиторий и начато продолжение."
    root_cause: "Неоднозначная цепочка session → cwd → worktree → commit → target была заменена догадкой."
    do_next_time: "Вернуть AMBIGUOUS_TARGET и передать один следующий шаг codex-session-to-repo-rescue в режиме read-only map."
    source_example: "examples/anti-01.md"
