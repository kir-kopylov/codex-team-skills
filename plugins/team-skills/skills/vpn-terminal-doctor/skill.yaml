owner: "@kir-kopylov"
status: "experimental"
summary: "Дерево диагностики для случая «терминал не видит интернет, а браузер видит» при VPN: класс маяка (внутристрановой + внешний) → транспорт git (https или ssh) → залипшие переменные и git config → безусловная проба в обход → обход одной командой или один переключатель VPN-приложения, с контрольной пробой; команды даны парами под Git Bash и PowerShell/cmd."
use_cases:
  - "Починить git/curl/gh в терминале, когда браузер работает, а терминал даёт 000 или таймаут при VPN."
  - "Отделить блокировку целевого сайта от отказа сети парой маяков разных классов до всякого лечения."
  - "Проверить транспорт git (https/ssh) и не лечить ssh-remote прокси-переменными, на которые он не реагирует."
  - "Найти живой источник прокси (переменные окружения или git config http.proxy) и снять его правильным обходом."
  - "Выдать человеку одну точную инструкцию по переключателю VPN-приложения вместо перебора вслепую."
do_not_use_for:
  - "Диагностика полностью мёртвой сети, когда и браузер не работает."
  - "Настройка самого VPN, обход блокировок, починка DNS или файрвола."
  - "Правка реестра, профилей оболочки или глобального конфига git без явного согласия человека."
natural_triggers:
  - "терминал без интернета при VPN"
  - "git не пушится, а браузер работает"
  - "curl даёт 000 при включённом VPN"
  - "включил VPN и терминал отвалился"
  - "почини сеть терминала"
example_files:
  - "examples/good-01-stale-proxy-vars.md"
  - "examples/anti-01-toggle-blindly.md"
last_reviewed: "2026-07-06"
source_asset: "Сформирован из рабочей сессии, где git/gh не видели сеть при живом браузере: залипшие переменные прокси на мёртвый локальный порт при активном туннельном режиме; обход env -u подтверждён контрольной пробой. Приватные адреса и аккаунты в skill не переносились."
