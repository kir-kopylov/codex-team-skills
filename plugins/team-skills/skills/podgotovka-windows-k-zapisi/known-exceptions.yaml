exceptions:
  - symptom: "USB-гарнитура видна в Windows, но отсутствует в списке устройств OBS."
    root_cause: "OBS был запущен до подключения или переключения гарнитуры и не обновил список аудиоустройств."
    do_next_time: "Полностью закройте и снова запустите OBS после подключения гарнитуры, затем выберите её явные устройства вывода и микрофона."
    source_example: "examples/good-03.md"
  - symptom: "Голос или системный звук слышен с эхом либо в записи появляются одинаковые сигналы на нескольких источниках."
    root_cause: "Одновременно включены устройство `По умолчанию` и то же самое явно выбранное устройство."
    do_next_time: "Оставьте по одному явному устройству для звука компьютера и микрофона, остальные глобальные устройства отключите."
    source_example: "examples/good-01.md"
  - symptom: "В предпросмотре виден только один экран, часть второго экрана или чёрный зазор между источниками."
    root_cause: "Размер холста, размер источников или координата второго экрана не совпали с фактическими разрешениями."
    do_next_time: "Снова снимите разрешения, задайте холст как сумму ширин и максимальную высоту, затем установите точные размеры и X-координаты источников."
    source_example: "examples/good-02.md"
  - symptom: "OBS завершил запись без ошибки, но отдельная дорожка компьютера или микрофона пуста."
    root_cause: "Успех записи был принят за проверку маршрутизации аудио, хотя дорожки не прослушали и не проверили отдельно."
    do_next_time: "Запустите короткую раздельную аудиопробу и проверку файла; не объявляйте READY без сигнала на дорожках 2 и 3."
    source_example: "examples/anti-01.md"
  - symptom: "FFmpeg установлен через WinGet, но команда `ffprobe` не находится."
    root_cause: "WinGet-пакет установлен в пользовательскую папку, которая ещё не попала в PATH текущего процесса Codex или PowerShell."
    do_next_time: "Сначала найдите `ffmpeg.exe` и `ffprobe.exe` внутри WinGet Packages без переустановки; новый терминал открывайте только если прямой путь не найден."
    source_example: "Санированная проверка пробного MKV на Windows 2026-07-19; личный путь к файлу не сохранялся."
