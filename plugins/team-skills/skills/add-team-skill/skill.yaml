status: "team-ready"
summary: "Ведёт автора через discovery, создание, проверку и публикацию нового командного skill по правилам repo."
use_cases:
  - "Оформить повторяемый workflow из диалога или проекта как новый командный Codex skill."
  - "Перенести уже установленный личный skill в командную библиотеку и явно закрыть судьбу личного предшественника."
  - "Интегрировать чужой draft или методику в существующий skill без потери авторства и без создания дубля."
  - "Довести draft skill до team-ready: registry, examples, catalog, tests и PR."
  - "Проверить существующий skill перед публикацией и исправить нарушения правил repo или CI."
  - "Безопасно проверить тестовую среду и опубликовать PR так, чтобы невалидный текст не мог пройти к внешнему изменению."
  - "До commit независимо проверить первый ответ нового или существенно изменённого skill на дословной пользовательской фразе запуска."
do_not_use_for:
  - "Разовые инструкции, которые не будут повторяться и не требуют отдельного командного skill."
  - "Секретные, клиентские или приватные workflows, которые нельзя хранить в публичном repo."
  - "Присвоение неподтвержденного GitHub handle автору draft вместо сохранения авторства через authors и source_asset."
  - "Публикацию push или Pull Request без понимания scope изменений и явного запроса пользователя."
natural_triggers:
  - "добавь новый skill"
  - "перенеси мой личный skill в командную библиотеку"
  - "сделай из этого skill"
  - "оформи workflow как командный skill"
  - "доработай skill под требования repo"
  - "доведи skill до team-ready"
  - "проверь skill перед PR"
  - "почини skill под CI"
