exceptions:
  - id: "personal-to-team-predecessor-not-closed"
    symptom: "После переноса личного skill в командную библиотеку старая личная и новая командная версии одновременно остаются доступными, причём более старая версия может сработать первой."
    root_cause: "Workflow проверил файлы, тесты и публикацию repo, но не выбрал канонический контейнер до создания и не закрыл судьбу личного предшественника после проверки командной версии в runtime."
    do_next_time: "Для team-first skill сразу работать в repo; при personal-to-team переносе до записи найти совпадения имени и назначения, отдельно проверить командную версию в новой сессии и считать перенос завершённым только после явного решения по каждому предшественнику."
    source_example: "examples/good-04-colleague-draft.md"
  - id: "missing-test-extras-in-system-python"
    symptom: "Стандартный pytest падает до сбора тестов, потому что системный Python не содержит pytest-cov или других test extras."
    root_cause: "Наличие pytest было ошибочно принято за готовую среду repo."
    do_next_time: "Прочитать pyproject.toml и использовать repo .venv либо отдельную временную venv с .[test], не меняя глобальный Python."
    source_example: "examples/anti-03-unsafe-test-environment.md"
  - id: "broken-codex-wrapper-treated-as-skill-failure"
    symptom: "Local native smoke не стартует: codex wrapper возвращает ENOENT до проверки marketplace."
    root_cause: "Работоспособность CLI не была проверена отдельно от тестируемого skill."
    do_next_time: "Сначала выполнить codex --version; при ENOENT поставить LOCAL_NATIVE_SMOKE_BLOCKED и отделить это от фактического CI."
    source_example: "examples/anti-03-unsafe-test-environment.md"
  - id: "local-clone-hardlink-failure"
    symptom: "Временный clone локального checkout падает на hardlink между несовместимыми каталогами или границами sandbox."
    root_cause: "Обычный local git clone неявно попытался использовать hardlinks."
    do_next_time: "Для clone из локального source использовать git clone --no-hardlinks."
    source_example: "examples/anti-03-unsafe-test-environment.md"
  - id: "pr-mutation-runs-after-failed-validation"
    symptom: "Проверка PR body завершается ошибкой, но следующая команда в том же shell-блоке всё равно изменяет PR."
    root_cause: "Read-only validation и внешняя mutation были объединены без транзакционного гейта."
    do_next_time: "Проверить event JSON отдельным вызовом, наблюдать exit 0 и лишь затем отдельным вызовом выполнить gh pr create или edit с body-file; после публикации прочитать body обратно."
    source_example: "examples/good-05-safe-pr-transaction.md"
  - id: "stale-pr-governance-after-metadata-edit"
    symptom: "После изменения title или body старый зелёный governance check назван подтверждением нового текста."
    root_cause: "Результат CI не был привязан к event payload, на котором реально выполнялся."
    do_next_time: "Снова проверить текущий текст локально и не называть старый job актуальным; rerun может сохранить прежний payload, поэтому CI-подтверждение требует нового штатного PR event."
    source_example: "examples/good-05-safe-pr-transaction.md"
  - id: "blocking-consent-stalls-work"
    symptom: "Навык однозначно подходит к запросу, но чат останавливается ради подтверждения внутреннего метода и заставляет пользователя возвращаться с отдельной короткой репликой."
    root_cause: "Выбор способа работы был ошибочно приравнен к разрешению на действие с последствиями."
    do_next_time: "Показывать одну короткую контекстную строку и продолжать работу в том же ответе; решение запрашивать только при несовместимых результатах или непосредственно перед ещё не разрешённым действием."
    source_example: "examples/anti-04-blocking-consent.md"
  - id: "static-green-wrong-first-response"
    symptom: "Структура skill и pytest зелёные, но первый реальный ответ нарушает прямое намерение пользователя."
    root_cause: "Проверены файлы и статические контракты, но не наблюдаемое поведение skill на дословной фразе запуска."
    do_next_time: "До commit зафиксировать критерии, передать свежему агенту только target skill и точную фразу, оценить первый ответ и запретить commit, push и PR при BEHAVIOR_PROBE_FAIL или BEHAVIOR_PROBE_BLOCKED."
    source_example: "examples/good-02-team-ready.md"
  - id: "incomplete-or-stale-behavior-probe-batch"
    symptom: "Commit или PR открыт после одной успешной пробы, хотя другой изменённый skill, включая skill с правкой только known-exceptions.yaml или новым untracked launch-файлом, не проверен либо его PASS относится к другой базе, набору загруженных источников или состоянию target."
    root_cause: "Одиночный зелёный ответ или структурный pytest был ошибочно принят за доказательство полного пакетного охвата; один git diff потерял untracked либо замаскированный committed/staged путь, fingerprint видел worktree, но не другие bytes в index, глобальный путь не получил доказанной атрибуции, generic scope_reason потерял launch-path, behavior-affecting known-exceptions не попал в required_source, а mode, содержимое excluded-пути и доказательство исключения не участвовали в freshness fingerprints."
    do_next_time: "Сначала option-safe проверить полный exact checked_base OID и fail-closed producer-ом независимо объединить committed, staged, unstaged tracked и untracked-файлы; полностью разложить batch_changed_source в batch_attribution либо batch_excluded_source; до живых проб выполнить exact staging и сохранить head_oid, выбранный CREATE/AMEND, expected_parent_oids, index_tree_oid=tested_tree, отсутствие unmerged и HEAD/index/worktree entries в fingerprints; для каждой строки доказать scope_reason, exclusions, обязательный known-exceptions.yaml, launch-paths, loaded_source и запретить загружаемые symlink; продолжить пакет после FAIL/BLOCKED; до commit заново сверить layer vector и fingerprints, а после commit переносить PASS только при точном совпадении transition parents, tested_tree, index tree, ожидаемом продвижении precommit index entries и чистом status; после движения базы повторить затронутые строки, а при изменении общего контракта — весь пакет."
    source_example: "examples/good-07-batch-first-responses.md"
  - id: "behavior-probe-mutated-shared-target"
    symptom: "Проверяемый первый ответ выполнил stash, rebase, запись или внешнее действие в общем рабочем target вместо изолированной пробы."
    root_cause: "Свежий контекст был ошибочно принят за изоляцию состояния и полномочий."
    do_next_time: "Запускать способный менять состояние первый ход только в одноразовой точной копии без production credentials и push-доступа к настоящему remote; если это невозможно, поставить BEHAVIOR_PROBE_BLOCKED."
    source_example: "examples/good-07-batch-first-responses.md"
  - id: "add-team-skill-self-probe-recursion"
    symptom: "Строка add-team-skill снова вычисляет тот же пакет с самой собой и запускает бесконечные вложенные пробы."
    root_cause: "Оркестратор проверялся на исходном diff либо внутреннему fixture разрешили породить третий уровень вместо ограниченной двухуровневой проверки."
    do_next_time: "Во внешней строке загрузить точный кандидат add-team-skill и дать ему внутренний disposable fixture той же базы с минимум двумя другими изменёнными skills и без add-team-skill в diff; оценить первый ответ во внешний статус, запретить третий уровень и продолжить внешний пакет."
    source_example: "examples/good-07-batch-first-responses.md"
