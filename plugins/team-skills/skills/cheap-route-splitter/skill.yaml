owner: "@kir-kopylov"
author_github: "@kir-kopylov"
authors:
  - "Кирилл Копылов"
status: "team-ready"
summary: >-
  Собирает межстрановой маршрут дешевле единого билета: живой baseline и kill-gate,
  перебор входов в страну назначения (прямые плечи + наземные хабы), сплит с покупкой
  внутреннего плеча в местной валюте, live-проверка каждого плеча браузером и таблица
  с честными статусами цен (live / оценка / регулируемый / стена).
use_cases:
  - "Добраться из города А в город Б через границу дешевле заданного лимита, когда единый билет дорогой."
  - "Перебрать входы в страну назначения (аэропорты с прямым плечом, наземные хабы) и сравнить сплиты с baseline."
  - "Собрать составной маршрут с внутренним плечом в местной валюте и проверить каждое плечо живой ценой."
do_not_use_for:
  - "Разовая live-проверка цены одного варианта — это skill `verify`."
  - "Отслеживание динамики цен по расписанию, журналы и графики снимков."
  - "Поездки, где багаж и стыковки должны быть под защитой одного перевозчика (жёсткие командировки, минимальные буферы)."
  - "Ранжирование локальных исполнителей — это `local-contractor-evidence-ranker`."
natural_triggers:
  - "добраться до города дешевле лимита"
  - "единый билет слишком дорогой, собери сплит"
  - "разбей маршрут на плечи"
  - "через какой город дешевле въехать в страну"
  - "долететь максимально дёшево, способ не важен"
example_files:
  - "examples/good-01-vhod-hub-loukoster.md"
  - "examples/good-02-zhd-split-mestnaya-valyuta.md"
  - "examples/good-03-polnyy-perebor-po-gate.md"
  - "examples/anti-01-baseline-v-limite.md"
  - "examples/anti-02-bagazh-pod-zashchitoy.md"
last_reviewed: "2026-08-04"
source_asset: "Методика сравнения единого билета с составными межстрановыми маршрутами, проверкой каждого плеча и явными рисками самостоятельных стыковок; частные поездки и контакты не включены."
