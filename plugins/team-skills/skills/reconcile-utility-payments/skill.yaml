source_asset: "Личный навык, созданный из повторяемой сверки коммунальных начислений и оплат по изображениям и таблицам."
status: "team-ready"
summary: "Сверяет коммунальные начисления и оплаты и честно отделяет разницу показанного периода от официального долга."
use_cases:
  - "Посчитать недоплату или переплату по одному или нескольким скриншотам взаиморасчётов."
  - "Добавить новые месяцы и пересчитать итог без двойного учёта пересекающихся данных."
  - "Учесть явно показанный входящий остаток и получить расчётный остаток на выбранную дату."
do_not_use_for:
  - "Юридическое подтверждение долга, банковского зачисления, назначения платежей или пеней без официальной детализации."
natural_triggers:
  - "Посчитай, вышли ли мы в ноль по этим скриншотам."
  - "Добавь ещё месяц и пересчитай."
  - "Сверь начисления и оплаты."
