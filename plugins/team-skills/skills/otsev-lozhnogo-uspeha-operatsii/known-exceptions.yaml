exceptions:
  - symptom: "Один успешный подрезультат или ответ writer принят за доказательство завершения всей операции."
    root_cause: "Узкий сигнал перенесён на обязательства полной операции без матрицы покрытия всех путей завершения."
    do_next_time: "Сначала отделить полную операцию от узкой и сопоставить каждое обязательство с прямой проверкой на каждом пути к финальному статусу."
    source_example: "examples/good-01.md"
  - symptom: "Аудит ложного завершения разрастается в проектирование retry, replay, recovery capsule и новой архитектуры."
    root_cause: "Вердикт аудитора ошибочно принят за разрешение и необходимость сразу исправлять все смежные классы сбоев."
    do_next_time: "Остановиться после вердикта, матрицы и минимального контрпримера; ремонт выполнять только отдельной задачей."
    source_example: "examples/anti-01.md"
  - symptom: "Корректный запуск без найденных бизнес-объектов признан незавершённым, хотя все процессные обязательства доказаны."
    root_cause: "Полезный бизнес-результат ошибочно сделан обязательным вместо проверки фактического контракта операции."
    do_next_time: "Не добавлять требование результата из воздуха; допустимый пустой результат считать завершённым при закрытых обязательствах."
    source_example: "examples/good-02.md"
  - symptom: "Сбор данных выдал финальный результат, но процесс не завершился и потребовал прерывания."
    root_cause: "Выдача финального результата принята за выход процесса."
    do_next_time: "Считать финальный результат контрольной точкой сохранения: до прерывания зависшего процесса проверить число сохранённых записей и пройденную валидацию, затем прерывать только зависший процесс."
    source_example: "examples/good-01.md"
  - symptom: "Отбор тестов отрицательным шаблоном имени запустил тест, который читает запрещённые приватные данные."
    root_cause: "Отрицание в шаблоне имени принято за границу исполнения, хотя фактическую границу чтения оно не задаёт."
    do_next_time: "Когда хотя бы один существующий тест пересекает запретную границу чтения, отбирать тесты явным положительным списком имён и сразу сообщать о нарушении границы."
    source_example: "examples/good-04.md"
  - symptom: "Длинный обязательный документ прочитан не полностью: начало и конец получены, середина срезана."
    root_cause: "Заявленный бюджет вывода принят за гарантию полного чтения."
    do_next_time: "Длинные обязательные файлы читать ограниченными непересекающимися диапазонами строк и до старта работы сверять, что диапазоны покрыли весь файл."
    source_example: "examples/good-04.md"
  - symptom: "Сформированный патч отклонён из-за строки без префикса, и ни один файл не изменился."
    root_cause: "Обрезка хвоста сгенерированного патча нарушила префиксы строк добавляемых файлов."
    do_next_time: "Патч добавления файлов собирать из массива строк и проставлять префикс каждой строке данных после разбиения, а не править текст готового патча."
    source_example: "examples/good-04.md"
  - symptom: "Аттестация сессии ревью отклонена: после обязательного строгого JSON в ответе появился пользовательский текст."
    root_cause: "Предполагалось, что отдельный ревьюер вернёт единственный строгий JSON вопреки унаследованным правилам оформления ответа."
    do_next_time: "Для строгой аттестации выделять канал, где финальный артефакт не дополняется пользовательскими приписками, либо переносить JSON ревью отдельным транспортом; при невозможности останавливаться, а не ослаблять аттестацию."
    source_example: "examples/good-03.md"
  - symptom: "Команда отметки времени отклонила опцию и не дала выполниться связанной проверке состояния."
    root_cause: "Использована длинная опция GNU, которой нет в версии команды на macOS."
    do_next_time: "На macOS брать метку времени через `date -Iseconds` и проверять поддержку опции до включения команды в цепочку."
    source_example: "examples/good-04.md"
