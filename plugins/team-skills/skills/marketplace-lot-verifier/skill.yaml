owner: "@kir-kopylov"
status: "experimental"
summary: "Проверяет б/у-лоты на маркетплейсе диалогами с продавцами: две ступени проверки, медиана-порог, строгие шаблоны, отчёт топ-N верифицированных лотов. Не покупает и не торгуется."
use_cases:
  - "Найти и подтвердить живые лоты под конкретную б/у-вещь (комплектующие, телефон, техника) перед покупкой."
  - "Отсеять мёртвые объявления, приманки и двойников спецификации; получить топ-3 с ценами, доставкой и датой подтверждения."
  - "Вести переписку с продавцами строго по шаблону с аккаунта пользователя и зафиксировать, кто ответил живьём."
do_not_use_for:
  - "Покупка, бронирование, торг или любые обещания продавцу — запрещено безусловно."
  - "Розничные магазины без диалогов (там проверка наличия на сайте, не переписка)."
  - "Разовая справка «сколько стоит» без верификации лотов."
natural_triggers:
  - "найди и проверь лоты на Авито"
  - "кто реально продаёт, отсей мёртвые объявления"
  - "собери топ-3 живых варианта с ценами"
  - "напиши продавцам и узнай, актуально ли"
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
authors:
  - "Кирилл Копылов"
source_asset: "Два прожитых /goal-цикла поиска и верификации лотов для апгрейда ПК (Авито + розница): goal-контракт c правками, журнал, тайминг-лог и финальные отчёты; механика извлечена и обезличена."
last_reviewed: "2026-07-06"
