owner: "@kir-kopylov"
status: "experimental"
summary: "Проверяет б/у-лоты на Авито диалогами с продавцами: две ступени проверки, медиана-порог, строгие шаблоны, отчёт топ-N верифицированных лотов. Не покупает и не торгуется; сам пишет продавцам с аккаунта пользователя и живёт многочасовым циклом."
use_cases:
  - "Найти и подтвердить живые б/у-лоты под конкретную вещь (комплектующие, телефон, техника) перед покупкой."
  - "Отсеять мёртвые объявления, приманки и двойников спецификации; получить топ-3 с ценами, доставкой и датой подтверждения."
  - "Вести переписку с продавцами строго по шаблону с аккаунта пользователя и зафиксировать, кто ответил живьём."
do_not_use_for:
  - "Покупка, бронирование, торг или любые обещания продавцу — запрещено безусловно."
  - "Разовая проверка живых фактов без переписки от имени пользователя — это skill verify."
  - "Услуги и исполнители, включая Авито Услуги — это local-contractor-evidence-ranker."
  - "Розничные магазины без диалогов (там проверка наличия на сайте, не переписка)."
  - "Площадки, где у пользователя нет залогиненного аккаунта — переписка от его имени невозможна."
natural_triggers:
  - "найди и проверь б/у-лоты на Авито"
  - "кто из продавцов реально продаёт, отсей мёртвые объявления"
  - "собери топ-3 живых б/у-лота с ценами"
  - "напиши продавцам лотов и узнай, актуально ли"
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
authors:
  - "Кирилл Копылов"
source_asset: "Два прожитых /goal-цикла поиска и верификации лотов для апгрейда ПК (Авито + розница): goal-контракт c правками, журнал, тайминг-лог и финальные отчёты; механика извлечена и обезличена. Доработан по итогам панельного критического разбора (4 линзы, 28 находок)."
last_reviewed: "2026-07-06"
