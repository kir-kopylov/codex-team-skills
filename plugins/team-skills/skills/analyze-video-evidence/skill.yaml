owner: "@OfficeManEtazhy"
authors:
  - "OfficeManEtazhy"
status: "team-ready"
summary: "Анализирует видео по всей длительности: отдельно проверяет визуальный ряд и звук, сводит факты по таймкодам и не выдает превью за просмотр."
use_cases:
  - "Посмотреть локальное видео целиком и сообщить, что на нем видно и слышно."
  - "Проверить конкретное событие, повреждение, надпись или реплику на записи с привязкой к таймкодам."
  - "Подготовить письмо, жалобу, отчет или другой документ на основе подтвержденных визуальных и звуковых фактов."
do_not_use_for:
  - "Монтаж, обрезку, сжатие, конвертацию или художественную обработку видео без анализа содержания."
  - "Выводы об идентичности человека, точной причине поломки, диагнозе или юридической ответственности только по внешнему сходству."
  - "Случай, когда доступно лишь превью или скриншот, а пользователь просит утверждать, что просмотрена и прослушана вся запись."
natural_triggers:
  - "посмотри видео целиком"
  - "что видно и слышно на записи"
  - "проанализируй этот ролик"
  - "прослушай звуковую дорожку видео"
  - "сделай обращение на основе видео"
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
last_reviewed: "2026-07-21"
source_asset: "Санированный рабочий случай: документ был преждевременно подготовлен по превью без проверки аудиодорожки; приватные видео, адреса, имена и расшифровки не перенесены."
