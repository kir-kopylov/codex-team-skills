source_asset: "Обезличенный рабочий диалог о покупке б/у брендовых наушников у частного продавца на маркетплейсе: протокол дистанционных просьб с выгодой для продавца, сверка фактов по первичным страницам производителя, стоп-правила и чек-лист встречи."
status: "experimental"
summary: "Составляет дистанционный протокол отсева неоригинала б/у устройства: минимальные просьбы продавцу с честной выгодой, факты по первичным источникам производителя, стоп-правила и разбор присланных ответов."
use_cases:
  - "Перед встречей с частным продавцом отсеять реплику брендового б/у устройства минимальными просьбами прислать, показать или сделать что-то."
  - "Разобрать присланные продавцом скриншоты, фото и видео по стоп-сигналам и решить: следующая просьба, встреча или выход."
  - "Получить чек-лист проверки при встрече и после покупки для точной модели и варианта."
do_not_use_for:
  - "Переписка с продавцом от имени пользователя и многочасовой цикл ожидания ответов — это marketplace-lot-verifier."
  - "Проверка цены, наличия, доставки и ранжирование предложений — это verify."
  - "Выбор модели или сравнение моделей по прочности и качеству — это rugged-anc-headphone-ranker."
  - "Спор с продавцом, возврат денег или экспертиза уже купленного устройства."
natural_triggers:
  - "как проверить, что это оригинал, не встречаясь"
  - "что попросить продавца прислать или показать, чтобы отсеять подделку"
  - "составь протокол дистанционной проверки подлинности"
  - "оцени, что прислал продавец: это оригинал или реплика"
  - "выявить не оригинал минимальными средствами дистанционно"
