exceptions:
  - symptom: "Git-команда падает с fatal: not a git repository, хотя команда сама по себе корректная."
    root_cause: "Команда была запущена из projectless или другой папки, где нет нужного `.git`."
    do_next_time: "Сначала проверить cwd и target repo, затем использовать `git -C <repo> ...` вместо короткой команды."
    source_example: "examples/good-02.md"
  - symptom: "Ветка выглядит как старый шум, но содержит единственный локальный commit."
    root_cause: "Cleanup начался до проверки `ahead/behind`, reachability commit и PR/remote state."
    do_next_time: "Перед удалением ветки проверить `branch -vv`, diff/log относительно `origin/main` и PR state; уникальную работу сначала вынести или явно признать superseded."
    source_example: "examples/good-03.md"
  - symptom: "Пользователь считает repo полностью чистым, потому что `git diff` пустой."
    root_cause: "Рабочее дерево смешано с веточным состоянием: активная branch, upstream, remote refs или PR state не проверены."
    do_next_time: "Разделить ответ на Worktree, Branch и Remote/PR; не говорить 'всё чисто', если чист только файловый слой."
    source_example: "examples/good-01.md"
  - symptom: "Снимок состояния repo устаревает за минуту: параллельная сессия в той же папке спрятала изменения, очистила дерево и подтянула обновления."
    root_cause: "Состояние принято за стабильное на время проверки, а текущая сессия — за единственного действующего."
    do_next_time: "Перед вердиктом и перед любой мутацией повторно снять быстрый снимок состояния и ветки и проверить признаки параллельных сессий в той же папке."
    source_example: "examples/good-01.md"
  - symptom: "Read-only снимок целиком объявлен сбойным из-за штатного «совпадений нет» в необязательной проверке настроек."
    root_cause: "Ненулевой код возврата при отсутствии совпадений принят за ошибку выполнения."
    do_next_time: "Необязательные проверки настроек оформлять явной веткой «совпадений нет» до агрегации, чтобы отсутствие совпадения не валило весь снимок."
    source_example: "examples/good-01.md"
  - symptom: "Профильный тест завершился до сбора тестов: в выбранном окружении нет обязательной зависимости из конфигурации repo."
    root_cause: "Доступный в worktree интерпретатор принят за содержащий все зависимости repo."
    do_next_time: "До запуска тестов проверить среду repo и использовать подтверждённую общую среду, если worktree не содержит собственной полной."
    source_example: "examples/good-01.md"
