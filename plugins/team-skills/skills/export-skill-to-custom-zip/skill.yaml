source_asset: "Санитизированный рабочий процесс экспорта командного навыка в минимальный пользовательский ZIP без исходной переписки, персональных данных и локальных путей."
status: "team-ready"
summary: "Адаптирует существующий навык для Claude Custom Skills и собирает минимальный статически проверенный ZIP без загрузки в аккаунт."
use_cases:
  - "Подготовить instruction-only навык одним ZIP, сохранив только автономный SKILL.md."
  - "Перенести навык вместе с одним или несколькими реально необходимыми scripts, references, assets или resources."
  - "Удалить из отдельной копии Codex- и repo-зависимости, не меняя исходную папку."
do_not_use_for:
  - "Установка или обновление навыков в Claude Code: для этого используется существующий marketplace репозитория."
  - "Автоматическая загрузка, включение или отправка ZIP через аккаунт пользователя."
  - "Автоматический перенос произвольных исполняемых scripts и зависимостей между несовместимыми средами."
natural_triggers:
  - "Выгрузи этот навык одним ZIP для загрузки в Claude."
  - "Подготовь skill, чтобы я мог отдать один файл пользователю Claude."
  - "Проверь, что в архиве нет лишних repo-файлов и всего хватает."
  - "Сделай минимальный пакет Claude Custom Skills, но ничего не загружай."
example_files:
