exceptions:
  - symptom: "После явного делегирования технических решений агент продолжает спрашивать пользователя о форматах, формулах и внутренних полях."
    root_cause: "Агент не разделил бизнес-смысл, внешний факт и технический выбор, поэтому превратил весь индекс в анкету."
    do_next_time: "Зафиксировать границу делегирования как evidence; технические и методологические решения закрывать DERIVED с воспроизводимым обоснованием, а пользователю задавать только ближайший бизнес-вопрос, меняющий результат."
    source_example: "examples/anti-01-question-dump.md"
  - symptom: "Формула помечена PENDING_CONTEXT только потому, что ещё нет фактических значений для её расчёта."
    root_cause: "Правило расчёта смешано с будущим измеренным значением; разные утверждения ошибочно получили один ID."
    do_next_time: "Разделить вопрос о формуле и вопрос о фактическом значении. Формулу закрыть DERIVED при наличии полномочия и основания, а отсутствующее значение оставить UNKNOWN в отдельной строке."
    source_example: "examples/good-01-delegated-technical-choice.md"
  - symptom: "CSV проходит структурные проверки, но ответ фактически отвечает на соседний вопрос или подтверждает только часть тезиса."
    root_cause: "Совпадение ID, статуса и непустого evidence ошибочно принято за смысловую истинность."
    do_next_time: "После валидатора провести построчный смысловой аудит: буквальный вопрос, полный ответ, достаточность основания и открытые зависимости. Не объявлять скрипт доказательством смысла."
    source_example: "examples/anti-02-invented-closure.md"
  - symptom: "Текст вопроса или текущий ответ переписан напрямую, а старые решения и review продолжают выглядеть действующими."
    root_cause: "Снимок редактировался отдельно от fingerprint и append-only hash-chain либо update не сбросил semantic review."
    do_next_time: "Изменять строку только через manage_decision_register.py update; новый смысл вопроса получает новый ID, а принятый update всегда возвращается в UNREVIEWED до отдельного review event."
    source_example: "tests/test_evidence_bound_decision_register.py"
  - symptom: "MISSING источник используется как доказательство ANSWERED либо UNKNOWN содержит только слова «не знаю»."
    root_cause: "Ожидаемый источник смешан с наблюдаемым evidence, а UNKNOWN не привязан к конкретному способу установления факта."
    do_next_time: "MISSING хранить в manifest и ссылаться только через [needed:...]; ANSWERED использует только OBSERVED evidence, UNKNOWN имеет непустое объяснение и needed source."
    source_example: "examples/good-03-missing-source-chain.md"
  - symptom: "После прерывания процесса answer-register и decision-history больше не сходятся."
    root_cause: "Два отдельных файла нельзя заменить одной файловой атомарной операцией; процесс мог остановиться между заменами."
    do_next_time: "Считать весь bundle невалидным, не продолжать ручную правку, восстановить оба файла из одного последнего версионного снимка и повторить update; в production-реализации хранить state и history в одной транзакционной БД."
    source_example: "scripts/manage_decision_register.py"
