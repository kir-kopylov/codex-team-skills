owner: "@kir-kopylov"
author_github: "@kir-kopylov"
authors:
  - "Кирилл Копылов"
source_asset: "Санитизированная методика ведения нумерованного реестра решений, доказательств, неизвестных и зависимостей; частные вопросы, ответы, имена и пути не переносились."
status: "experimental"
summary: "Ведёт доказательный реестр решений с fingerprint вопросов, source manifest, hash-chain истории, review-gate и безопасным графом зависимостей."
use_cases:
  - "Сверить большой индекс вопросов с реестром ответов после длинного интервью."
  - "Отделить прямые ответы, технические выводы, неизвестные факты, конфликты и зависимые решения."
  - "Проверить, что принятое решение разворачивается до источника и не зависит от незакрытого вопроса."
  - "После одного ответа обновить все покрытые ID и выбрать один следующий бизнес-вопрос."
  - "Мигрировать старый индекс и реестр без выдачи legacy-текста за проверенное доказательство."
do_not_use_for:
  - "Обычное резюме разговора без устойчивых ID и графа зависимостей."
  - "Фактическую сверку платежей, заказов, остатков или иных операционных событий."
  - "Автоматическое утверждение предметных, финансовых, правовых или внешне действующих решений."
  - "Подмену отсутствующего внешнего файла правдоподобным ответом агента."
  - "Извлечение тезисов из сырого длинного чата или картирование существующей production-системы."
natural_triggers:
  - "сверь вопросы с ответами"
  - "собери доказательный реестр решений"
  - "не переспрашивай уже решённое"
  - "пометь, чего мы действительно не знаем"
  - "закрой технические решения сам"
  - "проверь зависимости решений"
example_files:
  - "examples/good-01-delegated-technical-choice.md"
  - "examples/good-02-one-answer-many-ids.md"
  - "examples/good-03-missing-source-chain.md"
  - "examples/anti-01-question-dump.md"
  - "examples/anti-02-invented-closure.md"
last_reviewed: "2026-08-12"
