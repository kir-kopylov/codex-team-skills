exceptions:
  - symptom: "Команда codex найдена, но до выполнения plugin-команд wrapper падает с ENOENT или ссылается на отсутствующий внутренний binary."
    root_cause: "Наличие wrapper в PATH было ошибочно принято за работоспособную штатную CLI."
    do_next_time: "Сразу выполнить codex --version, codex plugin --help и codex plugin list --json. При падении остановиться с BLOCKED_CODEX_CLI; не скачивать обходной installer и не начинать перенос дублей."
    source_example: "examples/good-01.md"
  - symptom: "Marketplace обновился, но codex plugin list --json всё ещё показывает прежнюю semver установленного пакета."
    root_cause: "Обновление источника marketplace было ошибочно принято за переустановку plugin."
    do_next_time: "После каждого add или upgrade marketplace обязательно выполнить codex plugin add team-skills@codex-team-skills --json и проверить id, source, enabled-state и semver повторным list."
    source_example: "examples/good-02.md"
  - symptom: "После обновления канонический skill есть в cache, но одноимённая личная копия продолжает его перекрывать."
    root_cause: "Проверили только установку plugin и не сопоставили канонические имена с активными личными корнями навыков."
    do_next_time: "Построить список имён из проверенного installedPath, затем переносить в карантин только точные совпадения папки и frontmatter name под доказанным личным корнем; уникальные навыки не менять."
    source_example: "examples/good-03.md"
  - symptom: "Кандидат на дубль является ссылкой, находится в неизвестном root, имеет повреждённый frontmatter или не совпадает именем с папкой."
    root_cause: "Совпадение похожего имени было принято за достаточное доказательство владения и конфликта."
    do_next_time: "Не перемещать кандидат, поставить BLOCKED_DUPLICATE_REVIEW и показать одно наблюдаемое расхождение. Не расширять очистку на соседние каталоги."
    source_example: "examples/anti-02.md"
  - symptom: "Агент сообщил об успешном обновлении после plugin list, но текущая сессия всё ещё использует старый список навыков."
    root_cause: "Установка на диске была выдана за runtime-результат без полного перезапуска и проверки новой сессии."
    do_next_time: "Сохранить pending.json, вернуть RESTART_PENDING до перезапуска и ставить LIVE_VERIFIED только после наблюдения контрольного навыка в новой сессии."
    source_example: "examples/anti-01.md"
  - symptom: "Среда не предоставляет безопасный способ полностью перезапустить Codex и автоматически продолжить проверку."
    root_cause: "Навык предположил наличие restart/resume-механизма, которого текущая поверхность не подтвердила."
    do_next_time: "Сохранить контрольную точку, вернуть BLOCKED_RESTART_UNAVAILABLE и назвать одно ручное действие — полностью закрыть и снова открыть Codex. Не имитировать успех и не задавать новый вопрос о разрешении."
    source_example: "examples/good-01.md"
  - symptom: "При отсутствующем plugin агент сразу выполняет чистый marketplace add, хотя на машине остались каталоги, config-блок или фоновая задача прежней схемы."
    root_cause: "Отсутствие записи в plugin list ошибочно принято за чистую машину; legacy-признаки не проверены до изменяющей команды."
    do_next_time: "До clean add проверить точный список legacy-признаков. При любом совпадении поставить LEGACY_TRANSITION_REQUIRED и перейти к START_HERE_RECONNECT_CODEX_SKILLS.md; недоказанное владение даёт BLOCKED_LEGACY_OWNERSHIP."
    source_example: "examples/anti-03-legacy-before-clean-install.md"
  - symptom: "Пользователю обещано, что ещё не установленный team-skills-maintenance установит библиотеку по своей триггерной фразе."
    root_cause: "Процедура обслуживания перепутана с внешним входом первичного подключения."
    do_next_time: "Если skill не виден в текущей сессии, направить первичное подключение через START_HERE_CONNECT_CODEX_SKILLS.md или START_HERE_RECONNECT_CODEX_SKILLS.md и открыть новую сессию."
    source_example: "examples/good-02.md"
