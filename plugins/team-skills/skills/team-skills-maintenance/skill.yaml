owner: "@kir-kopylov"
author_github: "@kir-kopylov"
authors:
  - "Команда codex-team-skills"
source_asset: "Полностью переработанный workflow прежнего team-skills-maintenance и пользовательское требование запускать весь цикл обновления одной фразой без возврата фонового обновлятора."
status: "experimental"
summary: "Обновляет канонический plugin Team Skills, переносит только доказанные локальные дубли в карантин и проверяет результат после перезапуска Codex."
use_cases:
  - "Обновить Team Skills из канонического Git marketplace и повторно установить свежий plugin одной командой пользователя."
  - "Убрать конфликтующие одноимённые личные копии навыков в восстанавливаемый карантин, сохранив уникальные навыки."
  - "Отделить установку на диске от фактической видимости навыков и завершить работу проверкой новой сессии."
  - "Перед первой установкой обнаружить точные следы прежней схемы и направить их в безопасную процедуру переподключения."
do_not_use_for:
  - "Создание или правка содержания навыков; для этого используйте add-team-skill."
  - "Постоянное фоновое обновление, массовое удаление cache или очистка неоднозначных пользовательских каталогов."
  - "Обновление Claude Code без Codex, изменение системной защиты или работа при недоступной штатной группе codex plugin."
  - "Самоустановка, когда skill ещё не виден в текущей сессии; первичный вход описан в START_HERE_CONNECT_CODEX_SKILLS.md."
natural_triggers:
  - "обнови библиотеку навыков"
  - "установи свежую каноническую библиотеку skills"
  - "обнови Team Skills и убери локальные дубли"
  - "переустанови командные навыки из официального репозитория"
  - "приведи библиотеку навыков к одной канонической копии"
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
  - "examples/anti-03-legacy-before-clean-install.md"
