exceptions:
  - symptom: >-
      Самая низкая цена дня («от») рекомендована как лучший вариант, а внутри
      оказалась ловушка-стыковка: десятки часов в пути, ночёвка, повторная регистрация.
    root_cause: >-
      Headline-цена агрегатора принята за цену пригодного рейса без раскрытия состава.
    do_next_time: >-
      Раскрывать состав каждого числа до рекомендации: прямой или стыковка, время
      в пути, ночёвки; ловушки помечать явно и не выдавать за лучший вариант.
    source_example: "examples/good-01-vhod-hub-loukoster.md"
  - symptom: >-
      Западный метапоиск показал «лучшие» маршруты с абсурдным крюком через третью
      страну, и они попали в сравнение как реальные кандидаты.
    root_cause: >-
      Для санкционных/региональных маршрутов западные метапоиски не видят часть
      перевозчиков и выдают мусорную выборку.
    do_next_time: >-
      Подбирать источник под регион маршрута до сравнения; слепоту источника
      фиксировать как факт и переключаться на региональный агрегатор.
    source_example: "examples/good-01-vhod-hub-loukoster.md"
  - symptom: >-
      В перебор входов попал город-омоним из другой страны или региона, и цена
      «входа» посчитана по чужому маршруту.
    root_cause: >-
      Совпадение названий городов (одинаковые или похожие топонимы в разных странах)
      не проверено по IATA-коду.
    do_next_time: >-
      Сверять IATA-код и страну каждого пункта перед добавлением в перебор;
      при сомнении показать пользователю код и страну явно.
    source_example: "examples/good-03-polnyy-perebor-po-gate.md"
  - symptom: >-
      Пользователю обещана экономия от покупки в местной валюте, а живое сравнение
      показало, что местный канал дороже домашнего.
    root_cause: >-
      Валютный арбитраж принят как правило, хотя он зависит от точки продажи,
      курса карты и момента — и бывает отрицательным.
    do_next_time: >-
      Никогда не обещать арбитраж заранее: сравнивать каналы только живыми ценами
      через живой курс карты пользователя и показывать оба числа.
    source_example: "examples/good-02-zhd-split-mestnaya-valyuta.md"
  - symptom: >-
      Регулируемый железнодорожный тариф подан как «отслеживаемая» цена, и на его
      повторное live-подтверждение потрачены вызовы инструментов.
    root_cause: >-
      Не различены рыночная цена (двигается внутри дня) и регулируемый тариф
      (фиксирован приказом, внутри дня не меняется).
    do_next_time: >-
      Регулируемым тарифам ставить статус «регулируемый» без боя за live;
      live-проверку тратить только на рыночные плечи, способные изменить вердикт.
    source_example: "examples/good-02-zhd-split-mestnaya-valyuta.md"
  - symptom: >-
      Рекомендация «лучший вариант — такой-то прямой рейс» устарела за несколько
      часов: дешёвый тариф раскупили, цена выросла на тысячи.
    root_cause: >-
      Снимок цены выдан как устойчивый факт без метки времени и без предупреждения
      о скорости распродажи дешёвых тарифов.
    do_next_time: >-
      Каждую рекомендацию сопровождать датой и временем снимка и предупреждением,
      что дешёвое прямое плечо умирает за часы; при возврате пользователя — пере-снять.
    source_example: "examples/good-01-vhod-hub-loukoster.md"
  - symptom: >-
      Десятки вызовов инструментов сожжены на сломанный виджет сайта (датапикер,
      форма поиска) и на скриншоты там, где цена уже была в заголовке вкладки.
    root_cause: >-
      Нет бюджета вызовов на сайт и иерархии дешёвых способов съёма цены;
      повторные попытки разными механизмами маскируют стену.
    do_next_time: >-
      Держать бюджет 8 вызовов на сайт и иерархию «заголовок вкладки → текст
      страницы → дерево элементов → скриншот»; по исчерпании бюджета ставить
      статус «стена» и передавать шаг пользователю.
    source_example: "examples/anti-01-baseline-v-limite.md"
