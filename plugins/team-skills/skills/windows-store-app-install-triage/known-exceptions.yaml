exceptions:
  - symptom: "Пользователь просит чинить Store/winget, но Get-NetConnectionProfile показывает IPv4Connectivity не Internet."
    root_cause: "Store не является первым подозреваемым: Windows internet-status/NCSI еще не подтверждает полноценную сеть."
    do_next_time: "Остановить этот skill. Сначала выполнить Windows internet-status/NCSI triage; не перезапускать Store-службы и не менять App Installer."
    source_example: "examples/anti-01.md"
  - symptom: "winget install --id STORE_ID --source msstore падает, а winget show --id STORE_ID --source msstore не находит пакет или показывает другого publisher."
    root_cause: "Неверный Store product ID, source или приложение с похожим именем; установка стартовала без проверки identity."
    do_next_time: "Попросить Store URL или точное название + publisher, извлечь product ID, подтвердить через winget show, только потом устанавливать."
    source_example: "examples/good-01.md"
  - symptom: "Store GUI просит войти или покупка/установка не стартует, при этом winget show находит приложение и сеть Internet."
    root_cause: "Проблема в Microsoft Store account/WAM, а не в сети, App Installer или package identity."
    do_next_time: "Проверить dsregcmd /status, WamDefaultSet и вход в Store через ms-windows-store://home / ms-settings:emailandaccounts; не лечить NCSI."
    source_example: "examples/good-02.md"
  - symptom: "Обычный winget/curl работает, но Store/App Installer как UWP не видит локальный proxy/VPN."
    root_cause: "UWP-приложения изолированы от loopback по умолчанию; при локальном proxy/VPN нужны CheckNetIsolation exemptions."
    do_next_time: "Сначала доказать proxy/VPN признаки, затем добавить exemptions только для Microsoft.WindowsStore, Microsoft.StorePurchaseApp и Microsoft.DesktopAppInstaller."
    source_example: "examples/good-03.md"
  - symptom: "Ассистент сразу запускает wsreset, переустановку Store или массовый restart служб."
    root_cause: "Нарушен порядок диагностики: нет проверки IPv4Connectivity, package identity, winget show, WAM, App Installer и конкретных служб."
    do_next_time: "Вернуться к read-only снимку и идти по порядку. Менять только тот слой, где есть доказанный сбой."
    source_example: "examples/anti-02.md"
