owner: "@kir-kopylov"
status: "experimental"
summary: "Runbook для случаев, когда Microsoft Store или winget --source msstore не устанавливает приложение при уже корректном Windows IPv4Connectivity = Internet."
use_cases:
  - "Приложение из Microsoft Store не устанавливается через Store GUI или winget msstore, но Windows уже показывает IPv4Connectivity = Internet."
  - "Нужно подтвердить Store product ID, publisher, package name и source msstore перед установкой."
  - "winget show --source msstore, winget install --source msstore или App Installer падают до установки конкретного Store-приложения."
  - "Microsoft Store требует вход, WAM выглядит сломанным или dsregcmd /status показывает проблему вокруг WamDefaultSet."
  - "Store/App Installer не ходит через локальный proxy/VPN, и нужно проверить loopback exemptions только после доказательства proxy/VPN признаков."
do_not_use_for:
  - "Windows/NCSI No internet или IPv4Connectivity не Internet: сначала нужна диагностика Windows internet-status, а не Store."
  - "Полностью мертвая сеть, обход блокировок, региональных/возрастных/лицензионных ограничений Store или корпоративных политик."
  - "Установка приложений не из Microsoft Store/msstore source, обычные EXE/MSI/MSIX вне Store или починка Codex/GitHub/npm/pip networking."
  - "Массовый сброс Store, переустановка Windows Store, правка DNS/proxy/firewall/hosts или loopback exemptions без доказанного proxy/VPN сигнала."
natural_triggers:
  - "Microsoft Store не устанавливает приложение"
  - "winget install --source msstore падает"
  - "проверь Store ID и publisher перед установкой"
  - "App Installer сломан"
  - "Store просит вход или WAMDefaultSet"
  - "Store не работает через VPN или proxy"
  - "установи приложение из Microsoft Store по ID"
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
last_reviewed: "2026-07-07"
source_asset: "Сформирован из рабочей диагностики Windows 10/11, где NCSI false-offline был отделен от отдельной проблемы установки приложения через Microsoft Store/winget msstore. Приватные аккаунты, пути и raw логи не переносились."
