owner: "@kir-kopylov"
status: "team-ready"
summary: "Незаметно замечает связанные микрошаги и предлагает собрать цельный рабочий эпизод только после паттерна или явного риска."
use_cases:
  - "Выполнить первый небольшой запрос сразу, но запомнить его как возможное начало рабочего эпизода."
  - "Заметить серию связанных правок вокруг одного текста, prompt, документа, письма, кода или плана."
  - "После устойчивого паттерна предложить пользователю выбор: продолжать по кускам или собрать цельный prompt для агента."
  - "Если пользователь недоволен вмешательством runtime, собрать feedback packet для автора skill без требования вручную копировать trace или разбираться в каналах отправки."
do_not_use_for:
  - "Первый простой низкорисковый запрос, который можно выполнить без расширения задачи."
  - "Ситуации, где пользователь явно просит сделать быстро, без вопросов, только перевести или только исправить."
  - "Аналитический аудит поведения krupnee_lift; для этого используйте krupnee-review."
  - "Жалобы на качество обычного результата, которые не связаны с поведением krupnee-runtime, lift, hint или risk override."
natural_triggers:
  - "переведи, теперь сократи, теперь сделай теплее"
  - "переделай промпт, убери лишнее, добавь условия срабатывания"
  - "сделай список, добавь критерии, оформи как инструкцию"
  - "напиши клиенту ответ, но не хватает цели или ограничений"
  - "зачем ты это предложил"
  - "ты опять полез со своим lift"
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/good-04-feedback-loop.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
  - "examples/anti-03-ordinary-result-complaint.md"
last_reviewed: "2026-06-28"
source_asset: "Спецификация krupnee Lift 0.2.0, переданная пользователем; repo-пакет сохраняет разделение короткого runtime и длинного review без raw-приватного контекста."
