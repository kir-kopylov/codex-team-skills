owner: "@kir-kopylov"
status: "experimental"
summary: "Собирает короткий отзыв из расшифровки и наблюдений автора, сохраняя сцену, существенные обстоятельства и точные реплики."
use_cases:
  - "Превратить документированный разговор в один отзыв, который читается как история."
  - "Сократить перепалку в черновике, сохранив заданную сцену и существенную встречную позицию."
  - "Усилить финал возвращением к известной детали без добавления морали и новых фактов."
do_not_use_for:
  - "Расшифровка или удостоверение содержания необработанного видео и аудио."
  - "Выдумывание свидетельств, мотивов и прямых цитат; гарантирование реакции читателя."
  - "Юридическая оценка, построение эскалации, подбор кадров, отправка или публикация."
  - "Простое оформление, перевод или вставка фотографий в уже утверждённый текст."
natural_triggers:
  - "Собери отзыв из расшифровки"
  - "Сократи перепалку в отзыве, сохрани сцену"
  - "Сделай из записи разговора рассказ-отзыв"
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
last_reviewed: "2026-10-18"
