exceptions:
  - symptom: "Контракт содержит числовой budget и stop rule, но пользователь принимает их за автоматический hard enforcement без работающего runtime."
    root_cause: "Shaper описал желаемое поведение исполнителя, не отделив текстовое условие от наблюдаемого счётчика и механизма запрета следующего tool call."
    do_next_time: "После подтверждения передать draft владельцу schema через goalrt; показать hard/partial/advisory/uncovered, а без runtime прямо назвать режим supervised text-only."
    source_example: "examples/anti-08-hard-token-budget.md"
  - symptom: "Ассистент начинает выполнять целевую задачу вместо shaping."
    root_cause: "Сырая цель выглядит как обычная практическая задача, и режим goal-shaper не удержан."
    do_next_time: "Сразу сказать, что skill не выполняет задачу и не запускает /goal; перейти к checklist и задать один вопрос."
    source_example: "examples/anti-01-execute-task.md"
  - symptom: "Пользователь раздражается на служебный заголовок, который показывает внутреннюю механику чеклиста."
    root_cause: "Заголовок показывает внутреннюю механику чеклиста вместо человеческого процесса выявления."
    do_next_time: "Использовать 'Сейчас выявляем' и коротко объяснить, какое условие контракта формируется."
    source_example: "examples/good-01-live-state-goal.md"
  - symptom: "Вопрос получается перегруженным и смешивает несколько решений."
    root_cause: "Ассистент пытается закрыть сразу статус, приоритет канала и тайминг."
    do_next_time: "Переформулировать до одного конкретного решения, ответ на которое можно вставить в контракт."
    source_example: "examples/good-01-live-state-goal.md"
  - symptom: "Ассистент сужает цель до доменного сценария и пропускает механику создания ценности."
    root_cause: "Goal shaping начинается с привычного checklist по live-state, а не с объекта работы, ценности, ролей, единиц процесса, потери, стоимости и риска."
    do_next_time: "Сначала выявить универсальную грамматику деятельности: что меняем, для кого это ценно, кто проверяет реальность, кто действует, что является одним кругом и что теряется без действия."
    source_example: "examples/good-04-value-creation-cycle.md"
  - symptom: "Пункт «Память» помечен закрытым декоративной строкой про журнал; слой хранилища и возобновления вскрывает сам пользователь вопросом «где будут храниться промежуточные состояния?»."
    root_cause: "Checklist трактовал память как перечень «что сохраняем», не требуя физического носителя, порядка записи и протокола возобновления после обрыва сессии."
    do_next_time: "Для цели длиннее одной сессии явно спросить: путь хранилища, состав артефактов, write-ahead порядок записи, шаги возобновления, пересчет дедлайнов по календарю от меток журнала, защита от повторных внешних действий при возобновлении."
    source_example: "examples/anti-03-declarative-memory.md"
  - symptom: "Финальный контракт отбит целевой командой: /goal принимает максимум 4000 знаков, контракт содержал больше; лимит не был известен skill и длина не проверялась."
    root_cause: "Skill формирует вход для команды, ограничений формата которой не знает, и не имеет шага программной проверки длины перед сдачей финала."
    do_next_time: "Собирать черновик с бюджетом ~3500 знаков, показывать счетчик в блоке Статус, перед выдачей мерить длину скриптом и сообщать замер; при превышении сжимать формулировки, а не согласованные условия."
    source_example: "examples/good-05-format-limit-check.md"
  - symptom: "Пользователь подтверждает составное предложение цитатой только его части, а непроцитированный параметр молча считается принятым."
    root_cause: "Составной вопрос смешал несколько решений, и подтверждение цитатой не разделено на принятое и пропущенное."
    do_next_time: "Непроцитированные части считать не принятыми и дозакрывать отдельными вопросами; составной вопрос разделять до отправки тестом «достаточный ответ вставляется в контракт одной строкой»."
    source_example: "examples/good-06-partial-quote-confirmation.md"
  - symptom: "Контракт выдал полномочие как флаг «агент пишет сам»; невооружённый consent-слой инструмента всплыл на исполнении, одобрение печатали в чат агента — это отменяло нативный диалог, агент перезапускал его, возник шторм окон."
    root_cause: "Полномочие смоделировано булевым флагом, без цепочки посредников (учётка → инструмент → каждый consent-слой → цель) и без называния точного органа выдачи каждого согласия; канал одобрения не был проговорён."
    do_next_time: "Human-only согласия вооружать pre-flight чек-листом с точным органом (поверхность + кнопка + жест) и самым широким грантом; в контракт вписывать gate-circuit-breaker (отклонённый gate не ретраить, дважды без успеха → STOP → BLOCKED) и предупреждение, что одобрение не в том канале может быть активным отказом."
    source_example: "examples/anti-04-authority-as-flag.md"
  - symptom: "Условие успеха контракта недостижимо силами агента в одиночку (финальная ступень требовала грантов, которые может дать только человек), состояния «жду внешнего» в контракте не было — проверка завершения твердила «не готово», агент осциллировал и импровизировал паузу."
    root_cause: "На приёмке контракта под-условия успеха не раскладывались по держателям сил; словарь состояний круга не содержал BLOCKED как валидного состояния покоя."
    do_next_time: "Гейт приёмки: каждое под-условие финала → чья сила и кто держатель; не-агентское → грант до старта или BLOCKED-маршрут (причина, что нужно, от кого, условие возобновления), который проверка завершения принимает как «не провал»."
    source_example: "examples/anti-05-unsatisfiable-final.md"
  - symptom: "Пользователь честно жмёт «разрешить навсегда» в диалоге согласий, но окно возвращается на каждое действие (десятки нажатий за сессию); список выданных разрешений платформы остаётся пустым."
    root_cause: "Орган выдачи гранта сломан: кнопка молча записывала разовый грант вместо вечного (Claude-in-Chrome v1.0.79, github.com/anthropics/claude-code/issues/74715); вооружение считалось закрытым по факту жеста, след гранта в хранилище платформы никто не проверял."
    do_next_time: "Грант = след, а не жест: после каждого жеста вооружения сверять авторитетное место платформы (список разрешённых сайтов, настройки, хранилище); следа нет → орган сломан → известный обход или BLOCKED, а не жать кнопку по кругу; Phase-0 засчитывать только при «тишине разрешений»; для browser-цели вооружать все домены цикла сразу."
    source_example: "examples/anti-06-grant-gesture-without-trace.md"
  - symptom: "Skill задаёт подтверждающий вопрос, хотя из уже принятого контракта следует единственный жизнеспособный ответ."
    root_cause: "Правило «один вопрос за раз» ошибочно стало требованием задавать вопрос на каждом шаге, даже когда решения владельца нет."
    do_next_time: "Применить гейт настоящего вопроса: однозначное следствие записать самостоятельно, показать полный контракт и перейти к ближайшему реальному выбору."
    source_example: "examples/good-09-real-question-gate.md"
  - symptom: "Новое условие принято вместе с ранее принятым противоположным условием."
    root_cause: "Перед фиксацией ответа не выполнена проверка совместимости со всем текущим контрактом."
    do_next_time: "Не принимать новое условие; показать конфликт и практическое последствие, затем задать один настоящий вопрос о выборе."
    source_example: "examples/anti-09-conflicting-conditions.md"
  - symptom: "Разногласие ревьюера по одному утверждению остановило весь цикл, хотя оставались независимые единицы работы."
    root_cause: "Локальный блокер не был отделён от общего состояния цели."
    do_next_time: "Записать разногласие, оставить утверждение непринятым, пометить затронутую ветку `BLOCKED(scope=local)` и продолжить независимую работу."
    source_example: "examples/good-10-local-blocked-progress.md"
  - symptom: "При каждом возобновлении или append исполнитель перечитывает весь растущий журнал."
    root_cause: "Контракт назвал append-only журнал, но не определил контрольную точку и курсор хвоста."
    do_next_time: "В обычном цикле загружать валидную контрольную точку и только хвост после неё; полный проход оставлять для аудита, восстановления или невалидной точки."
    source_example: "examples/good-11-checkpoint-tail-resume.md"
  - symptom: "Утверждённый контракт назван опубликованным или запущенным, а назначение созданных файлов осталось непонятным."
    root_cause: "Состояния `APPROVED`, `PUBLISHED` и `STARTED` были слиты в одно слово «готово»."
    do_next_time: "Развести три состояния по наблюдаемым следам, показать карту файлов и завершить одним следующим действием с владельцем и проверкой."
    source_example: "examples/good-12-lifecycle-handoff.md"
