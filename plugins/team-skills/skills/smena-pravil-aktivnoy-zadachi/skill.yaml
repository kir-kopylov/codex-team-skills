owner: "@kir-kopylov"
status: "experimental"
summary: "Применяет принятое изменение правила к связанным источникам активной задачи и проверяет сохранённый следующий шаг."
source_asset: "Обезличенные случаи изменения правил длительной задачи: отмена условия, изменение достаточности сведений и новая проверка перед действием."
use_cases:
  - "Отменить требование в управляющей инструкции, сохранённом состоянии и существующем продолжении."
  - "Изменить принятое условие перехода и убрать зависимость следующего шага от прежнего правила."
  - "Применить новую обязательную проверку к уже подготовленным, но не выполненным действиям."
do_not_use_for:
  - "Выбор ещё не принятого правила или первоначальное проектирование контракта."
  - "Разовая правка одного документа без зависимых источников выполнения."
  - "Возобновление остановленной задачи, её предметное исполнение или изменение соседних процессов."
natural_triggers:
  - "Убери это правило из текущей работы и продолжения."
  - "Примени новое условие ко всей действующей задаче."
  - "Мы поменяли договорённость; обнови сохранённый следующий шаг."
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
last_reviewed: "2026-09-18"
