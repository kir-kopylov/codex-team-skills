exceptions:
  - symptom: "Существование ранее настроенного расписания не подтверждено: представление автоматизации отчиталось только об отрисовке, известный файл настройки отсутствует, а доступ к приложению запрещён политикой безопасности."
    root_cause: "Прежнее состояние принято за доказательство действующего расписания."
    do_next_time: "Проверять расписание профильным инструментом и известной настройкой; при запрете доступа не обходить его и не заявлять обновление, а оставить блокирующее ограничение видимым."
    source_example: "examples/good-01.md"
  - symptom: "Подпись получателя совпала с двумя кнопками в списке, а из набранного текста пропал символ."
    root_cause: "Выбор по видимой подписи не был уникальным; механизм пропажи символа из набранного текста остался неизвестным, а поймали её только сверкой поля до отправки."
    do_next_time: "Выбирать элемент по уникальному наблюдаемому признаку и перед отправкой сверять точное значение поля с исходником, включая знаки и числовые разделители."
    source_example: "examples/good-02.md"
  - symptom: "Пользователь прямо выбрал фильтр площадки, которого нет в списке значений, а прежнее требование отдельного расчёта осталось в силе."
    root_cause: "Сохранённое старое требование считалось действующим вопреки прямой коррекции пользователя."
    do_next_time: "Применять выбранный пользователем фильтр площадки и проверять его метку в интерфейсе; не подменять отсутствующее значение соседним и не требовать расчёта, который пользователь отменил."
    source_example: "examples/good-01.md"
