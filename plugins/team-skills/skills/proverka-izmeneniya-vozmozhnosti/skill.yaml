owner: "@kir-kopylov"
author_github: "@kir-kopylov"
authors:
  - "Кирилл Копылов"
source_asset: "Санитизированный рабочий процесс доказательной проверки изменений возможностей: отделяет новое действие от новой пользовательской возможности, смену default от добавления и доступность от анонса."
status: "experimental"
summary: "Проверяет, произошло ли реальное изменение одной возможности между сопоставимыми состояниями."
use_cases:
  - "Проверить, является ли заявленная новинка настоящим добавлением, сменой default, ограничением или переименованием."
  - "Сравнить одну пользовательскую возможность между версиями, тарифами или интерфейсами без ложного перехода «раньше → теперь»."
  - "Остановить формулировку «раньше было нельзя», когда старое состояние не доказано."
do_not_use_for:
  - "Сбор полного дайджеста, персональная рекомендация или отправка письма."
  - "Сравнение несопоставимых продуктов, тарифов, ролей или условий как будто это один и тот же опыт."
  - "Вывод об отсутствии функции по ошибке сети, авторизации или молчанию документации."
natural_triggers:
  - "это правда новая возможность"
  - "сравни с предыдущей версией"
  - "не выдавай смену default за новую функцию"
  - "раньше это точно было нельзя"
  - "это новый результат или новый способ"
example_files:
  - "examples/good-01-default-changed.md"
  - "examples/good-02-added.md"
  - "examples/good-03-new-route.md"
  - "examples/anti-01-missing-before.md"
  - "examples/anti-02-announcement-not-access.md"
last_reviewed: "2026-09-10"
