exceptions:
  - symptom: "В дайджест попало «теперь можно менять глубину работы», хотя прежняя версия уже давала те же уровни выбора."
    root_cause: "Смену модели или автоматического поведения перепутали с появлением самого пользовательского результата."
    do_next_time: "Сначала доказать прежний и текущий результат в одинаковых условиях; при сохранении возможности выбрать DEFAULT_CHANGED или UNCHANGED, а не ADDED."
    source_example: "examples/good-01-default-changed.md"
  - symptom: "Новая кнопка в чате была названа новой возможностью, хотя тот же результат раньше достигался через API."
    root_cause: "Новый путь выполнения не сравнили с прежним пользовательским результатом и условиями доступа."
    do_next_time: "Проверить тождество результата, доступ и ограничения; при различии написать «ещё один способ» или EXPANDED, не ADDED."
    source_example: "examples/good-03-new-route.md"
  - symptom: "Ошибка авторизации была выдана за доказательство того, что прежняя версия не поддерживала функцию."
    root_cause: "Технический сбой окружения приняли за отрицательное доказательство способности."
    do_next_time: "Пометить результат UNKNOWN и искать прямое старое ограничение, исчерпывающую схему или воспроизводимый отказ именно функции."
    source_example: "examples/anti-01-missing-before.md"
