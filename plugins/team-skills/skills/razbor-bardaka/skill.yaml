owner: "@kir-kopylov"
author_github: "@kir-kopylov"
status: "experimental"
summary: "Наведение порядка в информационной свалке (файлы, заметки, закладки, промпты, папки приложений): инвентаризация содержимого, вопросы владельцу на живых примерах, два варианта структуры папок, наглядная HTML-карта «что куда переедет», перекладка только после утверждения с пробой на одном объекте. Экспериментальный: собираем обратную связь команды через штатный опрос после использования."
use_cases:
  - "Разобрать захламлённую коллекцию сохранённых шаблонов или промптов в менеджере буфера обмена и разложить по понятным папкам."
  - "Навести порядок в папке с сотнями накопленных файлов: понять, что там лежит, предложить структуру, показать карту, переложить после «да»."
  - "Упорядочить закладки браузера или заметки: найти дубли, предложить структуру папок под то, как владелец реально ищет."
  - "Повторно догнать порядок в уже разобранной коллекции: классифицировать только новое, не трогая прошлые решения владельца."
do_not_use_for:
  - "Освобождение места на диске: чистка кэшей и удаление дублей ради гигабайт — отдельная задача, не структура."
  - "Задачи, дела и обязательства («разбери мои дела» — это vtoroy-mozg)."
  - "Механическое переименование файлов по шаблону или поиск одного конкретного файла."
  - "Разовая сортировка пары файлов без повторяемой структуры."
natural_triggers:
  - "наведи порядок в моих заметках"
  - "разбери бардак в закладках"
  - "разбери мои промпты по папкам"
  - "систематизируй мою коллекцию"
  - "упорядочи файлы, у меня свалка"
  - "разложи это по папкам, чтобы можно было найти"
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
last_reviewed: "2026-08-04"
authors:
  - "Кирилл Копылов"
source_asset: "Обобщён из обезличенного рабочего разбора личной коллекции промптов (менеджер буфера обмена, ~300 объектов, 29 папок с нечитаемыми именами): raw-данные, тексты промптов и приватные пути в repo не переносились."
