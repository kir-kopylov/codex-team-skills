owner: "@kir-kopylov"
author_github: "@kir-kopylov"
authors:
  - "Кирилл Копылов"
status: "draft"
summary: "Нижний слой рендера: готовая структура или markdown в .docx по стандарту (Times New Roman, A4, поля 2/2/2.5/1.5, пустые графы «____», таблица подписей без рамок)."
use_cases:
  - "Собрать .docx из готовой структуры (JSON-блоки title/heading/para/city_date/signature_table) с единым стандартом оформления."
  - "Отрендерить готовый текст договора, расписки или акта в Word: Times New Roman, A4, поля 2/2/2.5/1.5 см, таблица подписей без рамок."
  - "Дать верхним скиллам (raspiska-o-poluchenii-deneg, remont-dogovor-i-raspiski) единый низкоуровневый рендер, чтобы не дублировать вёрстку."
do_not_use_for:
  - "Сочинять содержание документа или проверять смысловые инварианты (суммы, хронологию, реквизиты) — это делает верхний скилл."
  - "Заполнять пустые графы личных данных вместо человека: пустые места остаются маркером «____»."
  - "Экспортировать в форматы кроме .docx (PDF, ODT, HTML) — рендер заточен только под Word."
natural_triggers:
  - "свёрстай договор в docx по стандарту"
  - "отрендери готовый текст в word"
  - "оформи расписку в docx — шрифт и поля"
  - "собери docx из готовой структуры"
  - "сделай word-файл по стандарту"
example_files:
  - "examples/good-01.md"
  - "examples/good-02.md"
  - "examples/good-03.md"
  - "examples/anti-01.md"
  - "examples/anti-02.md"
last_reviewed: "2026-08-04"
source_asset: "Обобщённая методика рендеринга готовых договоров, расписок и актов в DOCX; исходные документы и персональные реквизиты в репозиторий не переносились."
