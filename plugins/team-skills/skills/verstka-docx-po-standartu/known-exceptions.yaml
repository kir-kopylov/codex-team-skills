exceptions:
  - symptom: "В готовом .docx кириллица отрисовалась не Times New Roman, а дефолтным шрифтом (например, Calibri)."
    root_cause: "Имя шрифта выставлено только через run.font.name (ascii/hAnsi) без явного w:cs, поэтому часть кириллических глифов уехала на шрифт по умолчанию."
    do_next_time: "Проставлять шрифт на каждый run через хелпер _set_font: ascii + hAnsi + cs одновременно, не полагаться только на стиль Normal."
    source_example: "examples/good-01.md"
  - symptom: "Рендер начал сам подставлять данные в пустые графы «____» из верхнего контекста."
    root_cause: "Размыта граница слоёв: технический рендер взял на себя ответственность за содержание."
    do_next_time: "Оставлять «____» как есть; заполнение граф — только верхний скилл. Пустой маркер в готовом файле — норма, а не дефект рендера."
    source_example: "examples/anti-01.md"
